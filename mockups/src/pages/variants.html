<title>Exec Board · варианты подачи</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<style>
__CSS__
</style>
<style>
/* ---- дополнительные стили макета вариантов */
.intro { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.intro .card { gap: 8px; }
.intro .card h3 { font-family: var(--serif); font-size: 18px; }
.intro .card p { font-size: 13px; color: var(--ink-2); line-height: 1.45; }
.intro .card .src { font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; }
.verdict { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.verdict .card { gap: 6px; }
.verdict ul { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }
.verdict .card-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* вариант A — Amazon WBR */
.wbr-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.wbr { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.wbr-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 600; line-height: 1.25; }
.wbr-num { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; }
.wbr-charts { display: grid; grid-template-columns: 5fr 8fr; gap: 6px; align-items: end; }
.wbr-charts .lbl { font-size: 10px; color: var(--muted); text-align: center; }
.box { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; font-size: 10.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 4px; font-variant-numeric: tabular-nums; }
.box b { display: block; color: var(--ink); font-weight: 600; font-size: 12px; }
.wbr .exc { font-size: 11px; line-height: 1.3; color: var(--ink-2); display: grid; grid-template-columns: 10px 1fr; gap: 6px; align-items: start; }
.wbr .exc i { margin-top: 4px; }
.wbr .own { font-size: 10.5px; color: var(--muted); }
.mono .ch .cur, .mono .ch .ln.s0 { stroke: var(--ink); }
.mono .ch .dot, .mono .ch .dot.s0 { fill: var(--ink); }
.mono .ch .prior, .mono .ch .ln.s1 { stroke: var(--prior); }
.mono .ch .dot.s1 { fill: var(--prior); }

/* вариант B — нарративная записка */
.memo { max-width: 76ch; font-family: var(--serif); font-size: 16px; line-height: 1.55; }
.memo p { margin: 0 0 14px; text-wrap: pretty; }
.memo p .lead { font-weight: 600; }
.memo .sp { display: inline-block; vertical-align: middle; margin: 0 2px 0 6px; }
.memo .sp .spark { height: 16px; }
.memo b { font-weight: 600; }
.faq { margin: 0; }
.faq dt { font-weight: 600; margin-top: 12px; font-size: 13.5px; }
.faq dt:first-child { margin-top: 0; }
.faq dd { margin: 4px 0 0; color: var(--ink-2); font-size: 13px; line-height: 1.45; }
.faq dd .a { color: var(--muted); font-size: 11.5px; display: block; margin-top: 2px; }

/* вариант C — сигнальная доска */
.sigrows { display: flex; flex-direction: column; }
.sigrow { display: grid; grid-template-columns: 14px 1.6fr 88px 150px 110px 2fr 1.8fr; gap: 14px; align-items: center; padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
.sigrow.head { font-size: 11px; color: var(--muted); font-weight: 500; padding: 4px 8px; border-bottom: 1px solid var(--line-2); }
.sigrow .t { font-weight: 600; line-height: 1.3; }
.sigrow .t small { display: block; font-weight: 400; color: var(--ink-2); font-size: 12px; margin-top: 2px; }
.sigrow .v { font-size: 22px; font-weight: 600; line-height: 1; }
.sigrow .d { font-size: 12px; color: var(--muted); line-height: 1.5; font-variant-numeric: tabular-nums; }
.sigrow .d b { color: var(--ink); font-weight: 500; }
.sigrow .q { font-size: 12.5px; line-height: 1.35; }
.sigrow .q .to { display: block; color: var(--muted); font-size: 11.5px; }
.sigrow .o { font-size: 12px; color: var(--ink-2); }
.stable-strip { display: flex; flex-wrap: wrap; gap: 8px 22px; padding: 6px 0; }
.stable-chip { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.stable-chip b { color: var(--ink); font-weight: 600; }

/* сравнение */
.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.cmp th { text-align: left; font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line-2); font-size: 12px; }
.cmp td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.4; }
.cmp td:first-child { font-weight: 500; white-space: nowrap; }
.cmp .best { color: var(--ok-text); font-weight: 600; }
.cmp .worst { color: var(--red-text); }
.cmp { min-width: 620px; }
@media (max-width: 1100px) {
  .intro, .verdict, .wbr-grid { grid-template-columns: 1fr; }
  .sigrow { grid-template-columns: 14px 1fr 88px; }
  .sigrow .d, .sigrow .sp, .sigrow .q, .sigrow .o { display: none; }
}
@media (max-width: 640px) {
  .sigrow { grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; }
  .sigrow .v { font-size: 19px; }
  .stable-strip { gap: 6px 14px; }
  .stable-chip { overflow-wrap: anywhere; }
  .memo { font-size: 15px; }
  .box { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .wbr-charts { grid-template-columns: 1fr; }
}
</style>
