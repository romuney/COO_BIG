<style>
/* ============================================================ ПУЛЬТ — приложение, а не документ
   Пять вкладок внизу, поиск, шторка с деталями метрики. Вкладка «Все» держит весь каталог.
   Светло-серый интерфейс, один индиговый акцент, статусы — отдельная шкала. Есть тёмная тема. */
:root {
  color-scheme: light;
  --bg: #EDEFF4;
  --surf: #FFFFFF;
  --surf-2: #F5F6FA;
  --ink: #0B0F1C;
  --ink-2: #474E62;
  --muted: #838A9C;
  --rule: #E3E6EE;
  --accent: #3B4EF0;
  --accent-soft: #E6E9FF;
  --red: #D5342A; --red-soft: #FCE8E6;
  --amber: #A96A05; --amber-soft: #FBF0DC;
  --green: #12784A; --green-soft: #E2F2E9;
  --shadow: 0 1px 2px rgba(11,15,28,.06), 0 10px 30px rgba(11,15,28,.08);
  --sheet-shadow: 0 -8px 40px rgba(11,15,28,.22);
  --sans: "Golos Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --tabh: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #080A11; --surf: #12161F; --surf-2: #191E29;
    --ink: #EDF0F7; --ink-2: #A8B0C2; --muted: #767E92; --rule: #232936;
    --accent: #8290FF; --accent-soft: #1B2140;
    --red: #FF7466; --red-soft: #34181A; --amber: #DFA53E; --amber-soft: #33270F;
    --green: #4FC486; --green-soft: #102E1F;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.4);
    --sheet-shadow: 0 -8px 40px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #080A11; --surf: #12161F; --surf-2: #191E29;
  --ink: #EDF0F7; --ink-2: #A8B0C2; --muted: #767E92; --rule: #232936;
  --accent: #8290FF; --accent-soft: #1B2140;
  --red: #FF7466; --red-soft: #34181A; --amber: #DFA53E; --amber-soft: #33270F;
  --green: #4FC486; --green-soft: #102E1F;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.4);
  --sheet-shadow: 0 -8px 40px rgba(0,0,0,.6);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; overflow-x: hidden; overscroll-behavior-y: none; }
h1, h2, h3, p { margin: 0; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 620px; margin: 0 auto; }

/* ---------------------------------------------------------------- шапка */
.hdr { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(14px); border-bottom: 1px solid var(--rule); }
.hdr .in { padding: calc(var(--safe-t) + 12px) 16px 12px; display: flex; align-items: center; gap: 10px; }
.hdr .ttl { font-family: var(--display); font-weight: 900; font-size: 18px; letter-spacing: -.02em; }
.hdr .sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
.hdr .sp { flex: 1; }
.hdr .ico { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--rule); background: var(--surf); display: grid; place-items: center; cursor: pointer; flex: none; }
.hdr .ico svg { width: 17px; height: 17px; fill: none; stroke: var(--ink-2); stroke-width: 1.8; stroke-linecap: round; }

/* ---------------------------------------------------------------- контент */
main { padding: 14px 16px calc(var(--tabh) + var(--safe-b) + 26px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.pane { display: none; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.pane.on { display: grid; animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .pane.on { animation: none; } * { transition: none !important; } }

.card { min-width: 0; background: var(--surf); border: 1px solid var(--rule); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.lbl { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.h2 { font-weight: 600; font-size: 17px; line-height: 1.3; margin-top: 10px; text-wrap: balance; }
.tx { color: var(--ink-2); font-size: 14.5px; line-height: 1.55; margin-top: 9px; text-wrap: pretty; }
.viz { margin-top: 14px; }
.sect { display: flex; align-items: baseline; gap: 10px; padding: 10px 2px 0; }
.sect h3 { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: -.01em; overflow-wrap: anywhere; }
.sect .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* герой вкладки «Сводка» */
.hero { background: var(--ink); color: var(--bg); border: 0; }
.hero .lbl { color: color-mix(in srgb, var(--bg) 62%, transparent); }
.hero .num { font-family: var(--display); font-weight: 900; font-size: 52px; line-height: 1; letter-spacing: -.04em; margin-top: 10px; }
.hero .cap { font-family: var(--mono); font-size: 11.5px; color: color-mix(in srgb, var(--bg) 70%, transparent); margin-top: 10px; line-height: 1.5; }
.hero .gauge { margin-top: 16px; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--bg) 22%, transparent); overflow: hidden; position: relative; }

т учёта.","how":"Помесячные срезы численности, сравнение сегмента одного и того же сотрудника","source":"Кадровый учёт, помесячные срезы","unknown":"Мы видим смену сегмента, но не видим содержания работы. Возможно, это реальная передача функций в Support — тогда должно быть решение оргкомитета по каждому случаю. Мы его не искали.","owner":"HRBP, оргдизайн","question":"Это передача функций или способ уместиться в лимит? По каждому ли случаю есть решение оргкомитета?","months":["янв","фев","мар","апр","май","июн","июл","авг"],"series":[1,2,2,3,2,2,13,15],"priority":1},{"id":"managers_leaving","kicker":"Ускорение","claim":"Общая текучесть падает, а руководители уходят всё быстрее","value":9.8,"unit":"%","value_note":"годовая текучесть руководителей против 7,1% год назад","text":"Средняя цифра по компании выглядит хорошо: 12,1% против 13,4%. Но внутри неё руководители ускоряются шестой месяц подряд. Их доля в оттоке выросла с 8% до 11% при неизменной доле в численности — 13%. Две трети ушедших — Discovery Core и Other Digital.","how":"Отток × признак руководителя, скользящее окно 12 месяцев, разрез по сегментам","source":"HRS, exit-интервью","unknown":"Причины мы берём из exit-интервью, а там люди редко говорят прямо. Рост причины «руководитель / команда» с 12% до 16% — сигнал, но не диагноз.","owner":"HRBP направлений","question":"Что показали exit-интервью руководителей Discovery Core за квартал?","months":["сен","окт","ноя","дек","янв","фев","мар","апр","май","июн","июл","авг"],"series":[7.2,7.1,7.2,7.1,7.2,7.4,7.9,8.3,8.8,9.2,9.6,9.8],"compare":[7.6,7.5,7.4,7.3,7.2,7.2,7.1,7.1,7.0,7.1,7.1,7.1],"priority":1},{"id":"managers_without_teams","kicker":"Звание вместо денег","claim":"Шестьсот двенадцать руководителей, которым некем руководить","value":612,"unit":"руководителей","value_note":"21% всех, команда меньше четырёх человек","text":"Каждый пятый руководитель управляет командой меньше четырёх человек, в Discovery Core — каждый третий. С начала года руководителями ст <script>/* mobile.js — примитивы для мобильных макетов: кольца, спарклайны, воронки, полосы.
   Все размеры заданы под палец, цвета берутся из CSS-переменных через currentColor и токены. */
const MB = (() => {
  const NB = ' ';
  const int = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, NB);
  const num = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  /** Значение метрики в её формате. */
  function val(v, fmt, d) {
    if (v == null) return '—';
    if (fmt === 'text') return esc(v);
    if (fmt === 'int') return int(v);
    if (fmt === 'num') return num(v, d == null ? 2 : d);
    return num(v, d == null ? (Number.isInteger(v) ? 0 : 1) : d) + '%';
  }
  /** Изменение со знаком; для процентов добавляем «п.п.». */
  function delta(v, fmt, pp = true) {
    if (v == null || isNaN(v)) return null;
    const s = v > 0 ? '+' : v < 0 ? '−' : '±', a = Math.abs(v);
    if (fmt === 'int') return s + int(a);
    if (fmt === 'num') return s + num(a, 2);
    return s + num(a, Number.isInteger(a) ? 0 : 1) + (pp ? NB + 'п.п.' : '%');
  }
  /** Класс окраски изменения: хорошо это или плохо, зависит от направления метрики. */
  function dcls(v, good) {
    if (!v || good === 'none' || good === 'range' || good == null) return 'flat';
    if (good === 'down') return v > 0 ? 'bad' : 'good';
    return v > 0 ? 'good' : 'bad';
  }

  /* ---------------------------------------------------------------- кольцо прогресса */
  function ring(o) {
    const S = o.size || 120, sw = o.stroke || 10, r = (S - sw) / 2, C = 2 * Math.PI * r;
    const pct = Math.max(0, Math.min(1, (o.value || 0) / (o.max || 100)));
    const tgt = o.target != null ? Math.max(0, Math.min(1, o.target / (o.max || 100))) : null;
    let s = `<svg class="mb ring" viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img" aria-label="${esc(o.label || '')}">`;
    s += `<circle class="track" cx="${S / 2}" cy="${S / 2}" r="${r}" fill="none" stroke-width="${sw}"/>`;
    s += `<circle class="fill ${o.tone || ''}" cx="${S / 2}" cy="${S / 2}" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="round"
            stroke-dasharray="${(C * pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${S / 2} ${S / 2})"/>`;
    if (tgt != null) {
      const ang = -Math.PI / 2 + 2 * Math.PI * tgt, cx = S / 2 + Math.cos(ang) * r, cy = S / 2 + Math.sin(ang) * r;
      s += `<circle class="tgt" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(sw / 2 + 1.5).toFixed(1)}"/>`;
      s += `<circle class="tgt-in" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${(sw / 2 - 1.5).toFixed(1)}"/>`;
    }
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- спарклайн с заливкой */
  function spark(vals, o = {}) {
    const v = (vals || []).filter(x => x != null);
    if (v.length < 2) return '';
    const W = o.width || 96, H = o.height || 30, p = 2.5;
    const mn = Math.min(...v), mx = Math.max(...v);
    const X = i => p + (W - 2 * p) * (i / (v.length - 1));
    const Y = t => mx === mn ? H / 2 : p + (H - 2 * p) * (1 - (t - mn) / (mx - mn));
    const pts = v.map((t, i) => `${X(i).toFixed(1)},${Y(t).toFixed(1)}`).join(' ');
    const area = `${p},${H} ${pts} ${W - p},${H}`;
    return `<svg class="mb spark ${o.tone || ''}" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
      ${o.area === false ? '' : `<polygon class="ar" points="${area}"/>`}
      <polyline class="ln" points="${pts}"/>
      <circle class="pt" cx="${X(v.length - 1).toFixed(1)}" cy="${Y(v[v.length - 1]).toFixed(1)}" r="2.6"/></svg>`;
  }

  /* ---------------------------------------------------------------- горизонтальная полоса-метр */
  function meter(o) {
    const W = o.width || 300, H = 26, bh = 8, y = 9;
    const pct = Math.max(0, Math.min(1, o.value / (o.max || 100)));
    const tgt = o.target != null ? Math.max(0, Math.min(1, o.target / (o.max || 100))) : null;
    let s = `<svg class="mb meter" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" aria-hidden="true">`;
    s += `<rect class="track" x="0" y="${y}" width="${W}" height="${bh}" rx="${bh / 2}"/>`;
    s += `<rect class="fill ${o.tone || ''}" x="0" y="${y}" width="${(W * pct).toFixed(1)}" height="${bh}" rx="${bh / 2}"/>`;
    if (tgt != null) s += `<rect class="tgt" x="${(W * tgt - 1).toFixed(1)}" y="${y - 4}" width="2" height="${bh + 8}" rx="1"/>`;
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- воронка целей: ступени вниз */
  function funnel(steps, o = {}) {
    const W = o.width || 320, rowH = 54, H = steps.length * rowH + 6;
    let s = `<svg class="mb funnel" viewBox="0 0 ${W} ${H}" width="100%" aria-hidden="true">`;
    steps.forEach((st, i) => {
      const y = i * rowH + 4, w = Math.max(28, W * st.v / 100);
      s += `<rect class="bar ${st.tone || ''}" x="0" y="${y}" width="${w.toFixed(1)}" height="26" rx="4"/>`;
      s += `<text class="v" x="${(w - 8).toFixed(1)}" y="${y + 18}" text-anchor="end">${st.v}%</text>`;
      s += `<text class="n" x="0" y="${y + 40}">${esc(st.name)}</text>`;
      // подпись справа рисуем только если она заведомо не наедет на название
      if (st.note && (st.name.length + st.note.length) < 34) s += `<text class="note" x="${W}" y="${y + 40}" text-anchor="end">${esc(st.note)}</text>`;
    });
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- вафля: доля от целого точками */
  function waffle(o) {
    const cols = o.cols || 20, rows = o.rows || 5, total = cols * rows;
    const on = Math.round(total * (o.value / (o.max || 100)));
    const W = o.width || 300, cell = W / cols, r = Math.min(cell * 0.32, 5);
    const H = rows * cell;
    let s = `<svg class="mb waffle" viewBox="0 0 ${W} ${H}" width="100%" aria-hidden="true">`;
    for (let i = 0; i < total; i++) {
      const cx = (i % cols) * cell + cell / 2, cy = Math.floor(i / cols) * cell + cell / 2;
      s += `<circle class="${i < on ? 'on ' + (o.tone || '') : 'off'}" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(1)}"/>`;
    }
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- столбики по месяцам */
  function bars(o) {
    const v = o.values, n = v.length, W = o.width || 320, H = o.height || 84, padB = 16;
    const mn = Math.min(0, ...v), mx = Math.max(...v);
    const slot = W / n, bw = Math.min(o.barW || 14, slot * 0.66);
    const Y = t => padB === 0 ? 0 : (H - padB) * (1 - (t - mn) / ((mx - mn) || 1));
    let s = `<svg class="mb bars" viewBox="0 0 ${W} ${H}" width="100%" aria-hidden="true">`;
    v.forEach((t, i) => {
      const x = i * slot + (slot - bw) / 2, y = Y(t), h = Math.max(2, H - padB - y);
      const hot = (o.hotFrom != null && i >= o.hotFrom) || (o.hot && o.hot.indexOf(i) >= 0);
      s += `<rect class="bar ${hot ? 'hot' : ''}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2"/>`;
      if (o.labels && (i % (o.every || 2) === 0 || i === n - 1))
        s += `<text class="lab" x="${(x + bw / 2).toFixed(1)}" y="${H - 3}" text-anchor="middle">${esc(o.labels[i])}</text>`;
    });
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- вилка прогноза с порогом */
  function fork(o) {
    const W = o.width || 320, H = 70, y = 26, bh = 16;
    const X = v => ((v - o.min) / (o.max - o.min)) * W;
    const lo = X(o.lo), hi = X(o.hi), lim = X(o.limit);
    let s = `<svg class="mb fork" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(o.aria || '')}">`;
    s += `<rect class="ax" x="0" y="${y + bh / 2 - 1}" width="${W}" height="2" rx="1"/>`;
    s += `<rect class="band" x="${lo.toFixed(1)}" y="${y}" width="${Math.max(4, hi - lo).toFixed(1)}" height="${bh}" rx="${bh / 2}"/>`;
    s += `<rect class="lim" x="${(lim - 1.5).toFixed(1)}" y="${y - 9}" width="3" height="${bh + 18}" rx="1.5"/>`;
    s += `<text class="t lim-t" x="${lim.toFixed(1)}" y="${y - 14}" text-anchor="${lim > W * 0.7 ? 'end' : 'middle'}">${esc(o.limitLabel || '')}</text>`;
    // подписи разводим по краям и соединяем с границами вилки, иначе на узком экране они наезжают
    s += `<path class="lead" d="M${lo.toFixed(1)} ${y + bh} V${y + bh + 7} H8"/>`;
    s += `<path class="lead" d="M${hi.toFixed(1)} ${y + bh} V${y + bh + 7} H${W - 8}"/>`;
    s += `<text class="t" x="0" y="${y + bh + 22}" text-anchor="start">${esc(o.loLabel || '')}</text>`;
    s += `<text class="t" x="${W}" y="${y + bh + 22}" text-anchor="end">${esc(o.hiLabel || '')}</text>`;
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- две линии: срез против среднего */
  function dual(o) {
    const a = o.a, b = o.b, n = a.length, W = o.width || 320, H = o.height || 92, pt = 10, pb = 18;
    const all = a.concat(b), mn = Math.min(...all), mx = Math.max(...all);
    const X = i => (W - 4) * (i / (n - 1)) + 2;
    const Y = t => pt + (H - pt - pb) * (1 - (t - mn) / ((mx - mn) || 1));
    const line = v => v.map((t, i) => `${X(i).toFixed(1)},${Y(t).toFixed(1)}`).join(' ');
    let s = `<svg class="mb dual" viewBox="0 0 ${W} ${H}" width="100%" aria-hidden="true">`;
    s += `<polyline class="b" points="${line(b)}"/><polyline class="a" points="${line(a)}"/>`;
    s += `<circle class="pa" cx="${X(n - 1).toFixed(1)}" cy="${Y(a[n - 1]).toFixed(1)}" r="3.2"/>`;
    s += `<text class="la" x="${(W - 2).toFixed(1)}" y="${(Y(a[n - 1]) - 8).toFixed(1)}" text-anchor="end">${esc(o.aLabel || '')}</text>`;
    // подпись сравнения ставим слева над её началом: справа она сталкивается с осью месяцев
    s += `<text class="lb" x="2" y="${(Y(b[0]) - 7).toFixed(1)}" text-anchor="start">${esc(o.bLabel || '')}</text>`;
    if (o.labels) o.labels.forEach((t, i) => {
      if (i % (o.every || 3) === 0 || i === n - 1)
        s += `<text class="ax" x="${X(i).toFixed(1)}" y="${H - 3}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${esc(t)}</text>`;
    });
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- список полос со значениями */
  function rows(items, o = {}) {
    const max = o.max || Math.max(...items.map(i => i.v)) * 1.02;
    return `<div class="mb-rows">${items.map(i => `<div class="mb-row ${i.tone || ''}">
      <span class="n">${esc(i.name)}</span>
      <span class="t"><i style="width:${Math.max(2, 100 * i.v / max).toFixed(1)}%"></i></span>
      <span class="v">${o.fmt === 'int' ? int(i.v) : num(i.v, Number.isInteger(i.v) ? 0 : 1) + (o.suffix || '')}</span>
    </div>`).join('')}</div>`;
  }

  /* ---------------------------------------------------------------- точки на общей шкале
     Когда все значения лежат в узком коридоре (например 85–96%), полосы от нуля неразличимы.
     Здесь шкала обрезана явно и подписана, а цель отмечена штрихом. */
  function dots(items, o = {}) {
    const mn = o.min, mx = o.max;
    const pos = v => Math.max(0, Math.min(100, 100 * (v - mn) / (mx - mn)));
    const tgt = o.target != null ? pos(o.target) : null;
    return `<div class="mb-dots">${items.map(i => `<div class="mb-dot ${i.tone || ''}">
      <span class="n">${esc(i.name)}</span>
      <span class="tk">${tgt != null ? `<u style="left:${tgt.toFixed(1)}%"></u>` : ''}<i style="width:${pos(i.v).toFixed(1)}%"></i><b style="left:${pos(i.v).toFixed(1)}%"></b></span>
      <span class="v">${num(i.v, 1)}${o.suffix || ''}</span></div>`).join('')}
      <div class="mb-dots-ax"><span>${num(mn, 0)}${o.suffix || ''}</span>${o.target != null && tgt > 12 && tgt < 78 ? `<span class="t" style="left:${tgt.toFixed(1)}%">цель ${num(o.target, 0)}${o.suffix || ''}</span>` : ''}<span>${num(mx, 0)}${o.suffix || ''}</span></div></div>`;
  }

  /* ---------------------------------------------------------------- шкала порогов
     Показывает, где значение стоит относительно красного и жёлтого порогов витрины.
     Зоны рисуются в направлении threshold_direction: up — плохо слева, down — плохо справа. */
  function zones(o) {
    const W = o.width || 320, H = 46, y = 12, bh = 12;
    const mn = o.min, mx = o.max, P = v => Math.max(0, Math.min(1, (v - mn) / (mx - mn)));
    const red = P(o.red), yel = P(o.yellow), val = P(o.value);
    const up = o.dir === 'up';
    const seg = (x1, x2, cls) => x2 > x1
      ? `<rect class="z ${cls}" x="${(x1 * W).toFixed(1)}" y="${y}" width="${((x2 - x1) * W).toFixed(1)}" height="${bh}"/>` : '';
    let s = `<svg class="mb zones" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="${esc(o.aria || '')}">`;
    if (up) { s += seg(0, red, 'bad') + seg(red, yel, 'warn') + seg(yel, 1, 'good'); }
    else { s += seg(0, yel, 'good') + seg(yel, red, 'warn') + seg(red, 1, 'bad'); }
    s += `<rect class="mk" x="${(val * W - 1.5).toFixed(1)}" y="${y - 7}" width="3" height="${bh + 14}" rx="1.5"/>`;
    s += `<text class="t" x="${(val * W).toFixed(1)}" y="${y - 11}" text-anchor="${val > 0.82 ? 'end' : val < 0.18 ? 'start' : 'middle'}">${esc(o.label || '')}</text>`;
    const tx = (p, t) => `<text class="a" x="${(p * W).toFixed(1)}" y="${y + bh + 14}" text-anchor="middle">${esc(t)}</text>`;
    s += tx(red, o.redLabel) + tx(yel, o.yellowLabel);
    s += '</svg>';
    return s;
  }

  return { int, num, esc, val, delta, dcls, ring, spark, meter, funnel, waffle, bars, rows, fork, dual, dots, zones };
})();
</script>

    ${card(`<div class="viz">${dual({ a: F('managers_leaving').series, b: F('managers_leaving').compare, labels: F('managers_leaving').months, aLabel: 'руководители 9,8%', bLabel: 'год назад 7,1%' })}</div>
      <p class="tx">Доля руководителей в оттоке выросла с 8% до 11% при неизменной доле в численности — 13%. Две трети ушедших — Discovery Core и Other Digital.</p>`)}

    <div class="sect"><h3>Что сдвинулось за месяц</h3></div>
    ${card(`<div class="rowl">${S.changes.map(c => row({ st: 'amber', title: c.text })).join('')}</div>`)}

    <div class="sect"><h3>Что не изменилось</h3><span class="n">об этом можно не говорить</span></div>
    ${card(`<div class="rowl">${S.stable.map(t => row({ st: 'ok', title: t })).join('')}</div>`)}`;

  /* ---------------------------------------------------------------- вкладка «Все» */
  const GROUPS = [...new Set(C.map(m => m.group))];
  const AV = ['есть', 'нужна склейка', 'бэклог'];
  const state = { q: '', group: '', av: '' };

  const paneAll = () => `
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Поиск по ${C.length} метрикам" autocomplete="off" enterkeyhint="search">
      <button class="clr" id="clr" hidden aria-label="Очистить">✕</button>
    </div>
    <div class="fchips" id="gchips">
      <button data-g="" class="on">Все группы</button>
      ${GROUPS.map(g => `<button data-g="${esc(g)}">${esc(g)}</button>`).join('')}
    </div>
    <div class="fchips" id="achips">
      <button data-a="" class="on">Любая доступность</button>
      ${AV.map(a => `<button data-a="${esc(a)}">${esc(a)} · ${C.filter(m => m.availability === a).length}</button>`).join('')}
    </div>
    <div class="cnt" id="cnt"></div>
    <div id="list"></div>`;

  function renderList() {
    const q = state.q.trim().toLowerCase();
    const hit = C.filter(m =>
      (!state.group || m.group === state.group) &&
      (!state.av || m.availability === state.av) &&
      (!q || (m.name + ' ' + m.group + ' ' + m.definition + ' ' + (m.owner || '')).toLowerCase().includes(q)));
    const byGroup = {};
    hit.forEach(m => { (byGroup[m.group] = byGroup[m.group] || []).push(m); });
    document.getElementById('cnt').textContent = hit.length === C.length
      ? `${C.length} метрик · ${GROUPS.length} групп` : `показано ${hit.length} из ${C.length}`;
    document.getElementById('list').innerHTML = hit.length ? Object.keys(byGroup).map(g => `
      <div class="sect"><h3>${esc(g)}</h3><span class="n">${byGroup[g].length}</span></div>
      ${card(`<div class="rowl">${byGroup[g].map(m => {
        const long = m.fmt === 'text' || String(m.value).length > 13;  // составные значения уводим под название
        return row({
          st: m.status, title: m.name, sub: long ? String(m.value) : (m.sub || m.owner),
          value: long ? '' : val(m.value, m.fmt), vTone: tone(m.status),
          delta: long ? '' : delta(m.delta_mom, m.fmt), dTone: dcls(m.delta_mom, m.good),
          sheet: 'metric', key: m.id });
      }).join('')}</div>`)}`).join('')
      : '<div class="empty">Ничего не нашли. Попробуйте другое слово или снимите фильтр.</div>';
  }

  /* ---------------------------------------------------------------- шторка */
  const scrim = () => document.getElementById('scrim');
  const sheetEl = () => document.getElementById('sheet');

  function openSheet(o) {
    sheetEl().querySelector('.body').innerHTML = `
      <div class="kick">${esc(o.kick || '')}</div>
      <h3>${esc(o.title)}</h3>
      ${o.big ? `<div class="big ${o.bigTone || ''}">${o.big}</div>` : ''}
      ${o.sub ? `<div class="kick" style="margin-top:8px">${esc(o.sub)}</div>` : ''}
      ${o.viz ? `<div class="viz">${o.viz}</div>` : ''}
      ${o.meta ? `<div class="meta">${o.meta.map(m => `<div><div class="l">${esc(m.l)}</div><div class="v ${m.cls || ''}">${m.v}</div></div>`).join('')}</div>` : ''}
      ${(o.blocks || []).filter(b => b && b.v).map(b => `<div class="blk"><div class="l">${esc(b.l)}</div><div class="v">${b.raw ? b.v : esc(b.v)}</div></div>`).join('')}
      <button class="close" id="closeSheet">Закрыть</button>`;
    sheetEl().classList.add('on'); scrim().classList.add('on');
    document.body.style.overflow = 'hidden';
    sheetEl().querySelector('.body').scrollTop = 0;
    document.getElementById('closeSheet').addEventListener('click', closeSheet);
  }
  function closeSheet() {
    sheetEl().classList.remove('on'); scrim().classList.remove('on');
    document.body.style.overflow = '';
  }

  const SHEETS = {
    metric(key) {
      const m = C.find(x => x.id === key);
      return {
        kick: m.group, title: m.name,
        big: val(m.value, m.fmt), bigTone: tone(m.status),
        sub: m.sub || '',
        viz: m.spark ? spark(m.spark, { width: 300, height: 56, tone: tone(m.status) }) + '<div class="kick" style="margin-top:6px">13 месяцев</div>' : '',
        meta: [
          { l: 'Месяц к месяцу', v: delta(m.delta_mom, m.fmt) || '—', cls: dcls(m.delta_mom, m.good) },
          { l: 'Год к году', v: delta(m.delta_yoy, m.fmt) || '—', cls: dcls(m.delta_yoy, m.good) },
          { l: 'Цель', v: m.target != null ? val(m.target, m.fmt) : '—' },
          { l: 'Владелец', v: esc(m.owner || '—') },
        ],
        blocks: [
          { l: 'Определение', v: m.definition },
          { l: 'Данные', v: `<span class="badge ${avCls(m.availability)}">${esc(m.availability)}</span>`, raw: true },
        ],
      };
    },
    signal(key) {
      const lvl = key.startsWith('red') ? 'red' : 'amber';
      const s = S.signals.filter(x => x.level === lvl)[+key.replace(lvl, '')];
      return { kick: lvl === 'red' ? 'Решать сейчас' : 'Наблюдать', title: s.title, blocks: [{ l: 'Что происходит', v: s.text }, { l: 'Владелец', v: s.owner || 'не назначен' }] };
    },
    tile(key) {
      const t = T(key);
      return {
        kick: t.group, title: t.title,
        big: val(t.value, t.fmt, t.decimals), bigTone: tone(t.status), sub: t.unit,
        meta: [
          { l: 'Месяц к месяцу', v: delta(t.delta_mom, t.fmt) || '—', cls: dcls(t.delta_mom, t.good) },
          { l: 'Год к году', v: delta(t.value - (t.prev_year != null ? t.prev_year : t.value), t.fmt) || '—', cls: dcls(t.value - (t.prev_year != null ? t.prev_year : t.value), t.good) },
          ...(t.secondary || []).map(s => ({ l: s.label, v: esc(s.value) })),
        ],
        blocks: [
          { l: 'Статус', v: t.status_text },
          { l: 'Определение', v: t.definition },
          { l: 'Вопрос', v: t.question },
          { l: 'Кому', v: (t.ask || t.owner || '').replace('→ ', '') },
        ],
      };
    },
    finding(key) {
      const f = F(key);
      return {
        kick: f.kicker, title: f.claim,
        big: f.unit === '%' ? num(f.value, 1) + '%' : int(f.value), bigTone: f.priority === 1 ? 'red' : 'amber',
        sub: f.unit + ' · ' + f.value_note,
        blocks: [{ l: 'Разбор', v: f.text }, { l: 'Как считали', v: f.how }, { l: 'Источник', v: f.source },
          { l: 'Чего мы не знаем', v: f.unknown }, { l: 'Вопрос', v: f.question }, { l: 'Владелец', v: f.owner }],
      };
    },
    goal(key) {
      const s = G.stages.find(x => x.id === key);
      return {
        kick: 'Цели', title: s.name, big: s.value + '%', bigTone: tone(s.status), sub: s.sub,
        viz: spark(s.series, { width: 300, height: 56, tone: tone(s.status) }) + '<div class="kick" style="margin-top:6px">13 месяцев</div>',
        meta: [{ l: 'Цель', v: s.target + '%' }, { l: 'Разрыв', v: (s.value - s.target) + ' п.п.', cls: s.value < s.target ? 'bad' : 'good' },
          ...s.detail.map(d => ({ l: d.name, v: d.v + (d.unit ? ' ' + d.unit : '%') }))],
        blocks: [{ l: 'Определение', v: s.definition }, { l: 'Владелец', v: G.owner }],
      };
    },
    res() {
      return {
        kick: 'Ресурс', title: R.headline, big: num(R.value, 1) + '%', bigTone: tone(R.status),
        viz: spark(R.series, { width: 300, height: 56, tone: tone(R.status) }) + '<div class="kick" style="margin-top:6px">13 месяцев</div>',
        meta: [{ l: 'Цель', v: num(R.target, 1) + '%' }, { l: 'Год назад', v: num(R.prev_year, 1) + '%' },
          ...R.levels.slice(1).map(l => ({ l: l.name, v: num(l.value, 1) + '%' }))],
        blocks: [{ l: 'Определение', v: R.definition }, { l: 'Чего мы не знаем', v: R.unknown }, { l: 'Владелец', v: R.owner }],
      };
    },
    text(key) {
      const t = { limit: { kick: 'Решение', title: 'Приоритизация 1 850 вакансий под лимит 23 500',
        blocks: [{ l: 'Что решаем', v: 'Какие примерно 200 вакансий снимаем или переносим на 2027 год.' },
          { l: 'Срок', v: K.deadline.value + ' — позже офферы уже выйдут, и решение будет стоить дороже.' },
          { l: 'Ставка', v: K.items[0].value + ' · ' + K.items[0].money },
          { l: 'Владелец', v: 'HR HQ + финансы + руководители линий' }] } };
      return t[key];
    },
  };

  /* ---------------------------------------------------------------- каркас */
  const TABS = [
    { id: 'now', name: 'Сводка', icon: ICONS.now, flag: S.signals.filter(s => s.level === 'red').length, pane: paneNow },
    { id: 'res', name: 'Ресурс', icon: ICONS.res, pane: paneRes },
    { id: 'goal', name: 'Цели', icon: ICONS.goal, pane: paneGoal },
    { id: 'ppl', name: 'Люди', icon: ICONS.ppl, pane: paneP },
    { id: 'all', name: 'Все', icon: ICONS.all, pane: paneAll },
  ];

  document.getElementById('app').innerHTML = `
    <div class="wrap">
      <header class="hdr"><div class="in">
        <div><div class="ttl" id="ttl">Сводка</div><div class="sub">${esc(D.meta.company)} · ${esc(D.meta.period_label)}</div></div>
        <div class="sp"></div>
        <button class="ico" id="theme" aria-label="Сменить тему">${svg('<path d="M19 13.6A7.6 7.6 0 1 1 10.4 5a6 6 0 0 0 8.6 8.6z"/>')}</button>
      </div></header>
      <main>${TABS.map(t => `<div class="pane${t.id === 'now' ? ' on' : ''}" id="p-${t.id}">${t.pane()}</div>`).join('')}
        <p class="foot">${esc(D.meta.prepared_by)} · выпуск ${esc(D.meta.issue_no)}<br>${esc(D.meta.disclaimer)}</p>
      </main>
    </div>
    <nav class="tabs">${TABS.map(t => `<button data-tab="${t.id}" class="${t.id === 'now' ? 'on' : ''}">
      <span class="ic">${svg(t.icon)}${t.flag ? `<span class="fl">${t.flag}</span>` : ''}</span><span>${esc(t.name)}</span></button>`).join('')}</nav>
    <div class="scrim" id="scrim"></div>
    <aside class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="body"></div></aside>`;

  renderList();

  /* переключение вкладок */
  const scrollMemo = {};
  let cur = 'now';
  document.querySelector('.tabs').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const id = b.dataset.tab; if (id === cur) { scrollTo({ top: 0, behavior: 'smooth' }); return; }
    scrollMemo[cur] = scrollY; cur = id;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + id));
    document.getElementById('ttl').textContent = TABS.find(t => t.id === id).name === 'Все' ? 'Все метрики' : TABS.find(t => t.id === id).name;
    scrollTo(0, scrollMemo[id] || 0);
  });

  /* открытие шторки */
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-sheet]'); if (!b || !b.dataset.sheet) return;
    const build = SHEETS[b.dataset.sheet]; if (!build) return;
    const o = build(b.dataset.key); if (o) openSheet(o);
  });
  scrim().addEventListener('click', closeSheet);
  addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  // потянуть шторку вниз
  let sy = 0, drag = false;
  sheetEl().addEventListener('touchstart', e => { if (e.target.closest('.body') && sheetEl().querySelector('.body').scrollTop > 0) return; sy = e.touches[0].clientY; drag = true; }, { passive: true });
  sheetEl().addEventListener('touchend', e => { if (drag && e.changedTouches[0].clientY - sy > 70) closeSheet(); drag = false; }, { passive: true });

  /* каталог: поиск и фильтры */
  const q = document.getElementById('q');
  q.addEventListener('input', () => {
    state.q = q.value; document.getElementById('clr').hidden = !q.value; renderList();
  });
  document.getElementById('clr').addEventListener('click', () => { q.value = ''; state.q = ''; document.getElementById('clr').hidden = true; renderList(); q.focus(); });
  document.getElementById('gchips').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.group = b.dataset.g;
    document.querySelectorAll('#gchips button').forEach(x => x.classList.toggle('on', x === b));
    renderList();
  });
  document.getElementById('achips').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.av = b.dataset.a;
    document.querySelectorAll('#achips button').forEach(x => x.classList.toggle('on', x === b));
    renderList();
  });

  /* тема: авто → светлая → тёмная */
  const order = ['', 'light', 'dark']; let ti = 0;
  document.getElementById('theme').addEventListener('click', () => {
    ti = (ti + 1) % order.length;
    if (order[ti]) document.documentElement.setAttribute('data-theme', order[ti]);
    else document.documentElement.removeAttribute('data-theme');
  });
})();
</script>
