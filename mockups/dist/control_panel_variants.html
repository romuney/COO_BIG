<title>Exec Board · варианты подачи</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<style>
/* ============================================================ токены */
:root {
  color-scheme: light;
  --bg: #eceef2;          /* холодная «бумага» */
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --ink: #161b23;
  --ink-2: #4a525f;
  --muted: #7f8794;
  --line: #e0e3e8;
  --line-2: #c9ced6;
  --accent: #2a78d6;      /* 2026, текущий период */
  --accent-soft: #e6eefb;
  --prior: #aab1bb;       /* 2025 */
  --plan: #161b23;        /* план / цель (пунктир) */
  --pos: #2a78d6;
  --neg: #5c6572;
  --red: #d03b3b;  --red-bg: #fae6e6;  --red-text: #a02a2a;
  --amber: #e28a00; --amber-bg: #fcefd6; --amber-text: #8a5200;
  --ok: #0ca30c;   --ok-bg: #e3f4e3;   --ok-text: #0f6b0f;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s7: #4a3aa7;
  --heat-1: #eef4fc; --heat-2: #cde2fb; --heat-3: #9ec5f4; --heat-4: #5598e7; --heat-5: #256abf;
  --shadow: 0 1px 2px rgba(22,27,35,.06), 0 8px 24px rgba(22,27,35,.06);
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1216; --surface: #171b21; --surface-2: #1e232a;
    --ink: #eef1f5; --ink-2: #b7bec8; --muted: #8b939e;
    --line: #2a3038; --line-2: #3a414b;
    --accent: #3987e5; --accent-soft: #1d2b40; --prior: #5d6673; --plan: #e6e9ee;
    --pos: #3987e5; --neg: #8b939e;
    --red: #e66767; --red-bg: #3a1f1f; --red-text: #f0a3a3;
    --amber: #e8a53a; --amber-bg: #3a2c12; --amber-text: #f2c36c;
    --ok: #35b535; --ok-bg: #16301a; --ok-text: #8fd98f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s7: #9085e9;
    --heat-1: #1b2230; --heat-2: #1f3555; --heat-3: #1c5cab; --heat-4: #2a78d6; --heat-5: #6da7ec;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1216; --surface: #171b21; --surface-2: #1e232a;
  --ink: #eef1f5; --ink-2: #b7bec8; --muted: #8b939e;
  --line: #2a3038; --line-2: #3a414b;
  --accent: #3987e5; --accent-soft: #1d2b40; --prior: #5d6673; --plan: #e6e9ee;
  --pos: #3987e5; --neg: #8b939e;
  --red: #e66767; --red-bg: #3a1f1f; --red-text: #f0a3a3;
  --amber: #e8a53a; --amber-bg: #3a2c12; --amber-text: #f2c36c;
  --ok: #35b535; --ok-bg: #16301a; --ok-text: #8fd98f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s7: #9085e9;
  --heat-1: #1b2230; --heat-2: #1f3555; --heat-3: #1c5cab; --heat-4: #2a78d6; --heat-5: #6da7ec;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

/* ============================================================ база */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
b, strong { font-weight: 600; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ============================================================ верхняя панель */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px; padding: 0 28px; height: 52px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; min-width: 0; }
.brand-name { font-family: var(--serif); font-weight: 600; font-size: 18px; letter-spacing: .01em; }
.brand-sub { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 4px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.tabs a:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
.tabs a .n { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tabs a.sep { padding-left: 14px; border-left: 1px solid var(--line); border-radius: 0; margin-left: 6px; }

/* ============================================================ страницы */
main { max-width: 1360px; margin: 0 auto; padding: 22px 24px 60px; display: flex; flex-direction: column; gap: 22px; }
.page { scroll-margin-top: 64px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 26px 30px 18px; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: grid; grid-template-columns: 1fr auto; gap: 6px 24px; align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.page-title { font-family: var(--serif); font-size: 26px; line-height: 1.2; font-weight: 600; max-width: 30ch; }
.page-title .sub { display: block; font-family: var(--sans); font-weight: 400; font-size: 13.5px; color: var(--ink-2); margin-top: 6px; text-wrap: pretty; max-width: 80ch; }
.page-meta { color: var(--muted); font-size: 12px; text-align: right; line-height: 1.5; }
.page-foot { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); font-size: 12px; }
.page-foot .pn { margin-left: auto; font-variant-numeric: tabular-nums; }
.page-foot .lk::before { content: "↗ "; color: var(--muted); }

/* ============================================================ сетки и карточки */
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.g23 { grid-template-columns: 2fr 1fr; }
.g32 { grid-template-columns: 3fr 2fr; }
.rail-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; align-items: start; }
.rail-layout.flip { grid-template-columns: minmax(0, 1fr) 420px; }
.rail-layout.flip-narrow { grid-template-columns: minmax(0, 1fr) 380px; }
.span2 { grid-column: span 2; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card.flat { border: 0; padding: 0; }
.card-title { font-size: 13px; font-weight: 600; line-height: 1.3; }
.card-sub { font-size: 12px; color: var(--muted); }
.panel { background: var(--surface-2); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.panel .card-title { font-size: 12.5px; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* ============================================================ нарратив (рельса) */
.rail { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 64px; }
.comment { font-family: var(--serif); font-size: 15.5px; line-height: 1.5; color: var(--ink); text-wrap: pretty; }
.comment .lead { font-weight: 600; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
.ask { display: flex; flex-direction: column; gap: 10px; }
.ask-item { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 13px; line-height: 1.4; }
.ask-item .q { font-family: var(--serif); font-weight: 600; font-size: 15px; color: var(--accent); line-height: 1; padding-top: 2px; }
.ask-item .to { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.links { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }

/* ============================================================ статусы */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; line-height: 1.5; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.red { background: var(--red-bg); color: var(--red-text); }
.chip.amber { background: var(--amber-bg); color: var(--amber-text); }
.chip.amber::before { border-radius: 1px; transform: rotate(45deg); width: 6px; height: 6px; }
.chip.ok { background: var(--ok-bg); color: var(--ok-text); }
.chip.ok::before { content: "✓"; background: none; width: auto; height: auto; font-size: 10px; }
.chip.none { background: var(--surface-2); color: var(--ink-2); }
.chip.none::before { background: var(--line-2); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.red { background: var(--red); } .dot.amber { background: var(--amber); border-radius: 1px; transform: rotate(45deg); } .dot.ok { background: var(--ok); } .dot.none { background: var(--line-2); }
.up-good, .down-good { color: var(--ok-text); } .up-bad, .down-bad { color: var(--red-text); } .neutral { color: var(--ink-2); }

/* ============================================================ резюме */
.headline { font-family: var(--serif); font-size: 30px; line-height: 1.18; font-weight: 600; max-width: 28ch; }
.summary-text { display: flex; flex-direction: column; gap: 12px; max-width: 64ch; }
.summary-text p { font-family: var(--serif); font-size: 16px; line-height: 1.5; text-wrap: pretty; }
.summary-text p::first-letter { }
.signals { display: flex; flex-direction: column; gap: 4px; }
.sig-group { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 4px; }
.sig { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: start; padding: 7px 8px; border-radius: 5px; font-size: 13px; line-height: 1.35; }
.sig:hover { background: var(--surface-2); }
.sig .dot { margin-top: 5px; }
.sig .t { font-weight: 600; }
.sig .x { color: var(--ink-2); }
.sig .pg { color: var(--muted); font-size: 11.5px; white-space: nowrap; padding-top: 2px; }
.list { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.list li { list-style: none; display: grid; grid-template-columns: 12px 1fr; gap: 8px; }
.list li::before { content: "—"; color: var(--muted); }
.list.arrows li::before { content: "→"; color: var(--accent); }
ul.list { margin: 0; padding: 0; }
.decision { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 8px 10px; background: var(--surface-2); border-radius: 5px; font-size: 13px; }
.decision .own { color: var(--muted); font-size: 12px; white-space: nowrap; }

/* ============================================================ плитки панели управления */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.tile { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; }
.tile.wide { grid-column: span 2; }
.tile.st-red { border-color: color-mix(in srgb, var(--red) 55%, var(--line)); box-shadow: inset 3px 0 0 var(--red); }
.tile.st-amber { box-shadow: inset 3px 0 0 var(--amber); }
.tile.st-ok { box-shadow: inset 3px 0 0 var(--ok); }
.tile-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile-title { font-size: 13px; font-weight: 600; line-height: 1.3; }
.tile-value { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tile-value .big { font-size: 28px; font-weight: 600; line-height: 1; letter-spacing: -.01em; }
.tile-value .unit { color: var(--muted); font-size: 12px; }
.tile-deltas { display: flex; gap: 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.tile-deltas b { font-weight: 600; }
.tile-chart { margin: 2px -4px 0; }
.tile-status { font-size: 12.5px; line-height: 1.35; color: var(--ink-2); }
.tile.st-red .tile-status, .tile.st-amber .tile-status { color: var(--ink); }
.tile-secondary { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; }
.tile-secondary b { color: var(--ink-2); font-weight: 500; }
.tile-ask { font-size: 12.5px; line-height: 1.35; display: grid; grid-template-columns: 14px 1fr; gap: 6px; }
.tile-ask .q { font-family: var(--serif); font-weight: 600; color: var(--accent); }
.tile-ask .to { color: var(--muted); font-size: 11.5px; display: block; }
.tile-owner { font-size: 11px; color: var(--muted); }
.howto { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--ink-2); align-items: center; }
.howto .k { display: inline-flex; align-items: center; gap: 6px; }
.key { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--accent); }
.key.prior { border-color: var(--prior); }
.key.plan { border-top: 0; border-bottom: 2px dotted var(--plan); }
.key.limit { border-color: var(--red); border-top-style: dashed; }
.key.fc { border-color: var(--red); border-top-style: dotted; }
.key.fca { border-color: var(--accent); border-top-style: dotted; }
.key.box { width: 12px; height: 12px; border: 0; border-radius: 2px; }
.key.s0 { background: var(--s1); } .key.s1 { background: var(--s2); } .key.s2 { background: var(--prior); }
.key.pos { background: var(--pos); } .key.neg { background: var(--neg); } .key.tot { background: var(--ink); }
.key.now { background: var(--accent); } .key.prevmark { width: 2px; height: 14px; background: var(--ink); border: 0; }

/* ============================================================ KPI-ряд */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpis.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kpi .l { font-size: 11.5px; color: var(--ink-2); line-height: 1.3; display: flex; justify-content: space-between; gap: 6px; align-items: start; }
.kpi .v { font-size: 22px; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; }
.kpi .s { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.kpi.tone-red .v { color: var(--red-text); } .kpi.tone-amber .v { color: var(--amber-text); } .kpi.tone-ok .v { color: var(--ok-text); }

/* ============================================================ таблицы */
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: right; font-weight: 500; color: var(--muted); font-size: 11px; padding: 6px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; vertical-align: bottom; line-height: 1.25; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.name { font-weight: 500; }
.tbl td.note { text-align: left; color: var(--muted); font-size: 11.5px; white-space: normal; }
.tbl .chip { white-space: normal; line-height: 1.3; }
.tbl.compact { font-size: 12px; } .tbl.compact th, .tbl.compact td { padding: 5px 6px; }
.tbl td .sub { display: block; font-weight: 400; color: var(--muted); font-size: 11px; white-space: normal; }
.tbl tr.total td { font-weight: 600; border-top: 1px solid var(--line-2); }
.tbl .heat { border-radius: 3px; }
.tbl td .spark { vertical-align: middle; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tabs { min-width: 0; }
.cell-flag { display: inline-flex; align-items: center; gap: 6px; }
td.h1 { background: var(--heat-1); } td.h2 { background: var(--heat-2); } td.h3 { background: var(--heat-3); } td.h4 { background: var(--heat-4); color: #fff; } td.h5 { background: var(--heat-5); color: #fff; }

/* ============================================================ слопы */
.slopes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.slopes.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.slope-card { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 6px; }
.slope-card .card-title { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.slope-card .prio { font-size: 10.5px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.slope-comment { font-size: 12.5px; color: var(--ink-2); line-height: 1.4; border-top: 1px solid var(--line); padding-top: 6px; }
.stable-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 24px; }
.stable-row { display: grid; grid-template-columns: 1fr auto 90px; gap: 10px; align-items: center; font-size: 12.5px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.stable-row .v { color: var(--muted); font-size: 12px; white-space: nowrap; }

/* ============================================================ прочее */
.ratio { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.ratio .v { font-size: 20px; font-weight: 600; }
.ratio .t { font-size: 11.5px; color: var(--muted); grid-column: 1 / -1; }
.whatsnew { display: flex; flex-direction: column; gap: 8px; }
.whatsnew li { list-style: none; display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 13px; }
.whatsnew li::before { content: "★"; color: var(--accent); }
ul.whatsnew { margin: 0; padding: 0; }
.note { font-size: 12px; color: var(--muted); line-height: 1.4; }
.optional { border-style: dashed; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--ink-2); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg .key { border-top-width: 2px; }
.print-hint { font-size: 12px; color: var(--muted); }
.tip { position: fixed; z-index: 100; max-width: 340px; background: var(--ink); color: var(--surface); font-size: 12px; line-height: 1.35; padding: 6px 9px; border-radius: 4px; pointer-events: none; box-shadow: var(--shadow); }
.dict { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 24px; font-size: 12.5px; }
.dict div { display: grid; grid-template-columns: 1fr; gap: 1px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.dict b { font-weight: 600; }
.dict span { color: var(--ink-2); font-size: 12px; }

/* ============================================================ SVG */
.ch { display: block; overflow: visible; font-family: var(--sans); }
.ch text { fill: var(--ink-2); font-size: 10.5px; }
.ch .tick { fill: var(--muted); font-size: 10px; }
.ch .grid { stroke: var(--line); stroke-width: 1; }
.ch .axis { stroke: var(--line-2); stroke-width: 1; }
.ch polyline { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch .cur { stroke: var(--accent); }
.ch .prior { stroke: var(--prior); }
.ch .plan { stroke: var(--plan); stroke-width: 1.5; }
.ch .limit { stroke: var(--red); stroke-width: 1.5; stroke-dasharray: 5 3; }
.ch .target { stroke: var(--plan); stroke-width: 1; stroke-dasharray: 2 3; }
.ch .fc-a { stroke: var(--accent); stroke-width: 1.5; }
.ch .fc-b { stroke: var(--red); stroke-width: 1.5; }
.ch .lim-label, .ch .fc-label { fill: var(--red-text); font-size: 9.5px; font-weight: 600; }
.ch .tgt-label { fill: var(--muted); font-size: 9.5px; }
.ch .dot { fill: var(--accent); }
.ch .dot-ring { fill: var(--surface); }
.ch .end-label { fill: var(--ink); font-weight: 600; font-size: 11px; }
.ch .hit { fill: transparent; }
.ch .hit:hover { fill: color-mix(in srgb, var(--accent) 8%, transparent); }
.spark .sp { stroke: var(--prior); stroke-width: 1.5; }
.spark .dot { fill: var(--accent); }
.bridge .bar.tot { fill: var(--ink); } .bridge .bar.pos { fill: var(--pos); } .bridge .bar.neg { fill: var(--neg); }

:"CrossData","availability":"есть","definition":"Запросы к ассистенту в мессенджере","sub":"","good":"up","spark":[0,67.0,1677.0,1992.0,3649.0,5731.0,6633.0,7166.0,8833.0,9191.0,11147.0,11612.0,12400]}],"months13":["авг 25","сен","окт","ноя","дек","янв 26","фев","мар","апр","май","июн","июл","авг"]};</script>
<script>/* charts.js — SVG-примитивы для Exec Board. Без зависимостей.
   Все графики рисуются в viewBox и масштабируются по ширине контейнера:
   передавайте width, близкий к реальной ширине колонки, чтобы текст не мельчал. */
const CH = (() => {
  const NB = ' '; // узкий неразрывный пробел для разрядов
  const fmtInt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, NB);
  const fmtNum = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
  const fmtPct = (n, d = 1) => fmtNum(n, d) + '%';
  const fmtVal = (n, fmt, d = 1) => fmt === 'int' ? fmtInt(n) : fmt === 'pct' ? fmtPct(n, d) : fmtNum(n, d);
  const fmtDelta = (n, fmt, d = 1, pp = true) => {
    if (n === null || n === undefined || isNaN(n)) return '—';
    const s = n > 0 ? '+' : (n < 0 ? '−' : '±');
    const a = Math.abs(n);
    if (fmt === 'int') return s + fmtInt(a);
    return s + fmtNum(a, d) + (fmt === 'pct' && pp ? `${NB}п.п.` : '');
  };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const MONTHS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

  function niceStep(span, n) {
    const raw = span / n;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const m = raw / p;
    const f = m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10;
    return f * p;
  }
  function ticks(min, max, n = 3) {
    if (max === min) { max = min + 1; }
    const step = niceStep(max - min, n);
    const lo = Math.floor(min / step) * step;
    const hi = Math.ceil(max / step) * step;
    const out = [];
    for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(6));
    return { lo, hi, out };
  }
  function fmtTick(v, fmt) {
    if (fmt === 'int') return fmtInt(v);
    if (fmt === 'pct') return fmtNum(v, Number.isInteger(v) ? 0 : 1) + '%';
    return fmtNum(v, Number.isInteger(v) ? 0 : 1);
  }
  const tickWidth = (t, fmt) => Math.max(...t.out.map(v => fmtTick(v, fmt).length)) * 5.6 + 8;
  const tipAttr = txt => ` data-tip="${esc(txt)}"`;
  const svgOpen = (w, h, cls = '') => `<svg class="ch ${cls}" viewBox="0 0 ${w} ${h}" width="100%" role="img" preserveAspectRatio="xMidYMid meet">`;
  /* раздвигаем подписи по вертикали, чтобы не наезжали друг на друга, в пределах [top, bottom] */
  function spread(ys, gap, top, bottom) {
    const idx = ys.map((y, i) => ({ y, i })).sort((a, b) => a.y - b.y);
    for (let k = 1; k < idx.length; k++) idx[k].y = Math.max(idx[k].y, idx[k - 1].y + gap);
    const over = idx.length ? idx[idx.length - 1].y - bottom : 0;
    if (over > 0) { idx[idx.length - 1].y = bottom; for (let k = idx.length - 2; k >= 0; k--) idx[k].y = Math.min(idx[k].y, idx[k + 1].y - gap); }
    if (idx.length && idx[0].y < top) { idx[0].y = top; for (let k = 1; k < idx.length; k++) idx[k].y = Math.max(idx[k].y, idx[k - 1].y + gap); }
    const out = []; idx.forEach(a => out[a.i] = a.y); return out;
  }

  /* ---------------------------------------------------------------- линия год к году (по образцу Amazon WBR) */
  function yoyLine(o) {
    const W = o.width || 300, H = o.height || 120;
    const y25 = o.y2025 || [], y26 = o.y2026 || [], plan = o.plan || null;
    const fmt = o.fmt || 'num', d = o.decimals == null ? 1 : o.decimals;
    const fc = o.forecast || null; // {runrate:[], pipeline:[]} — с месяца после последнего факта
    const all = [...y25, ...y26];
    if (plan) all.push(...plan);
    if (o.limit != null) all.push(o.limit);
    if (o.target != null) all.push(o.target);
    if (fc) Object.values(fc).forEach(a => all.push(...a));
    let min = Math.min(...all), max = Math.max(...all);
    const pad = (max - min) * 0.12 || 1;
    min -= pad; max += pad;
    if (Math.min(...all) >= 0 && min < 0) min = 0;
    if (o.yMin != null) min = o.yMin;
    if (o.yMax != null) max = o.yMax;
    const t = ticks(min, max, 3);
    if (o.yMax != null && t.hi > o.yMax) { t.hi = o.yMax; t.out = t.out.filter(v => v <= o.yMax); }
    const padL = tickWidth(t, fmt), padR = fc ? 40 : 28, padT = 10, padB = 18;
    const yS = v => padT + (H - padT - padB) * (1 - (v - t.lo) / (t.hi - t.lo));
    const xS = i => padL + (W - padL - padR) * (i / 11);
    let s = svgOpen(W, H, 'yoy');
    t.out.forEach(v => {
      s += `<line class="grid" x1="${padL}" y1="${yS(v)}" x2="${W - padR}" y2="${yS(v)}"/>`;
      s += `<text class="tick" x="${padL - 4}" y="${yS(v) + 3}" text-anchor="end">${fmtTick(v, fmt)}</text>`;
    });
    MONTHS.forEach((m, i) => { if (i % 2 === 0) s += `<text class="tick" x="${xS(i)}" y="${H - 5}" text-anchor="middle">${m}</text>`; });
    const line = (arr, cls, dash) => {
      const pts = arr.map((v, i) => v == null ? null : `${xS(i)},${yS(v)}`).filter(Boolean);
      if (pts.length < 2) return '';
      return `<polyline class="${cls}" ${dash ? `stroke-dasharray="${dash}"` : ''} points="${pts.join(' ')}"/>`;
    };
    if (o.limit != null) {
      s += `<line class="limit" x1="${padL}" y1="${yS(o.limit)}" x2="${W - padR}" y2="${yS(o.limit)}"/>`;
      s += `<text class="lim-label" x="${padL + 3}" y="${yS(o.limit) - 3}">${o.limitLabel || 'лимит'} ${fmtVal(o.limit, fmt, 0)}</text>`;
    }
    if (o.target != null && o.limit == null) {
      s += `<line class="target" x1="${padL}" y1="${yS(o.target)}" x2="${W - padR}" y2="${yS(o.target)}"/>`;
      s += `<text class="tgt-label" x="${W - padR + 3}" y="${yS(o.target) + 3}">цель</text>`;
    }
    if (plan) s += line(plan, 'plan', '2 3');
    s += line(y25, 'prior');
    s += line(y26, 'cur');
    const n = y26.length;
    if (fc && n) {
      const from = [[xS(n - 1), yS(y26[n - 1])].join(',')];
      const mk = (arr, cls) => `<polyline class="${cls}" stroke-dasharray="3 3" points="${[...from, ...arr.map((v, i) => `${xS(n + i)},${yS(v)}`)].join(' ')}"/>`;
      if (fc.runrate) s += mk(fc.runrate, 'fc-a');
      if (fc.pipeline) { s += mk(fc.pipeline, 'fc-b'); const last = fc.pipeline[fc.pipeline.length - 1]; s += `<text class="fc-label" x="${xS(n + fc.pipeline.length - 1) + 4}" y="${yS(last) + 3}">${fmtVal(last, fmt, d)}</text>`; }
    }
    if (n) {
      s += `<circle class="dot-ring" cx="${xS(n - 1)}" cy="${yS(y26[n - 1])}" r="5"/>`;
      s += `<circle class="dot" cx="${xS(n - 1)}" cy="${yS(y26[n - 1])}" r="3.5"/>`;
      if (!fc) s += `<text class="end-label" x="${xS(n - 1) + 7}" y="${yS(y26[n - 1]) - 6}">${fmtVal(y26[n - 1], fmt, d)}</text>`;
    }
    const cw = (W - padL - padR) / 11;
    for (let i = 0; i < 12; i++) {
      const parts = [`${MONTHS[i]}`];
      if (y26[i] != null) parts.push(`2026: ${fmtVal(y26[i], fmt, d)}`);
      if (y25[i] != null) parts.push(`2025: ${fmtVal(y25[i], fmt, d)}`);
      if (plan && plan[i] != null) parts.push(`план: ${fmtVal(plan[i], fmt, d)}`);
      if (fc && i >= n) { if (fc.runrate) parts.push(`прогноз по темпу: ${fmtVal(fc.runrate[i - n], fmt, d)}`); if (fc.pipeline) parts.push(`прогноз по воронке: ${fmtVal(fc.pipeline[i - n], fmt, d)}`); }
      s += `<rect class="hit" x="${xS(i) - cw / 2}" y="0" width="${cw}" height="${H}"${tipAttr(parts.join(' · '))}/>`;
    }
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- спарклайн */
  function spark(vals, o = {}) {
    const W = o.width || 90, H = o.height || 24, p = 3;
    const v = vals.filter(x => x != null);
    if (v.length < 2) return '';
    const min = Math.min(...v), max = Math.max(...v);
    const xS = i => p + (W - 2 * p) * (i / (v.length - 1));
    const yS = x => max === min ? H / 2 : p + (H - 2 * p) * (1 - (x - min) / (max - min));
    const pts = v.map((x, i) => `${xS(i)},${yS(x)}`).join(' ');
    return `<svg class="ch spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><polyline class="sp" points="${pts}"/><circle class="dot" cx="${xS(v.length - 1)}" cy="${yS(v[v.length - 1])}" r="2.5"/></svg>`;
  }

  /* ---------------------------------------------------------------- мост (waterfall) */
  function bridge(o) {
    const W = o.width || 640, H = o.height || 240;
    const items = [{ label: o.startLabel, value: o.start, type: 'total' }, ...o.steps.map(s => ({ ...s, type: 'step' })), { label: o.endLabel, value: o.end, type: 'total' }];
    let run = o.start; const bars = [];
    items.forEach(it => {
      if (it.type === 'total') { bars.push({ ...it, y0: it.value, y1: it.value }); run = it.value; }
      else { const y0 = run, y1 = run + it.value; bars.push({ ...it, y0: Math.min(y0, y1), y1: Math.max(y0, y1), from: y0, to: y1 }); run = y1; }
    });
    const vals = bars.flatMap(b => [b.y0, b.y1]);
    if (o.limit != null) vals.push(o.limit);
    let min = Math.min(...vals), max = Math.max(...vals);
    const range = max - min; min -= range * 0.35; max += range * 0.15;
    const t = ticks(min, max, 3);
    const padL = tickWidth(t, 'int'), padR = 12, padT = 24, padB = 46;
    const yS = v => padT + (H - padT - padB) * (1 - (v - t.lo) / (t.hi - t.lo));
    const n = bars.length, slot = (W - padL - padR) / n, bw = Math.min(44, slot * 0.58);
    const xS = i => padL + slot * i + (slot - bw) / 2;
    let s = svgOpen(W, H, 'bridge');
    t.out.forEach(v => { s += `<line class="grid" x1="${padL}" y1="${yS(v)}" x2="${W - padR}" y2="${yS(v)}"/><text class="tick" x="${padL - 4}" y="${yS(v) + 3}" text-anchor="end">${fmtTick(v, 'int')}</text>`; });
    const base = yS(t.lo);
    // знак обрыва оси: итоговые столбцы начинаются не с нуля
    s += `<text class="tick" x="${padL - 4}" y="${base + 2}" text-anchor="end">≈</text>`;
    bars.forEach((b, i) => {
      const x = xS(i);
      let cls, y, h, tip;
      if (b.type === 'total') { cls = 'tot'; y = yS(b.value); h = base - y; tip = `${b.label}: ${fmtInt(b.value)}`; }
      else { cls = b.value >= 0 ? 'pos' : 'neg'; y = yS(b.y1); h = Math.max(2, yS(b.y0) - yS(b.y1)); tip = `${b.label}: ${fmtDelta(b.value, 'int')} (${fmtInt(b.from)} → ${fmtInt(b.to)})${b.note ? ' · ' + b.note : ''}`; }
      if (b.flag) cls += ' flag-' + b.flag;
      s += `<rect class="bar ${cls}" x="${x}" y="${y}" width="${bw}" height="${h}" rx="2"${tipAttr(tip)}/>`;
      if (i < n - 1) { const lvl = b.type === 'total' ? b.value : b.to; s += `<line class="conn" x1="${x + bw}" y1="${yS(lvl)}" x2="${xS(i + 1)}" y2="${yS(lvl)}"/>`; }
      const lab = b.type === 'total' ? fmtInt(b.value) : fmtDelta(b.value, 'int');
      s += `<text class="val" x="${x + bw / 2}" y="${y - 5}" text-anchor="middle">${lab}</text>`;
      // подпись категории: перенос по словам, до 3 строк
      const maxChars = Math.max(7, Math.floor(slot / 6.4));
      const words = String(b.label).split(' '); const lines = []; let cur = '';
      words.forEach(w => { if ((cur + ' ' + w).trim().length > maxChars && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
      if (cur) lines.push(cur);
      lines.slice(0, 3).forEach((ln, k) => { s += `<text class="cat" x="${x + bw / 2}" y="${H - padB + 13 + k * 11}" text-anchor="middle">${esc(ln)}</text>`; });
    });
    if (o.limit != null) { s += `<line class="limit" x1="${padL}" y1="${yS(o.limit)}" x2="${W - padR}" y2="${yS(o.limit)}"/><text class="lim-label" x="${padL + 4}" y="${yS(o.limit) - 4}">лимит ${fmtInt(o.limit)}</text>`; }
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- слоп-диаграмма (Tufte slopegraph) */
  function slopeChart(o) {
    const items = o.items; const n = items.length;
    const W = o.width || 440; const compact = !!o.compact;
    const gap = compact ? 12 : 13;
    const H = Math.max(compact ? 120 : 150, 40 + n * (compact ? 17 : 21));
    const padT = 22, padB = 8; const labW = o.labelWidth || (compact ? 120 : 150); const xL = labW, xR = W - labW;
    const vals = items.flatMap(it => [it.a, it.b]);
    const min = Math.min(...vals), max = Math.max(...vals);
    const yS = v => padT + (H - padT - padB) * (1 - (v - min) / ((max - min) || 1));
    const la = spread(items.map(it => yS(it.a)), gap, padT, H - padB), lb = spread(items.map(it => yS(it.b)), gap, padT, H - padB);
    const u = o.unit || '%';
    const maxName = Math.floor((labW - 30) / (compact ? 5.4 : 5.8));
    let s = svgOpen(W, H, 'slope' + (compact ? ' compact' : ''));
    s += `<text class="tick" x="${xL}" y="11" text-anchor="end">${esc(o.left)}</text><text class="tick" x="${xR}" y="11" text-anchor="start">${esc(o.right)}</text>`;
    s += `<line class="axis" x1="${xL}" y1="${padT - 4}" x2="${xL}" y2="${H - padB}"/><line class="axis" x1="${xR}" y1="${padT - 4}" x2="${xR}" y2="${H - padB}"/>`;
    const order = [...items.keys()].sort((a, b) => (items[a].changed ? 1 : 0) - (items[b].changed ? 1 : 0));
    order.forEach(i => {
      const it = items[i];
      const cls = it.changed ? (it.delta > 0 ? 'up' : 'down') : 'flat';
      const tip = `${it.name}: ${fmtNum(it.a, 1)}${u} → ${fmtNum(it.b, 1)}${u} (${fmtDelta(it.delta, 'pct')})${it.note ? ' · ' + it.note : ''}`;
      s += `<line class="sl ${cls}" x1="${xL}" y1="${yS(it.a)}" x2="${xR}" y2="${yS(it.b)}"${tipAttr(tip)}/>`;
      s += `<circle class="sdot ${cls}" cx="${xL}" cy="${yS(it.a)}" r="3"/><circle class="sdot ${cls}" cx="${xR}" cy="${yS(it.b)}" r="3"/>`;
      const name = it.name.length > maxName ? it.name.slice(0, maxName - 1) + '…' : it.name;
      const fa = fmtNum(it.a, Number.isInteger(it.a) ? 0 : 1), fb = fmtNum(it.b, Number.isInteger(it.b) ? 0 : 1);
      s += `<text class="slab ${cls}" x="${xL - 8}" y="${la[i] + 3.5}" text-anchor="end"><tspan class="sval">${fa}</tspan>  ${esc(name)}</text>`;
      s += `<text class="slab ${cls}" x="${xR + 8}" y="${lb[i] + 3.5}"><tspan class="sval">${fb}</tspan>${it.changed ? `<tspan class="sdelta ${cls}"> ${fmtDelta(it.delta, 'pct', 1, false)}</tspan>` : ''}</text>`;
    });
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- горизонтальные бары с маркером прошлого периода */
  function hbars(o) {
    const items = o.items; const n = items.length;
    const W = o.width || 420, rowH = o.rowH || 22, labW = o.labelWidth || 150, valW = o.valueWidth || 52;
    const H = n * rowH + 6;
    const max = o.max || Math.max(...items.map(it => Math.max(it.value, it.prev == null ? 0 : it.prev))) * 1.05;
    const x0 = labW + 6, x1 = W - valW;
    const xS = v => x0 + (x1 - x0) * (v / max);
    const fmt = o.fmt || 'int', d = o.decimals == null ? 0 : o.decimals;
    const maxName = Math.floor(labW / 5.6);
    let s = svgOpen(W, H, 'hbars');
    items.forEach((it, i) => {
      const y = 3 + i * rowH, bh = Math.min(14, rowH - 8);
      const cls = 'bar ' + (it.flag ? 'flag-' + it.flag : (it.muted ? 'muted' : 'norm'));
      const tip = `${it.name}: ${fmtVal(it.value, fmt, d)}${it.suffix ? it.suffix : ''}${it.prev != null ? ` (${o.prevLabel || 'ранее'}: ${fmtVal(it.prev, fmt, d)})` : ''}${it.note ? ' · ' + it.note : ''}`;
      s += `<text class="cat" x="${labW}" y="${y + bh / 2 + 4}" text-anchor="end">${esc(it.name.length > maxName ? it.name.slice(0, maxName - 1) + '…' : it.name)}</text>`;
      s += `<rect class="${cls}" x="${x0}" y="${y}" width="${Math.max(1, xS(it.value) - x0)}" height="${bh}" rx="2"${tipAttr(tip)}/>`;
      if (it.prev != null) s += `<line class="prev" x1="${xS(it.prev)}" y1="${y - 2}" x2="${xS(it.prev)}" y2="${y + bh + 2}"/>`;
      s += `<text class="val" x="${x1 + 6}" y="${y + bh / 2 + 4}">${fmtVal(it.value, fmt, d)}${it.suffix ? esc(it.suffix) : ''}</text>`;
    });
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- стек колонок по месяцам */
  function stackedColumns(o) {
    const W = o.width || 620, H = o.height || 200, padR = 12, padT = 18, padB = 22;
    const months = o.months, series = o.series; const n = months.length;
    const totals = months.map((_, i) => series.reduce((a, sr) => a + (sr.values[i] || 0), 0));
    const t = ticks(0, Math.max(...totals) * 1.05, 3);
    const padL = tickWidth(t, 'int');
    const yS = v => padT + (H - padT - padB) * (1 - v / t.hi);
    const slot = (W - padL - padR) / n, bw = Math.min(22, slot * 0.6);
    const xS = i => padL + slot * i + (slot - bw) / 2;
    let s = svgOpen(W, H, 'stack');
    t.out.forEach(v => { s += `<line class="grid" x1="${padL}" y1="${yS(v)}" x2="${W - padR}" y2="${yS(v)}"/><text class="tick" x="${padL - 4}" y="${yS(v) + 3}" text-anchor="end">${fmtTick(v, 'int')}</text>`; });
    const every = o.every || (W < 400 ? 3 : 1);
    months.forEach((m, i) => {
      let acc = 0;
      const tip = [m, ...series.map(sr => `${sr.name}: ${fmtInt(sr.values[i])}`), `всего: ${fmtInt(totals[i])}`].join(' · ');
      series.forEach((sr, k) => {
        const v = sr.values[i] || 0; const y1 = yS(acc + v), y0 = yS(acc);
        const gap = k === 0 ? 0 : 2;
        s += `<rect class="seg s${k}" x="${xS(i)}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1 - gap)}"${tipAttr(tip)}/>`;
        acc += v;
      });
      if (i === n - 1 || i === 0) s += `<text class="val" x="${xS(i) + bw / 2}" y="${yS(totals[i]) - 4}" text-anchor="middle">${fmtInt(totals[i])}</text>`;
      if (i % every === 0 || i === n - 1) s += `<text class="tick" x="${xS(i) + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(m)}</text>`;
    });
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- несколько линий по месяцам */
  function lines(o) {
    const W = o.width || 620, H = o.height || 180, padR = 44, padT = 14, padB = 22;
    const x = o.x, series = o.series, n = x.length;
    const fmt = o.fmt || 'int', d = o.decimals == null ? 0 : o.decimals;
    const all = series.flatMap(sr => sr.values).filter(v => v != null);
    let min = Math.min(...all), max = Math.max(...all); const pad = (max - min) * 0.15 || 1; min -= pad; max += pad;
    if (Math.min(...all) >= 0 && min < 0) min = 0;
    if (o.zero) min = 0;
    const t = ticks(min, max, 3);
    const padL = tickWidth(t, fmt);
    const yS = v => padT + (H - padT - padB) * (1 - (v - t.lo) / (t.hi - t.lo));
    const xS = i => padL + (W - padL - padR) * (i / (n - 1));
    let s = svgOpen(W, H, 'lines');
    t.out.forEach(v => { s += `<line class="grid" x1="${padL}" y1="${yS(v)}" x2="${W - padR}" y2="${yS(v)}"/><text class="tick" x="${padL - 4}" y="${yS(v) + 3}" text-anchor="end">${fmtTick(v, fmt)}</text>`; });
    x.forEach((m, i) => { if (i % (o.every || 2) === 0 || i === n - 1) s += `<text class="tick" x="${xS(i)}" y="${H - 6}" text-anchor="middle">${esc(m)}</text>`; });
    const ends = series.map(sr => sr.values[n - 1]).map(v => v == null ? null : yS(v));
    const endY = spread(ends.map(v => v == null ? -999 : v), 12, padT, H - padB);
    series.forEach((sr, k) => {
      const pts = sr.values.map((v, i) => v == null ? null : `${xS(i)},${yS(v)}`).filter(Boolean).join(' ');
      s += `<polyline class="ln s${k} ${sr.cls || ''}" points="${pts}"${sr.dash ? ` stroke-dasharray="${sr.dash}"` : ''}/>`;
      const last = sr.values[n - 1];
      if (last != null) { s += `<circle class="dot-ring" cx="${xS(n - 1)}" cy="${yS(last)}" r="5"/><circle class="dot s${k}" cx="${xS(n - 1)}" cy="${yS(last)}" r="3.5"/><text class="end-label" x="${xS(n - 1) + 8}" y="${endY[k] + 3.5}">${fmtVal(last, fmt, d)}</text>`; }
    });
    const cw = (W - padL - padR) / (n - 1);
    x.forEach((m, i) => { const tip = [m, ...series.map(sr => `${sr.name}: ${sr.values[i] == null ? '—' : fmtVal(sr.values[i], fmt, d)}`)].join(' · '); s += `<rect class="hit" x="${xS(i) - cw / 2}" y="0" width="${cw}" height="${H}"${tipAttr(tip)}/>`; });
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- легенда */
  function legend(items) {
    return `<div class="legend">${items.map(it => `<span class="lg"><i class="key ${it.cls}"></i>${esc(it.name)}</span>`).join('')}</div>`;
  }

  /* ---------------------------------------------------------------- тултип (делегирование) */
  function initTips() {
    const tip = document.getElementById('tip'); if (!tip) return;
    let cur = null;
    document.addEventListener('pointermove', e => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      if (!el) { if (cur) { tip.hidden = true; cur = null; } return; }
      if (el !== cur) { cur = el; tip.textContent = el.getAttribute('data-tip'); tip.hidden = false; }
      const x = e.clientX + 14, y = e.clientY + 14;
      const r = tip.getBoundingClientRect();
      tip.style.left = Math.min(x, window.innerWidth - r.width - 8) + 'px';
      tip.style.top = Math.min(y, window.innerHeight - r.height - 8) + 'px';
    });
    document.addEventListener('pointerleave', () => { tip.hidden = true; cur = null; });
  }

  return { fmtInt, fmtNum, fmtPct, fmtVal, fmtDelta, esc, MONTHS, yoyLine, spark, bridge, slopeChart, hbars, stackedColumns, lines, legend, initTips, ticks, spread };
})();
</script>
<script>/* variants.js — три альтернативных подачи первой страницы на одних и тех же данных */
(() => {
  /* Без viewport-меты телефон верстает страницу в 980 px и всё уезжает.
     Артефакт-обёртка мету добавляет, но самодостаточный файл открывают и напрямую. */
  (() => { if (!document.querySelector('meta[name="viewport"]')) { const m = document.createElement('meta'); m.name = 'viewport'; m.content = 'width=device-width, initial-scale=1, viewport-fit=cover'; document.head.appendChild(m); } })();

  const D = window.DATA, M = D.meta, T = D.control_panel, S = D.summary;
  const { fmtInt, fmtNum, fmtPct, fmtVal, fmtDelta, esc } = CH;
  const byId = Object.fromEntries(T.map(t => [t.id, t]));
  const STATUS_WORD = { red: 'Требует решения', amber: 'Наблюдаем', ok: 'По плану', none: 'Без изменений' };
  const chip = (st, text) => `<span class="chip ${st}">${esc(text)}</span>`;
  const deltaCls = (d, good) => { if (!d || good === 'none' || good === 'range') return 'neutral'; if (good === 'up') return d > 0 ? 'up-good' : 'down-bad'; if (good === 'down') return d > 0 ? 'up-bad' : 'down-good'; return 'neutral'; };
  const PAGES = [
    { id: 'intro', no: '00', nav: 'Как читать', eyebrow: 'Варианты подачи первой страницы' },
    { id: 'wbr', no: 'A', nav: 'A · Amazon-дек', eyebrow: 'Вариант A · метрик-дек по образцу Amazon WBR', sep: true },
    { id: 'memo', no: 'B', nav: 'B · Записка', eyebrow: 'Вариант B · нарративная записка (6-pager) с таблицей-приложением' },
    { id: 'signals', no: 'C', nav: 'C · Сигналы', eyebrow: 'Вариант C · сигнальная доска: только исключения' },
    { id: 'compare', no: '=', nav: 'Сравнение', eyebrow: 'Сравнение и рекомендация', sep: true },
  ];
  const pageHead = (p, title, sub) => `<header class="page-head"><div><div class="eyebrow">${p.no} · ${esc(p.eyebrow)}</div><h1 class="page-title">${esc(title)}${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</h1></div><div class="page-meta">${esc(M.period_label)} · одни и те же данные во всех вариантах<br>цифры вымышленные</div></header>`;
  const pageFoot = (p, note) => `<footer class="page-foot"><span>${esc(note || '')}</span><span class="pn">${p.no}</span></footer>`;
  const card = (title, body, sub = '', cls = '') => `<div class="card ${cls}"><div class="card-title">${title}</div>${sub ? `<div class="card-sub">${esc(sub)}</div>` : ''}${body}</div>`;
  const spark20 = t => CH.spark([...t.series.y2025, ...t.series.y2026], { width: 80, height: 20 });
  const val = t => fmtVal(t.value, t.fmt, t.decimals);
  const verdict = (pros, cons, fit) => `<div class="verdict">
    ${card('Сильные стороны', `<ul>${pros.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`)}
    ${card('Слабые стороны', `<ul>${cons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`)}
    ${card('Когда подходит', `<ul>${fit.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`)}
  </div>`;

  /* ---------------------------------------------------------------- 00 как читать */
  function renderIntro(p) {
    return `${pageHead(p, 'Три способа показать одни и те же 15 метрик: дек, записка, сигналы', 'Каждый вариант — законченная первая страница месячного обзора. Смотрите, что считывается быстрее, что хочется читать, что даёт зацепки для вопросов. Основной макет (exec_board) собирает лучшее из B и C на странице 01 и плитки на странице 02.')}
      <div class="intro">
        ${card('<h3>A · Amazon-дек</h3>', `<p>Сетка одинаковых графиков: слева последние 6 месяцев крупно, справа год против прошлого года, под графиком «box score» — значение, м/м, г/г, к плану. Никакого текста и цветовых статусов: исключения отмечены только флажком, всё остальное читается по форме линии. Читают «сверху вниз, в одном и том же порядке каждый месяц».</p><div class="src">Источник практики: Working Backwards (гл. 6 «Metrics»), формат 6-12 chart и box scores из Amazon WBR.</div>`)}
        ${card('<h3>B · Нарративная записка</h3>', `<p>Полные предложения вместо графиков: пять абзацев — численность, люди, найм, структура и нагрузка, результативность — с цифрами и word-sized спарклайнами внутри текста. Дальше FAQ: вопросы, которые задаст директор, с ответами владельцев, написанными заранее. Таблица метрик — приложение.</p><div class="src">Источник практики: Amazon 6-pager и MBR-нарратив (метрики → объяснение результатов → инициативы → FAQ → приложение), Tufte sparklines.</div>`)}
        ${card('<h3>C · Сигнальная доска</h3>', `<p>Управление по исключениям: на странице только метрики, вышедшие за порог, — отсортированные по серьёзности, с изменением, причиной, владельцем и вопросом. Всё, что стабильно, свёрнуто в одну строку спарклайнов внизу. Минимальное время чтения, максимум «куда идти и кого спросить».</p><div class="src">Источник практики: management by exception (Taylor, PRINCE2), Few «highlight only when a threshold is crossed», Amazon «nothing to see here».</div>`)}
      </div>
      ${pageFoot(p, 'Навигация вверху: A, B, C и сравнение')}`;
  }

  /* ---------------------------------------------------------------- A · Amazon WBR */
  function wbr(t, i) {
    const s = t.series;
    const left = CH.lines({ width: 150, height: 92, x: CH.MONTHS.slice(2, 8), series: [{ name: '2026', values: s.y2026.slice(2, 8) }, { name: '2025', values: s.y2025.slice(2, 8) }], fmt: t.fmt, decimals: t.decimals, every: 5 });
    const right = CH.yoyLine({ width: 250, height: 92, y2025: s.y2025, y2026: s.y2026, plan: s.plan, forecast: s.forecast, limit: t.limit, target: (s.plan ? null : t.target), fmt: t.fmt, decimals: t.decimals, yMin: t.axis ? t.axis[0] : null, yMax: t.axis ? t.axis[1] : null });
    const planCell = t.delta_plan != null ? `<span>к плану<b>${fmtDelta(t.delta_plan, t.fmt, t.decimals)}</b></span>` : (t.target != null ? `<span>цель<b>${fmtVal(t.target, t.fmt, 0)}</b></span>` : `<span>план<b>—</b></span>`);

  function renderSignals(p) {

        ${card('Что это меняет в данных', `<ul class="list"><li>Для всех вариантов: месячные ряды с января 2025 по каждой метрике панели, план или цель на 2026, владелец</li><li>Для A: те же ряды за 2024 (прошлый год для левой панели «6 месяцев»)</li><li>Для C: пороги статусов в справочнике метрик, а не в голове аналитика</li><li>Для B: причинные срезы (причины оттока, сегменты) — иначе текст не о чем писать</li></ul>`)}
      </div>
      ${pageFoot(p, 'Все три варианта собраны из одного JSON — mockups/data/exec_board_2026-08.json')}`;
  }

  const R = { intro: renderIntro, wbr: renderWbr, memo: renderMemo, signals: renderSignals, compare: renderCompare };
  document.getElementById('brand-sub').textContent = `варианты подачи · ${M.company} · ${M.period_label}`;
  document.getElementById('tabs').innerHTML = PAGES.map(p => `<a href="#p-${p.id}" class="${p.sep ? 'sep' : ''}"><span class="n">${p.no}</span>${esc(p.nav)}</a>`).join('');
  document.getElementById('app').innerHTML = PAGES.map(p => `<section class="page" id="p-${p.id}">${R[p.id](p)}</section>`).join('');
  CH.initTips();
})();
