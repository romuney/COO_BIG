<title>Exec Board «Орион»</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap">
<style>
/* ============================================================ токены */
:root {
  color-scheme: light;
  --bg: #eceef2;          /* холодная «бумага» */
  --surface: #ffffff;
  --surface-2: #f5f6f8;
  --ink: #161b23;
  --ink-2: #4a525f;
  --muted: #7f8794;
  --line: #e0e3e8;
  --line-2: #c9ced6;
  --accent: #2a78d6;      /* 2026, текущий период */
  --accent-soft: #e6eefb;
  --prior: #aab1bb;       /* 2025 */
  --plan: #161b23;        /* план / цель (пунктир) */
  --pos: #2a78d6;
  --neg: #5c6572;
  --red: #d03b3b;  --red-bg: #fae6e6;  --red-text: #a02a2a;
  --amber: #e28a00; --amber-bg: #fcefd6; --amber-text: #8a5200;
  --ok: #0ca30c;   --ok-bg: #e3f4e3;   --ok-text: #0f6b0f;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s7: #4a3aa7;
  --heat-1: #eef4fc; --heat-2: #cde2fb; --heat-3: #9ec5f4; --heat-4: #5598e7; --heat-5: #256abf;
  --shadow: 0 1px 2px rgba(22,27,35,.06), 0 8px 24px rgba(22,27,35,.06);
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: "Golos Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1216; --surface: #171b21; --surface-2: #1e232a;
    --ink: #eef1f5; --ink-2: #b7bec8; --muted: #8b939e;
    --line: #2a3038; --line-2: #3a414b;
    --accent: #3987e5; --accent-soft: #1d2b40; --prior: #5d6673; --plan: #e6e9ee;
    --pos: #3987e5; --neg: #8b939e;
    --red: #e66767; --red-bg: #3a1f1f; --red-text: #f0a3a3;
    --amber: #e8a53a; --amber-bg: #3a2c12; --amber-text: #f2c36c;
    --ok: #35b535; --ok-bg: #16301a; --ok-text: #8fd98f;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s7: #9085e9;
    --heat-1: #1b2230; --heat-2: #1f3555; --heat-3: #1c5cab; --heat-4: #2a78d6; --heat-5: #6da7ec;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1216; --surface: #171b21; --surface-2: #1e232a;
  --ink: #eef1f5; --ink-2: #b7bec8; --muted: #8b939e;
  --line: #2a3038; --line-2: #3a414b;
  --accent: #3987e5; --accent-soft: #1d2b40; --prior: #5d6673; --plan: #e6e9ee;
  --pos: #3987e5; --neg: #8b939e;
  --red: #e66767; --red-bg: #3a1f1f; --red-text: #f0a3a3;
  --amber: #e8a53a; --amber-bg: #3a2c12; --amber-text: #f2c36c;
  --ok: #35b535; --ok-bg: #16301a; --ok-text: #8fd98f;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s7: #9085e9;
  --heat-1: #1b2230; --heat-2: #1f3555; --heat-3: #1c5cab; --heat-4: #2a78d6; --heat-5: #6da7ec;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

/* ============================================================ база */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
b, strong { font-weight: 600; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ============================================================ верхняя панель */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px; padding: 0 28px; height: 52px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.brand-name { font-family: var(--serif); font-weight: 600; font-size: 18px; letter-spacing: .01em; }
.brand-sub { color: var(--muted); font-size: 12px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-left: auto; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 4px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.tabs a:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
.tabs a .n { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tabs a.sep { padding-left: 14px; border-left: 1px solid var(--line); border-radius: 0; margin-left: 6px; }

/* ============================================================ страницы */
main { max-width: 1360px; margin: 0 auto; padding: 22px 24px 60px; display: flex; flex-direction: column; gap: 22px; }
.page { scroll-margin-top: 64px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 26px 30px 18px; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: grid; grid-template-columns: 1fr auto; gap: 6px 24px; align-items: end; border-bottom: 1px solid var(--line); padding-bottom: 14px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.page-title { font-family: var(--serif); font-size: 26px; line-height: 1.2; font-weight: 600; max-width: 30ch; }
.page-title .sub { display: block; font-family: var(--sans); font-weight: 400; font-size: 13.5px; color: var(--ink-2); margin-top: 6px; text-wrap: pretty; max-width: 80ch; }
.page-meta { color: var(--muted); font-size: 12px; text-align: right; line-height: 1.5; }
.page-foot { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); font-size: 12px; }
.page-foot .pn { margin-left: auto; font-variant-numeric: tabular-nums; }
.page-foot .lk::before { content: "↗ "; color: var(--muted); }

/* ============================================================ сетки и карточки */
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.g23 { grid-template-columns: 2fr 1fr; }
.g32 { grid-template-columns: 3fr 2fr; }
.rail-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 22px; align-items: start; }
.span2 { grid-column: span 2; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card.flat { border: 0; padding: 0; }
.card-title { font-size: 13px; font-weight: 600; line-height: 1.3; }
.card-sub { font-size: 12px; color: var(--muted); }
.panel { background: var(--surface-2); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.panel .card-title { font-size: 12.5px; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* ============================================================ нарратив (рельса) */
.rail { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 64px; }
.comment { font-family: var(--serif); font-size: 15.5px; line-height: 1.5; color: var(--ink); text-wrap: pretty; }
.comment .lead { font-weight: 600; }
.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
.tag i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: inline-block; }
.ask { display: flex; flex-direction: column; gap: 10px; }
.ask-item { display: grid; grid-template-columns: 18px 1fr; gap: 8px; font-size: 13px; line-height: 1.4; }
.ask-item .q { font-family: var(--serif); font-weight: 600; font-size: 15px; color: var(--accent); line-height: 1; padding-top: 2px; }
.ask-item .to { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.links { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }

/* ============================================================ статусы */
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; line-height: 1.5; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.red { background: var(--red-bg); color: var(--red-text); }
.chip.amber { background: var(--amber-bg); color: var(--amber-text); }
.chip.amber::before { border-radius: 1px; transform: rotate(45deg); width: 6px; height: 6px; }
.chip.ok { background: var(--ok-bg); color: var(--ok-text); }
.chip.ok::before { content: "✓"; background: none; width: auto; height: auto; font-size: 10px; }
.chip.none { background: var(--surface-2); color: var(--ink-2); }
.chip.none::before { background: var(--line-2); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.red { background: var(--red); } .dot.amber { background: var(--amber); border-radius: 1px; transform: rotate(45deg); } .dot.ok { background: var(--ok); } .dot.none { background: var(--line-2); }
.up-good, .down-good { color: var(--ok-text); } .up-bad, .down-bad { color: var(--red-text); } .neutral { color: var(--ink-2); }

/* ============================================================ резюме */
.headline { font-family: var(--serif); font-size: 30px; line-height: 1.18; font-weight: 600; max-width: 28ch; }
.summary-text { display: flex; flex-direction: column; gap: 12px; max-width: 64ch; }
.summary-text p { font-family: var(--serif); font-size: 16px; line-height: 1.5; text-wrap: pretty; }
.summary-text p::first-letter { }
.signals { display: flex; flex-direction: column; gap: 4px; }
.sig-group { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 0 4px; }
.sig { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: start; padding: 7px 8px; border-radius: 5px; font-size: 13px; line-height: 1.35; }
.sig:hover { background: var(--surface-2); }
.sig .dot { margin-top: 5px; }
.sig .t { font-weight: 600; }
.sig .x { color: var(--ink-2); }
.sig .pg { color: var(--muted); font-size: 11.5px; white-space: nowrap; padding-top: 2px; }
.list { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.list li { list-style: none; display: grid; grid-template-columns: 12px 1fr; gap: 8px; }
.list li::before { content: "—"; color: var(--muted); }
.list.arrows li::before { content: "→"; color: var(--accent); }
ul.list { margin: 0; padding: 0; }
.decision { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 8px 10px; background: var(--surface-2); border-radius: 5px; font-size: 13px; }
.decision .own { color: var(--muted); font-size: 12px; white-space: nowrap; }

/* ============================================================ плитки панели управления */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.tile { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; }
.tile.wide { grid-column: span 2; }
.tile.st-red { border-color: color-mix(in srgb, var(--red) 55%, var(--line)); box-shadow: inset 3px 0 0 var(--red); }
.tile.st-amber { box-shadow: inset 3px 0 0 var(--amber); }
.tile.st-ok { box-shadow: inset 3px 0 0 var(--ok); }
.tile-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tile-title { font-size: 13px; font-weight: 600; line-height: 1.3; }
.tile-value { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.tile-value .big { font-size: 28px; font-weight: 600; line-height: 1; letter-spacing: -.01em; }
.tile-value .unit { color: var(--muted); font-size: 12px; }
.tile-deltas { display: flex; gap: 12px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.tile-deltas b { font-weight: 600; }
.tile-chart { margin: 2px -4px 0; }
.tile-status { font-size: 12.5px; line-height: 1.35; color: var(--ink-2); }
.tile.st-red .tile-status, .tile.st-amber .tile-status { color: var(--ink); }
.tile-secondary { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 6px; }
.tile-secondary b { color: var(--ink-2); font-weight: 500; }
.tile-ask { font-size: 12.5px; line-height: 1.35; display: grid; grid-template-columns: 14px 1fr; gap: 6px; }
.tile-ask .q { font-family: var(--serif); font-weight: 600; color: var(--accent); }
.tile-ask .to { color: var(--muted); font-size: 11.5px; display: block; }
.tile-owner { font-size: 11px; color: var(--muted); }
.howto { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--ink-2); align-items: center; }
.howto .k { display: inline-flex; align-items: center; gap: 6px; }
.key { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--accent); }
.key.prior { border-color: var(--prior); }
.key.plan { border-top: 0; border-bottom: 2px dotted var(--plan); }
.key.limit { border-color: var(--red); border-top-style: dashed; }
.key.fc { border-color: var(--red); border-top-style: dotted; }
.key.fca { border-color: var(--accent); border-top-style: dotted; }
.key.box { width: 12px; height: 12px; border: 0; border-radius: 2px; }
.key.s0 { background: var(--s1); } .key.s1 { background: var(--s2); } .key.s2 { background: var(--prior); }
.key.pos { background: var(--pos); } .key.neg { background: var(--neg); } .key.tot { background: var(--ink); }
.key.now { background: var(--accent); } .key.prevmark { width: 2px; height: 14px; background: var(--ink); border: 0; }

/* ============================================================ KPI-ряд */
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(5, minmax(0, 1fr)); }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpis.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpi { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.kpi .l { font-size: 11.5px; color: var(--ink-2); line-height: 1.3; display: flex; justify-content: space-between; gap: 6px; align-items: start; }
.kpi .v { font-size: 22px; font-weight: 600; line-height: 1.1; letter-spacing: -.01em; }
.kpi .s { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.kpi.tone-red .v { color: var(--red-text); } .kpi.tone-amber .v { color: var(--amber-text); } .kpi.tone-ok .v { color: var(--ok-text); }

/* ============================================================ таблицы */
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: right; font-weight: 500; color: var(--muted); font-size: 11px; padding: 6px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; vertical-align: bottom; line-height: 1.25; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.name { font-weight: 500; }
.tbl td.note { text-align: left; color: var(--muted); font-size: 11.5px; white-space: normal; }
.tbl .chip { white-space: normal; line-height: 1.3; }
.tbl.compact { font-size: 12px; } .tbl.compact th, .tbl.compact td { padding: 5px 6px; }
.tbl td .sub { display: block; font-weight: 400; color: var(--muted); font-size: 11px; white-space: normal; }
.tbl tr.total td { font-weight: 600; border-top: 1px solid var(--line-2); }
.tbl .heat { border-radius: 3px; }
.tbl td .spark { vertical-align: middle; }
.tbl-wrap { overflow-x: auto; }
.cell-flag { display: inline-flex; align-items: center; gap: 6px; }
td.h1 { background: var(--heat-1); } td.h2 { background: var(--heat-2); } td.h3 { background: var(--heat-3); } td.h4 { background: var(--heat-4); color: #fff; } td.h5 { background: var(--heat-5); color: #fff; }

/* ============================================================ слопы */
.slopes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.slopes.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.slope-card { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 6px; }
.slope-card .card-title { display: flex; justify-content: space-between; gap: 8px; align-items: start; }
.slope-card .prio { font-size: 10.5px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.slope-comment { font-size: 12.5px; color: var(--ink-2); line-height: 1.4; border-top: 1px solid var(--line); padding-top: 6px; }
.stable-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 24px; }
.stable-row { display: grid; grid-template-columns: 1fr auto 90px; gap: 10px; align-items: center; font-size: 12.5px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.stable-row .v { color: var(--muted); font-size: 12px; white-space: nowrap; }

/* ============================================================ прочее */
.ratio { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.ratio .v { font-size: 20px; font-weight: 600; }
.ratio .t { font-size: 11.5px; color: var(--muted); grid-column: 1 / -1; }
.whatsnew { display: flex; flex-direction: column; gap: 8px; }
.whatsnew li { list-style: none; display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 13px; }
.whatsnew li::before { content: "★"; color: var(--accent); }
ul.whatsnew { margin: 0; padding: 0; }
.note { font-size: 12px; color: var(--muted); line-height: 1.4; }
.optional { border-style: dashed; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--ink-2); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg .key { border-top-width: 2px; }
.print-hint { font-size: 12px; color: var(--muted); }
.tip { position: fixed; z-index: 100; max-width: 340px; background: var(--ink); color: var(--surface); font-size: 12px; line-height: 1.35; padding: 6px 9px; border-radius: 4px; pointer-events: none; box-shadow: var(--shadow); }
.dict { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 24px; font-size: 12.5px; }
.dict div { display: grid; grid-template-columns: 1fr; gap: 1px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.dict b { font-weight: 600; }
.dict span { color: var(--ink-2); font-size: 12px; }

/* ============================================================ SVG */
.ch { display: block; overflow: visible; font-family: var(--sans); }
.ch text { fill: var(--ink-2); font-size: 10.5px; }
.ch .tick { fill: var(--muted); font-size: 10px; }
.ch .grid { stroke: var(--line); stroke-width: 1; }
.ch .axis { stroke: var(--line-2); stroke-width: 1; }
.ch polyline { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch .cur { stroke: var(--accent); }
.ch .prior { stroke: var(--prior); }
.ch .plan { stroke: var(--plan); stroke-width: 1.5; }
.ch .limit { stroke: var(--red); stroke-width: 1.5; stroke-dasharray: 5 3; }
.ch .target { stroke: var(--plan); stroke-width: 1; stroke-dasharray: 2 3; }
.ch .fc-a { stroke: var(--accent); stroke-width: 1.5; }
.ch .fc-b { stroke: var(--red); stroke-width: 1.5; }
.ch .lim-label, .ch .fc-label { fill: var(--red-text); font-size: 9.5px; font-weight: 600; }
.ch .tgt-label { fill: var(--muted); font-size: 9.5px; }
.ch .dot { fill: var(--accent); }
.ch .dot-ring { fill: var(--surface); }
.ch .end-label { fill: var(--ink); font-weight: 600; font-size: 11px; }
.ch .hit { fill: transparent; }
.ch .hit:hover { fill: color-mix(in srgb, var(--accent) 8%, transparent); }
.spark .sp { stroke: var(--prior); stroke-width: 1.5; }
.spark .dot { fill: var(--accent); }
.bridge .bar.tot { fill: var(--ink); } .bridge .bar.pos { fill: var(--pos); } .bridge .bar.neg { fill: var(--neg); }
.bridge .bar.flag-amber { fill: var(--amber); } .bridge .bar.flag-red { fill: var(--red); }
.bridge .conn { stroke: var(--line-2); stroke-width: 1; }

<script>/* charts.js — SVG-примитивы для Exec Board. Без зависимостей.
   Все графики рисуются в viewBox и масштабируются по ширине контейнера:
   передавайте width, близкий к реальной ширине колонки, чтобы текст не мельчал. */
const CH = (() => {
  const NB = ' '; // узкий неразрывный пробел для разрядов
  const fmtInt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, NB);
  const fmtNum = (n, d = 1) => Number(n).toFixed(d).replace('.', ',');
  const fmtPct = (n, d = 1) => fmtNum(n, d) + '%';
  const fmtVal = (n, fmt, d = 1) => fmt === 'int' ? fmtInt(n) : fmt === 'pct' ? fmtPct(n, d) : fmtNum(n, d);
  const fmtDelta = (n, fmt, d = 1, pp = true) => {
    if (n === null || n === undefined || isNaN(n)) return '—';
    const s = n > 0 ? '+' : (n < 0 ? '−' : '±');
    const a = Math.abs(n);
    if (fmt === 'int') return s + fmtInt(a);
    return s + fmtNum(a, d) + (fmt === 'pct' && pp ? `${NB}п.п.` : '');
  };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const MONTHS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

  function niceStep(span, n) {
    const raw = span / n;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const m = raw / p;
    const f = m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10;
    return f * p;
  }
  function ticks(min, max, n = 3) {
    if (max === min) { max = min + 1; }
    const step = niceStep(max - min, n);
    const lo = Math.floor(min / step) * step;
    const hi = Math.ceil(max / step) * step;
    const out = [];
    for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(6));
    return { lo, hi, out };
  }
  function fmtTick(v, fmt) {
    if (fmt === 'int') return fmtInt(v);
    if (fmt === 'pct') return fmtNum(v, Number.isInteger(v) ? 0 : 1) + '%';
    return fmtNum(v, Number.isInteger(v) ? 0 : 1);
  }
  const tickWidth = (t, fmt) => Math.max(...t.out.map(v => fmtTick(v, fmt).length)) * 5.6 + 8;
  const tipAttr = txt => ` data-tip="${esc(txt)}"`;
  const svgOpen = (w, h, cls = '') => `<svg class="ch ${cls}" viewBox="0 0 ${w} ${h}" width="100%" role="img" preserveAspectRatio="xMidYMid meet">`;
  /* раздвигаем подписи по вертикали, чтобы не наезжали друг на друга, в пределах [top, bottom] */
  function spread(ys, gap, top, bottom) {
    const idx = ys.map((y, i) => ({ y, i })).sort((a, b) => a.y - b.y);
    for (let k = 1; k < idx.length; k++) idx[k].y = Math.max(idx[k].y, idx[k - 1].y + gap);
    const over = idx.length ? idx[idx.length - 1].y - bottom : 0;
    if (over > 0) { idx[idx.length - 1].y = bottom; for (let k = idx.length - 2; k >= 0; k--) idx[k].y = Math.min(idx[k].y, idx[k + 1].y - gap); }
    if (idx.length && idx[0].y < top) { idx[0].y = top; for (let k = 1; k < idx.length; k++) idx[k].y = Math.max(idx[k].y, idx[k - 1].y + gap); }
    const out = []; idx.forEach(a => out[a.i] = a.y); return out;
  }

  /* ---------------------------------------------------------------- линия год к году (по образцу Amazon WBR) */
  function yoyLine(o) {
    const W = o.width || 300, H = o.height || 120;
    const y25 = o.y2025 || [], y26 = o.y2026 || [], plan = o.plan || null;
    const fmt = o.fmt || 'num', d = o.decimals == null ? 1 : o.decimals;
    const fc = o.forecast || null; // {runrate:[], pipeline:[]} — с месяца после последнего факта
    const all = [...y25, ...y26];
    if (plan) all.push(...plan);
    if (o.limit != null) all.push(o.limit);
    if (o.target != null) all.push(o.target);
    if (fc) Object.values(fc).forEach(a => all.push(...a));
    let min = Math.min(...all), max = Math.max(...all);
    const pad = (max - min) * 0.12 || 1;
    min -= pad; max += pad;
    if (Math.min(...all) >= 0 && min < 0) min = 0;
    if (o.yMin != null) min = o.yMin;
    if (o.yMax != null) max = o.yMax;
    const t = ticks(min, max, 3);
    if (o.yMax != null && t.hi > o.yMax) { t.hi = o.yMax; t.out = t.out.filter(v => v <= o.yMax); }
    const padL = tickWidth(t, fmt), padR = fc ? 40 : 28, padT = 10, padB = 18;
    const yS = v => padT + (H - padT - padB) * (1 - (v - t.lo) / (t.hi - t.lo));
    const xS = i => padL + (W - padL - padR) * (i / 11);
    let s = svgOpen(W, H, 'yoy');
    t.out.forEach(v => {
      s += `<line class="grid" x1="${padL}" y1="${yS(v)}" x2="${W - padR}" y2="${yS(v)}"/>`;
      s += `<text class="tick" x="${padL - 4}" y="${yS(v) + 3}" text-anchor="end">${fmtTick(v, fmt)}</text>`;
    });
    MONTHS.forEach((m, i) => { if (i % 2 === 0) s += `<text class="tick" x="${xS(i)}" y="${H - 5}" text-anchor="middle">${m}</text>`; });
    const line = (arr, cls, dash) => {
      const pts = arr.map((v, i) => v == null ? null : `${xS(i)},${yS(v)}`).filter(Boolean);
      if (pts.length < 2) return '';
      return `<polyline class="${cls}" ${dash ? `stroke-dasharray="${dash}"` : ''} points="${pts.join(' ')}"/>`;
    };
    if (o.limit != null) {
      s += `<line class="limit" x1="${padL}" y1="${yS(o.limit)}" x2="${W - padR}" y2="${yS(o.limit)}"/>`;
      s += `<text class="lim-label" x="${padL + 3}" y="${yS(o.limit) - 3}">${o.limitLabel || 'лимит'} ${fmtVal(o.limit, fmt, 0)}</text>`;
    }
    if (o.target != null && o.limit == null) {
      s += `<line class="target" x1="${padL}" y1="${yS(o.target)}" x2="${W - padR}" y2="${yS(o.target)}"/>`;
      s += `<text class="tgt-label" x="${W - padR + 3}" y="${yS(o.target) + 3}">цель</text>`;
    }
    if (plan) s += line(plan, 'plan', '2 3');
    s += line(y25, 'prior');
    s += line(y26, 'cur');
    const n = y26.length;
    if (fc && n) {
      const from = [[xS(n - 1), yS(y26[n - 1])].join(',')];
      const mk = (arr, cls) => `<polyline class="${cls}" stroke-dasharray="3 3" points="${[...from, ...arr.map((v, i) => `${xS(n + i)},${yS(v)}`)].join(' ')}"/>`;
      if (fc.runrate) s += mk(fc.runrate, 'fc-a');
      if (fc.pipeline) { s += mk(fc.pipeline, 'fc-b'); const last = fc.pipeline[fc.pipeline.length - 1]; s += `<text class="fc-label" x="${xS(n + fc.pipeline.length - 1) + 4}" y="${yS(last) + 3}">${fmtVal(last, fmt, d)}</text>`; }
    }
    if (n) {
      s += `<circle class="dot-ring" cx="${xS(n - 1)}" cy="${yS(y26[n - 1])}" r="5"/>`;
      s += `<circle class="dot" cx="${xS(n - 1)}" cy="${yS(y26[n - 1])}" r="3.5"/>`;
      if (!fc) s += `<text class="end-label" x="${xS(n - 1) + 7}" y="${yS(y26[n - 1]) - 6}">${fmtVal(y26[n - 1], fmt, d)}</text>`;
    }
    const cw = (W - padL - padR) / 11;
    for (let i = 0; i < 12; i++) {
      const parts = [`${MONTHS[i]}`];
      if (y26[i] != null) parts.push(`2026: ${fmtVal(y26[i], fmt, d)}`);
      if (y25[i] != null) parts.push(`2025: ${fmtVal(y25[i], fmt, d)}`);
      if (plan && plan[i] != null) parts.push(`план: ${fmtVal(plan[i], fmt, d)}`);
      if (fc && i >= n) { if (fc.runrate) parts.push(`прогноз по темпу: ${fmtVal(fc.runrate[i - n], fmt, d)}`); if (fc.pipeline) parts.push(`прогноз по воронке: ${fmtVal(fc.pipeline[i - n], fmt, d)}`); }
      s += `<rect class="hit" x="${xS(i) - cw / 2}" y="0" width="${cw}" height="${H}"${tipAttr(parts.join(' · '))}/>`;
    }
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- спарклайн */
  function spark(vals, o = {}) {
    const W = o.width || 90, H = o.height || 24, p = 3;
    const v = vals.filter(x => x != null);
    if (v.length < 2) return '';
    const min = Math.min(...v), max = Math.max(...v);
    const xS = i => p + (W - 2 * p) * (i / (v.length - 1));
    const yS = x => max === min ? H / 2 : p + (H - 2 * p) * (1 - (x - min) / (max - min));
    const pts = v.map((x, i) => `${xS(i)},${yS(x)}`).join(' ');
    return `<svg class="ch spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><polyline class="sp" points="${pts}"/><circle class="dot" cx="${xS(v.length - 1)}" cy="${yS(v[v.length - 1])}" r="2.5"/></svg>`;
  }

  /* ---------------------------------------------------------------- мост (waterfall) */
  function bridge(o) {
    const W = o.width || 640, H = o.height || 240;
    const items = [{ label: o.startLabel, value: o.start, type: 'total' }, ...o.steps.map(s => ({ ...s, type: 'step' })), { label: o.endLabel, value: o.end, type: 'total' }];
    let run = o.start; const bars = [];
    items.forEach(it => {
      if (it.type === 'total') { bars.push({ ...it, y0: it.value, y1: it.value }); run = it.value; }
      else { const y0 = run, y1 = run + it.value; bars.push({ ...it, y0: Math.min(y0, y1), y1: Math.max(y0, y1), from: y0, to: y1 }); run = y1; }
    });
    const vals = bars.flatMap(b => [b.y0, b.y1]);
    if (o.limit != null) vals.push(o.limit);
    let min = Math.min(...vals), max = Math.max(...vals);
    const range = max - min; min -= range * 0.35; max += range * 0.15;
    const t = ticks(min, max, 3);
    const padL = tickWidth(t, 'int'), padR = 12, padT = 24, padB = 46;
    const yS = v => padT + (H - padT - padB) * (1 - (v - t.lo) / (t.hi - t.lo));
    const n = bars.length, slot = (W - padL - padR) / n, bw = Math.min(44, slot * 0.58);
    const xS = i => padL + slot * i + (slot - bw) / 2;
    let s = svgOpen(W, H, 'bridge');
    t.out.forEach(v => { s += `<line class="grid" x1="${padL}" y1="${yS(v)}" x2="${W - padR}" y2="${yS(v)}"/><text class="tick" x="${padL - 4}" y="${yS(v) + 3}" text-anchor="end">${fmtTick(v, 'int')}</text>`; });
    const base = yS(t.lo);
    // знак обрыва оси: итоговые столбцы начинаются не с нуля
    s += `<text class="tick" x="${padL - 4}" y="${base + 2}" text-anchor="end">≈</text>`;
    bars.forEach((b, i) => {
      const x = xS(i);
      let cls, y, h, tip;
      if (b.type === 'total') { cls = 'tot'; y = yS(b.value); h = base - y; tip = `${b.label}: ${fmtInt(b.value)}`; }
      else { cls = b.value >= 0 ? 'pos' : 'neg'; y = yS(b.y1); h = Math.max(2, yS(b.y0) - yS(b.y1)); tip = `${b.label}: ${fmtDelta(b.value, 'int')} (${fmtInt(b.from)} → ${fmtInt(b.to)})${b.note ? ' · ' + b.note : ''}`; }
      if (b.flag) cls += ' flag-' + b.flag;
      s += `<rect class="bar ${cls}" x="${x}" y="${y}" width="${bw}" height="${h}" rx="2"${tipAttr(tip)}/>`;
      if (i < n - 1) { const lvl = b.type === 'total' ? b.value : b.to; s += `<line class="conn" x1="${x + bw}" y1="${yS(lvl)}" x2="${xS(i + 1)}" y2="${yS(lvl)}"/>`; }
      const lab = b.type === 'total' ? fmtInt(b.value) : fmtDelta(b.value, 'int');
      s += `<text class="val" x="${x + bw / 2}" y="${y - 5}" text-anchor="middle">${lab}</text>`;
      // подпись категории: перенос по словам, до 3 строк
      const maxChars = Math.max(7, Math.floor(slot / 6.4));
      const words = String(b.label).split(' '); const lines = []; let cur = '';
      words.forEach(w => { if ((cur + ' ' + w).trim().length > maxChars && cur) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
      if (cur) lines.push(cur);
      lines.slice(0, 3).forEach((ln, k) => { s += `<text class="cat" x="${x + bw / 2}" y="${H - padB + 13 + k * 11}" text-anchor="middle">${esc(ln)}</text>`; });
    });
    if (o.limit != null) { s += `<line class="limit" x1="${padL}" y1="${yS(o.limit)}" x2="${W - padR}" y2="${yS(o.limit)}"/><text class="lim-label" x="${padL + 4}" y="${yS(o.limit) - 4}">лимит ${fmtInt(o.limit)}</text>`; }
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- слоп-диаграмма (Tufte slopegraph) */
  function slopeChart(o) {
    const items = o.items; const n = items.length;
    const W = o.width || 440; const compact = !!o.compact;
    const gap = compact ? 12 : 13;
    const H = Math.max(compact ? 120 : 150, 40 + n * (compact ? 17 : 21));
    const padT = 22, padB = 8; const labW = o.labelWidth || (compact ? 120 : 150); const xL = labW, xR = W - labW;
    const vals = items.flatMap(it => [it.a, it.b]);
    const min = Math.min(...vals), max = Math.max(...vals);
    const yS = v => padT + (H - padT - padB) * (1 - (v - min) / ((max - min) || 1));
    const la = spread(items.map(it => yS(it.a)), gap, padT, H - padB), lb = spread(items.map(it => yS(it.b)), gap, padT, H - padB);
    const u = o.unit || '%';
    const maxName = Math.floor((labW - 30) / (compact ? 5.4 : 5.8));
    let s = svgOpen(W, H, 'slope' + (compact ? ' compact' : ''));
    s += `<text class="tick" x="${xL}" y="11" text-anchor="end">${esc(o.left)}</text><text class="tick" x="${xR}" y="11" text-anchor="start">${esc(o.right)}</text>`;
    s += `<line class="axis" x1="${xL}" y1="${padT - 4}" x2="${xL}" y2="${H - padB}"/><line class="axis" x1="${xR}" y1="${padT - 4}" x2="${xR}" y2="${H - padB}"/>`;
    const order = [...items.keys()].sort((a, b) => (items[a].changed ? 1 : 0) - (items[b].changed ? 1 : 0));
    order.forEach(i => {
      const it = items[i];
      const cls = it.changed ? (it.delta > 0 ? 'up' : 'down') : 'flat';
      const tip = `${it.name}: ${fmtNum(it.a, 1)}${u} → ${fmtNum(it.b, 1)}${u} (${fmtDelta(it.delta, 'pct')})${it.note ? ' · ' + it.note : ''}`;
      s += `<line class="sl ${cls}" x1="${xL}" y1="${yS(it.a)}" x2="${xR}" y2="${yS(it.b)}"${tipAttr(tip)}/>`;
      s += `<circle class="sdot ${cls}" cx="${xL}" cy="${yS(it.a)}" r="3"/><circle class="sdot ${cls}" cx="${xR}" cy="${yS(it.b)}" r="3"/>`;
      const name = it.name.length > maxName ? it.name.slice(0, maxName - 1) + '…' : it.name;
      const fa = fmtNum(it.a, Number.isInteger(it.a) ? 0 : 1), fb = fmtNum(it.b, Number.isInteger(it.b) ? 0 : 1);
      s += `<text class="slab ${cls}" x="${xL - 8}" y="${la[i] + 3.5}" text-anchor="end"><tspan class="sval">${fa}</tspan>  ${esc(name)}</text>`;
      s += `<text class="slab ${cls}" x="${xR + 8}" y="${lb[i] + 3.5}"><tspan class="sval">${fb}</tspan>${it.changed ? `<tspan class="sdelta ${cls}"> ${fmtDelta(it.delta, 'pct', 1, false)}</tspan>` : ''}</text>`;
    });
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- горизонтальные бары с маркером прошлого периода */
  function hbars(o) {
    const items = o.items; const n = items.length;
    const W = o.width || 420, rowH = o.rowH || 22, labW = o.labelWidth || 150, valW = o.valueWidth || 52;
    const H = n * rowH + 6;
    const max = o.max || Math.max(...items.map(it => Math.max(it.value, it.prev == null ? 0 : it.prev))) * 1.05;
    const x0 = labW + 6, x1 = W - valW;
    const xS = v => x0 + (x1 - x0) * (v / max);
    const fmt = o.fmt || 'int', d = o.decimals == null ? 0 : o.decimals;
    const maxName = Math.floor(labW / 5.6);
    let s = svgOpen(W, H, 'hbars');
    items.forEach((it, i) => {
      const y = 3 + i * rowH, bh = Math.min(14, rowH - 8);
      const cls = 'bar ' + (it.flag ? 'flag-' + it.flag : (it.muted ? 'muted' : 'norm'));
      const tip = `${it.name}: ${fmtVal(it.value, fmt, d)}${it.suffix ? it.suffix : ''}${it.prev != null ? ` (${o.prevLabel || 'ранее'}: ${fmtVal(it.prev, fmt, d)})` : ''}${it.note ? ' · ' + it.note : ''}`;
      s += `<text class="cat" x="${labW}" y="${y + bh / 2 + 4}" text-anchor="end">${esc(it.name.length > maxName ? it.name.slice(0, maxName - 1) + '…' : it.name)}</text>`;
      s += `<rect class="${cls}" x="${x0}" y="${y}" width="${Math.max(1, xS(it.value) - x0)}" height="${bh}" rx="2"${tipAttr(tip)}/>`;
      if (it.prev != null) s += `<line class="prev" x1="${xS(it.prev)}" y1="${y - 2}" x2="${xS(it.prev)}" y2="${y + bh + 2}"/>`;
      s += `<text class="val" x="${x1 + 6}" y="${y + bh / 2 + 4}">${fmtVal(it.value, fmt, d)}${it.suffix ? esc(it.suffix) : ''}</text>`;
    });
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- стек колонок по месяцам */
  function stackedColumns(o) {
    const W = o.width || 620, H = o.height || 200, padR = 12, padT = 18, padB = 22;
    const months = o.months, series = o.series; const n = months.length;
    const totals = months.map((_, i) => series.reduce((a, sr) => a + (sr.values[i] || 0), 0));
    const t = ticks(0, Math.max(...totals) * 1.05, 3);
    const padL = tickWidth(t, 'int');
    const yS = v => padT + (H - padT - padB) * (1 - v / t.hi);
    const slot = (W - padL - padR) / n, bw = Math.min(22, slot * 0.6);
    const xS = i => padL + slot * i + (slot - bw) / 2;
    let s = svgOpen(W, H, 'stack');
    t.out.forEach(v => { s += `<line class="grid" x1="${padL}" y1="${yS(v)}" x2="${W - padR}" y2="${yS(v)}"/><text class="tick" x="${padL - 4}" y="${yS(v) + 3}" text-anchor="end">${fmtTick(v, 'int')}</text>`; });
    const every = o.every || (W < 400 ? 3 : 1);
    months.forEach((m, i) => {
      let acc = 0;
      const tip = [m, ...series.map(sr => `${sr.name}: ${fmtInt(sr.values[i])}`), `всего: ${fmtInt(totals[i])}`].join(' · ');
      series.forEach((sr, k) => {
        const v = sr.values[i] || 0; const y1 = yS(acc + v), y0 = yS(acc);
        const gap = k === 0 ? 0 : 2;
        s += `<rect class="seg s${k}" x="${xS(i)}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1 - gap)}"${tipAttr(tip)}/>`;
        acc += v;
      });
      if (i === n - 1 || i === 0) s += `<text class="val" x="${xS(i) + bw / 2}" y="${yS(totals[i]) - 4}" text-anchor="middle">${fmtInt(totals[i])}</text>`;
      if (i % every === 0 || i === n - 1) s += `<text class="tick" x="${xS(i) + bw / 2}" y="${H - 6}" text-anchor="middle">${esc(m)}</text>`;
    });
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- несколько линий по месяцам */
  function lines(o) {
    const W = o.width || 620, H = o.height || 180, padR = 44, padT = 14, padB = 22;
    const x = o.x, series = o.series, n = x.length;
    const fmt = o.fmt || 'int', d = o.decimals == null ? 0 : o.decimals;
    const all = series.flatMap(sr => sr.values).filter(v => v != null);
    let min = Math.min(...all), max = Math.max(...all); const pad = (max - min) * 0.15 || 1; min -= pad; max += pad;
    if (Math.min(...all) >= 0 && min < 0) min = 0;
    if (o.zero) min = 0;
    const t = ticks(min, max, 3);
    const padL = tickWidth(t, fmt);
    const yS = v => padT + (H - padT - padB) * (1 - (v - t.lo) / (t.hi - t.lo));
    const xS = i => padL + (W - padL - padR) * (i / (n - 1));
    let s = svgOpen(W, H, 'lines');
    t.out.forEach(v => { s += `<line class="grid" x1="${padL}" y1="${yS(v)}" x2="${W - padR}" y2="${yS(v)}"/><text class="tick" x="${padL - 4}" y="${yS(v) + 3}" text-anchor="end">${fmtTick(v, fmt)}</text>`; });
    x.forEach((m, i) => { if (i % (o.every || 2) === 0 || i === n - 1) s += `<text class="tick" x="${xS(i)}" y="${H - 6}" text-anchor="middle">${esc(m)}</text>`; });
    const ends = series.map(sr => sr.values[n - 1]).map(v => v == null ? null : yS(v));
    const endY = spread(ends.map(v => v == null ? -999 : v), 12, padT, H - padB);
    series.forEach((sr, k) => {
      const pts = sr.values.map((v, i) => v == null ? null : `${xS(i)},${yS(v)}`).filter(Boolean).join(' ');
      s += `<polyline class="ln s${k} ${sr.cls || ''}" points="${pts}"${sr.dash ? ` stroke-dasharray="${sr.dash}"` : ''}/>`;
      const last = sr.values[n - 1];
      if (last != null) { s += `<circle class="dot-ring" cx="${xS(n - 1)}" cy="${yS(last)}" r="5"/><circle class="dot s${k}" cx="${xS(n - 1)}" cy="${yS(last)}" r="3.5"/><text class="end-label" x="${xS(n - 1) + 8}" y="${endY[k] + 3.5}">${fmtVal(last, fmt, d)}</text>`; }
    });
    const cw = (W - padL - padR) / (n - 1);
    x.forEach((m, i) => { const tip = [m, ...series.map(sr => `${sr.name}: ${sr.values[i] == null ? '—' : fmtVal(sr.values[i], fmt, d)}`)].join(' · '); s += `<rect class="hit" x="${xS(i) - cw / 2}" y="0" width="${cw}" height="${H}"${tipAttr(tip)}/>`; });
    s += '</svg>';
    return s;
  }

  /* ---------------------------------------------------------------- легенда */
  function legend(items) {
    return `<div class="legend">${items.map(it => `<span class="lg"><i class="key ${it.cls}"></i>${esc(it.name)}</span>`).join('')}</div>`;
  }

  /* ---------------------------------------------------------------- тултип (делегирование) */
  function initTips() {
    const tip = document.getElementById('tip'); if (!tip) return;
    let cur = null;
    document.addEventListener('pointermove', e => {
      const el = e.target.closest && e.target.closest('[data-tip]');
      if (!el) { if (cur) { tip.hidden = true; cur = null; } return; }
      if (el !== cur) { cur = el; tip.textContent = el.getAttribute('data-tip'); tip.hidden = false; }
      const x = e.clientX + 14, y = e.clientY + 14;
      const r = tip.getBoundingClientRect();
      tip.style.left = Math.min(x, window.innerWidth - r.width - 8) + 'px';
      tip.style.top = Math.min(y, window.innerHeight - r.height - 8) + 'px';
    });
    document.addEventListener('pointerleave', () => { tip.hidden = true; cur = null; });
  }

  return { fmtInt, fmtNum, fmtPct, fmtVal, fmtDelta, esc, MONTHS, yoyLine, spark, bridge, slopeChart, hbars, stackedColumns, lines, legend, initTips, ticks, spread };
})();
</script>
<script>/* app.js — рендер страниц Exec Board из window.DATA */
(() => {
  const D = window.DATA, M = D.meta;
  const { fmtInt, fmtNum, fmtPct, fmtVal, fmtDelta, esc } = CH;

  const PAGES = [
    { id: 'summary', no: '01', nav: 'Главное', eyebrow: 'Главное за месяц' },
    { id: 'panel', no: '02', nav: 'Панель управления', eyebrow: 'Панель управления · 15 метрик здоровья организации' },
    { id: 'headcount', no: '03', nav: 'Численность', eyebrow: 'Численность и лимит роста', sep: true },
    { id: 'hiring', no: '04', nav: 'Найм', eyebrow: 'Найм, вакансии и замены' },
    { id: 'flow', no: '05', nav: 'Движение людей', eyebrow: 'Движение людей и talent actions' },
    { id: 'shifts', no: '06', nav: 'Сдвиги', eyebrow: 'Сдвиги в структуре · слоп-диаграммы' },
    { id: 'professions', no: '07', nav: 'Профессии', eyebrow: 'Здоровье структуры по профессиям' },
    { id: 'management', no: '08', nav: 'Управляемость', eyebrow: 'Оргструктура и управляемость' },
    { id: 'productivity', no: '09', nav: 'ИИ и нагрузка', eyebrow: 'Продуктивность, ИИ, нагрузка, риски' },
    { id: 'crossdata', no: '10', nav: 'CrossData', eyebrow: 'Инфраструктура решений · минутка промо' },
    { id: 'appendix', no: '11', nav: 'Приложение', eyebrow: 'Приложение', sep: true },
  ];
  const pageNo = id => (PAGES.find(p => p.id === id) || {}).no || '';
  const STATUS_WORD = { red: 'Требует решения', amber: 'Наблюдаем', ok: 'По плану', none: 'Без изменений' };

  /* ---------------------------------------------------------------- общие элементы */
  const chip = (st, text) => `<span class="chip ${st}">${esc(text)}</span>`;
  const deltaCls = (d, good) => {
    if (!d || good === 'none' || good === 'range') return 'neutral';
    if (good === 'up') return d > 0 ? 'up-good' : 'down-bad';

  };
  const kpi = k => `<div class="kpi tone-${k.status && k.status !== 'none' ? k.status : 'none'}"><div class="l"><span>${esc(k.label)}</span>${k.status && k.status !== 'none' ? `<i class="dot ${k.status}" title="${STATUS_WORD[k.status]}"></i>` : ''}</div><div class="v">${esc(k.value)}</div><div class="s">${esc(k.sub || '')}${k.prev ? ` · ${esc(k.prev)}` : ''}</div></div>`;
  const kpis = (list, cls = '') => `<div class="kpis ${cls}">${list.map(kpi).join('')}</div>`;
  const ask = qs => `<div class="ask">${qs.map(q => `<div class="ask-item"><span class="q">?</span><div>${esc(q.q)}<span class="to">${esc(q.to)}${q.page ? ` · стр. ${pageNo(q.page)}` : ''}</span></div></div>`).join('')}</div>`;
  const linksBlock = links => links && links.length ? `<div><div class="eyebrow" style="margin-bottom:6px">Детали — в отчётах</div><div class="links">${links.map(l => `<a href="${esc(l.href)}">↗ ${esc(l.label)}</a>`).join('')}</div></div>` : '';
  const rail = (comment, questions, links, extra = '') => `<aside class="rail">
    <div><div class="tag" style="margin-bottom:6px"><i></i>Комментарий · черновик ИИ, проверен аналитиком</div><p class="comment">${esc(comment)}</p></div>
    ${extra}
    ${questions && questions.length ? `<div><div class="eyebrow" style="margin-bottom:8px">О чём спросить</div>${ask(questions)}</div>` : ''}
    ${linksBlock(links)}
  </aside>`;
  const pageHead = (p, title, sub) => `<header class="page-head"><div><div class="eyebrow">${p.no} · ${esc(p.eyebrow)}</div><h1 class="page-title">${esc(title)}${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</h1></div><div class="page-meta">${esc(M.period_label)} · выпуск ${esc(M.issue_no)}<br>данные на ${esc(M.as_of)}</div></header>`;
  const pageFoot = (p, links, source) => `<footer class="page-foot">${source ? `<span>Источник: ${esc(source)}</span>` : ''}${(links || []).map(l => `<a class="lk" href="${esc(l.href)}">${esc(l.label)}</a>`).join('')}<span class="pn">${p.no} / ${PAGES.length}</span></footer>`;
  const card = (title, body, sub = '', cls = '') => `<div class="card ${cls}"><div class="card-title">${title}</div>${sub ? `<div class="card-sub">${esc(sub)}</div>` : ''}${body}</div>`;
  const heat = (v, lo, hi) => { const t = Math.max(0, Math.min(1, (v - lo) / ((hi - lo) || 1))); return 'h' + (1 + Math.round(t * 4)); };
  const sectionTitle = (t, sub) => `<div><h2 style="font-size:15px;font-weight:600">${esc(t)}</h2>${sub ? `<div class="card-sub">${esc(sub)}</div>` : ''}</div>`;

  /* ---------------------------------------------------------------- 01 главное */
  function renderSummary(p) {
    const S = D.summary;
    const groups = [['red', 'Требует решения'], ['amber', 'Наблюдаем'], ['ok', 'Идёт по плану']];
    const sig = groups.map(([lv, name]) => {
      const rows = S.signals.filter(s => s.level === lv);
      if (!rows.length) return '';
      return `<div class="sig-group">${name} · ${rows.length}</div>` + rows.map(s => `<a class="sig" href="#p-${s.page}"><i class="dot ${lv}"></i><div><span class="t">${esc(s.title)}.</span> <span class="x">${esc(s.text)}</span>${s.owner ? `<span class="x"> — ${esc(s.owner)}</span>` : ''}</div><span class="pg">стр. ${pageNo(s.page)}</span></a>`).join('');
    }).join('');
    return `${pageHead(p, S.headline, `Ежемесячный обзор для исполнительного директора · ${M.company} · читать 10 минут: страницы 01–02 — картина месяца, 03–10 — разделы по запросу`)}
      <div class="rail-layout" style="grid-template-columns: minmax(0,1fr) 420px">
        <div class="stack">
          <div class="summary-text">${S.paragraphs.map(t => `<p>${esc(t)}</p>`).join('')}</div>
          <div class="grid g2">
            ${card('Что изменилось в структуре', `<ul class="list arrows">${S.changes.map(c => `<li><a href="#p-${c.page}">${esc(c.text)}</a></li>`).join('')}</ul>`, 'сдвиги долей ≥ 2 п.п. с начала года · подробно на стр. 06')}
            ${card('Стабильно — можно не читать', `<ul class="list">${S.stable.map(c => `<li>${esc(c)}</li>`).join('')}</ul>`, 'срезы без значимых изменений')}
          </div>
          <div class="grid g2">
            ${card('Пять вопросов месяца', ask(S.questions), 'зацепки для разговоров с владельцами процессов')}
            ${card('Решения, которые ждут', `<div class="stack" style="gap:8px">${S.decisions.map(d => `<div class="decision"><span>${esc(d.text)}</span><span class="own">${esc(d.owner)}</span></div>`).join('')}</div>`, 'что нужно решить до следующего выпуска')}
          </div>
        </div>
        <div class="panel"><div class="card-title">Сигналы месяца</div><div class="signals">${sig}</div></div>
      </div>
      ${pageFoot(p, [], 'все разделы отчёта; цифры — вымышленные')}`;
  }

  /* ---------------------------------------------------------------- 02 панель */
  function tile(t) {
    const wide = t.id === 'hq_hc';
    const s = t.series;
    const chart = CH.yoyLine({ width: wide ? 640 : 300, height: wide ? 170 : 112, y2025: s.y2025, y2026: s.y2026, plan: s.plan, forecast: s.forecast, limit: t.limit, target: (s.plan ? null : t.target), fmt: t.fmt, decimals: t.decimals, limitLabel: 'лимит', yMin: t.axis ? t.axis[0] : null, yMax: t.axis ? t.axis[1] : null });
    const deltas = [`<span>м/м <b class="${deltaCls(t.delta_mom, t.good)}">${fmtDelta(t.delta_mom, t.fmt, t.decimals)}</b></span>`, `<span>г/г <b class="${deltaCls(t.delta_yoy, t.good)}">${fmtDelta(t.delta_yoy, t.fmt, t.decimals)}</b></span>`];
    if (t.delta_plan != null) deltas.push(`<span>к плану <b class="${deltaCls(t.delta_plan, t.good === 'range' ? 'none' : t.good)}">${fmtDelta(t.delta_plan, t.fmt, t.decimals)}</b></span>`);
    else if (t.target != null) deltas.push(`<span>цель <b>${fmtVal(t.target, t.fmt, 0)}</b></span>`);
    return `<article class="tile st-${t.status} ${wide ? 'wide' : ''}" id="t-${t.id}">
      <div class="tile-head"><span class="eyebrow">${esc(t.group)}</span>${t.status !== 'none' ? chip(t.status, STATUS_WORD[t.status]) : ''}</div>
      <h3 class="tile-title">${esc(t.title)}</h3>
      <div class="tile-value"><span class="big">${fmtVal(t.value, t.fmt, t.decimals)}</span><span class="unit">${[t.fmt === 'pct' ? '' : esc(t.unit), t.compare_label ? esc(t.compare_label) : ''].filter(Boolean).join(' · ')}</span></div>
      <div class="tile-deltas">${deltas.join('')}</div>
      <div class="tile-chart">${chart}</div>
      <div class="tile-status">${esc(t.status_text)}</div>
      <div class="tile-secondary">${t.secondary.map(x => `<span>${esc(x.label)} <b>${esc(x.value)}</b></span>`).join('')}</div>
      ${t.question ? `<div class="tile-ask"><span class="q">?</span><div>${esc(t.question)}<span class="to">${esc(t.ask)}</span></div></div>` : ''}
      <div class="tile-owner">Владелец: ${esc(t.owner)} · стр. ${pageNo(t.page)}</div>
    </article>`;
  }
  function renderPanel(p) {
    const T = D.control_panel;
    const counts = { red: 0, amber: 0, ok: 0 };
    T.forEach(t => { if (counts[t.status] != null) counts[t.status]++; });
    return `${pageHead(p, `${counts.red} метрики требуют решения, ${counts.amber} — наблюдаем, ${counts.ok} — по плану`, 'Каждая плитка — одна и та же форма (по образцу Amazon WBR): значение, изменения к прошлому месяцу и году, линия 2026 против 2025, план или цель, статус, владелец и вопрос. Читайте плитки с красной кромкой первыми.')}
      <div class="howto">
        <span class="k"><i class="key"></i>2026</span><span class="k"><i class="key prior"></i>2025</span><span class="k"><i class="key plan"></i>план / цель</span><span class="k"><i class="key limit"></i>лимит</span><span class="k"><i class="key fca"></i>прогноз по темпу</span><span class="k"><i class="key fc"></i>прогноз по воронке</span>
        <span class="k">${chip('red', 'Требует решения')}</span><span class="k">${chip('amber', 'Наблюдаем')}</span><span class="k">${chip('ok', 'По плану')}</span>
        <span class="k print-hint">наведите курсор на график, чтобы увидеть значения по месяцам</span>
      </div>
      <div class="tiles">${T.map(tile).join('')}</div>
      ${pageFoot(p, [{ label: 'Словарь метрик — стр. 11', href: '#p-appendix' }], 'HRS, DRAFT, СУП, логи ИИ-платформы, CrossData')}`;
  }

  /* ---------------------------------------------------------------- 03 численность */
  function renderHeadcount(p) {
    const H = D.headcount, s = H.series;
    const traj = CH.yoyLine({ width: 680, height: 230, y2025: s.y2025, y2026: s.y2026, plan: s.plan, forecast: { runrate: s.forecast_runrate, pipeline: s.forecast_pipeline }, limit: H.limit, fmt: 'int', decimals: 0 });
    const scen = `<div class="stack" style="gap:10px">${H.forecast.map(f => `<div class="decision" style="grid-template-columns:1fr auto auto;align-items:center"><span>${esc(f.label)}</span><b class="num">${fmtInt(f.dec)}</b>${f.status === 'none' ? chip('none', 'лимит') : chip(f.status, (f.vs_limit > 0 ? '+' : '−') + fmtInt(Math.abs(f.vs_limit)) + ' к лимиту')}</div>`).join('')}</div>`;
    const segRows = H.segments.map(r => `<tr class="${r.name.startsWith('Итого') ? 'total' : ''}"><td class="name">${esc(r.name)}${r.note ? `<span class="sub">${r.status !== 'none' ? `<i class="dot ${r.status}"></i> ` : ''}${esc(r.note)}</span>` : ''}</td><td>${fmtInt(r.hc)}</td><td>${fmtDelta(r.hc - r.dec25, 'int')}</td><td>${fmtInt(r.plan_dec26)}</td><td class="${r.status === 'red' ? 'up-bad' : ''}">${fmtInt(r.forecast_dec26)}</td><td>${fmtInt(r.vacancies)}</td><td>${r.attrition == null ? '—' : fmtPct(r.attrition, 1)}</td></tr>`).join('');
    const splitRows = H.hq_split.map(r => `<tr><td class="name">${esc(r.name)}${r.flag ? `<span class="sub"><i class="dot ${r.flag}"></i> отток и уход руководителей</span>` : ''}</td><td>${fmtInt(r.hc)}</td><td>${fmtDelta(r.hc - r.dec25, 'int')}</td><td>${fmtDelta(r.plan_dec26 - r.dec25, 'int')}</td><td>${fmtInt(r.vacancies)}</td><td class="${heat(r.attrition, 10, 15)}">${fmtPct(r.attrition, 1)}</td><td>${fmtPct(r.juniors, 1)}</td></tr>`).join('');
    const side = H.side_stats.map(x => kpi({ label: x.label, value: fmtInt(x.value), sub: `${x.prev_label}: ${fmtInt(x.prev)} (${fmtDelta(x.value - x.prev, 'int')})${x.note ? ' · ' + x.note : ''}`, status: x.flag || 'none' })).join('');
    return `${pageHead(p, 'HQ идёт по плану, но воронка найма выведет за лимит на ~120 человек к декабрю', 'Лимит 23 500 достижим только при замедлении найма в IV квартале')}
      <div class="rail-layout">${rail(H.comment, H.questions, H.links)}
        <div class="stack">
          <div class="grid g32">
            ${card('Траектория HQ к лимиту 23 500', traj + CH.legend([{ name: '2026', cls: 'l0' }, { name: '2025', cls: 'l2' }, { name: 'план-траектория', cls: 'plan' }, { name: 'лимит', cls: 'limit' }, { name: 'прогноз по темпу', cls: 'fca' }, { name: 'прогноз по воронке', cls: 'fc' }]), 'управленческая численность, чел.; пунктир справа — два сценария на сен–дек')}
            ${card('Сценарии на 31 декабря', scen + `<p class="note" style="margin-top:6px">Сценарий «воронка» предполагает обычную конверсию: 100% принятых офферов и 60% вакансий в работе закрываются до конца года.</p>`)}
          </div>
          <div class="grid g2">
            ${card(H.bridge_ytd.title, CH.bridge({ width: 470, height: 250, start: H.bridge_ytd.start, end: H.bridge_ytd.end, startLabel: H.bridge_ytd.start_label, endLabel: H.bridge_ytd.end_label, steps: H.bridge_ytd.steps }), 'мост численности HQ, чел.; жёлтый столбец — переводы из HQ, 28 из 40 за июль-август')}
            ${card(H.bridge_forecast.title, CH.bridge({ width: 470, height: 250, start: H.bridge_forecast.start, end: H.bridge_forecast.end, startLabel: H.bridge_forecast.start_label, endLabel: H.bridge_forecast.end_label, steps: H.bridge_forecast.steps, limit: H.bridge_forecast.limit }), 'что будет, если закрыть офферы и вакансии в срок')}
          </div>
          <div class="stack">
            ${card('HQ, Support, Line: где мы относительно плана', `<div class="tbl-wrap"><table class="tbl compact"><thead><tr><th>Сегмент</th><th>Числ.</th><th>Δ YTD</th><th>План<br>дек 26</th><th>Прогноз<br>дек 26</th><th>Вакансии</th><th>Текучесть</th></tr></thead><tbody>${segRows}</tbody></table></div>`, 'управленческая численность, чел.')}
            ${card('Внутри HQ: кто растёт', `<div class="tbl-wrap"><table class="tbl compact"><thead><tr><th>Сегмент</th><th>Числ.</th><th>Δ YTD</th><th>План<br>на год</th><th>Вакансии</th><th>Текучесть</th><th>Джуны</th></tr></thead><tbody>${splitRows}</tbody></table></div>`, 'заливка «Текучесть» — чем темнее, тем выше')}
          </div>
          ${sectionTitle('Периметр вокруг HQ', 'численности, которые не входят в лимит, но влияют на него')}
          <div class="kpis" style="grid-template-columns:repeat(6,minmax(0,1fr))">${side}</div>
        </div>
      </div>
      ${pageFoot(p, H.links, 'HRS, план численности 2026')}`;
  }

  /* ---------------------------------------------------------------- 04 найм */
  function renderHiring(p) {
    const Hh = D.hiring;
    const stack = CH.stackedColumns({ width: 620, height: 210, months: Hh.months, series: [{ name: 'новые позиции', values: Hh.vacancies_stack.new }, { name: 'замены', values: Hh.vacancies_stack.replacement }, { name: 'на холде', values: Hh.vacancies_stack.hold }] });
    const oc = CH.lines({ width: 620, height: 210, x: Hh.months, series: [{ name: 'закрыто', values: Hh.closed }, { name: 'открыто', values: Hh.opened }], fmt: 'int', every: 2 });
    const ttf = CH.lines({ width: 300, height: 130, x: Hh.months, series: [{ name: 'дней', values: Hh.ttf }], fmt: 'int', every: 3 });
    const dec = CH.lines({ width: 300, height: 130, x: Hh.months, series: [{ name: 'отказы', values: Hh.decline }], fmt: 'pct', decimals: 0, every: 3 });
    const R = Hh.replacement_status;
    const rep = CH.hbars({ width: 440, items: R.items.map(it => ({ name: it.name, value: it.share, flag: it.flag, suffix: `% · ${fmtInt(it.count)}`, note: '' })), fmt: 'int', labelWidth: 215, valueWidth: 60, max: 50 });
    const I = Hh.interns;
    return `${pageHead(p, 'Найм на прежней мощности, но воронка стареет и дорожает', '≈300 закрытий в месяц; 27% вакансий старше 90 дней; отказы от офферов 14%')}
      ${kpis(Hh.kpis)}
      <div class="rail-layout">${rail(Hh.comment, Hh.questions, Hh.links)}
        <div class="stack">
          <div class="grid g2">
            ${card('Вакансии HQ в работе: новые, замены, холд', stack + CH.legend([{ name: 'новые позиции', cls: 's0 box' }, { name: 'замены', cls: 's1 box' }, { name: 'на холде', cls: 's2 box' }]), 'на конец месяца, шт.')}
            ${card('Открыто и закрыто за месяц', oc + CH.legend([{ name: 'закрыто', cls: 'l0' }, { name: 'открыто', cls: 'l1' }]), 'HQ, шт.')}
          </div>
          <div class="grid g3">
            ${card('Срок закрытия, медиана', ttf, 'дней от заявки до принятого оффера')}
            ${card('Отказы от офферов', dec, '% отклонённых офферов за месяц')}
            ${card('Стажёры', `<table class="tbl compact"><tbody><tr><td class="name">Активные стажёры</td><td><b>${fmtInt(I.active)}</b></td></tr><tr><td class="name">Активные заявки на стажёров</td><td><b>${fmtInt(I.requests_active)}</b></td></tr><tr><td class="name">Переведено в штат YTD <span class="sub">2025 YTD: ${I.converted_prev_ytd}</span></td><td><b class="down-good">${fmtInt(I.converted_ytd)}</b></td></tr></tbody></table>`, 'вход в компанию через стажировки')}
          </div>
          <div class="grid g2">
            ${card(R.title, rep + `<p class="note">${esc(R.comment)}</p>`, `${fmtInt(R.total)} вакансий на замену, доля и количество`)}
            ${card('Замены с тем же профилем в том же юните', `<div class="grid g2" style="gap:10px">${kpi({ label: 'Закрыты в том же юните, тот же профиль', value: Hh.same_profile.share_same_unit + '%', sub: 'грейд-стрим-специализация совпадают' })}${kpi({ label: 'Закрыты в другом юните или с другим профилем', value: Hh.same_profile.share_other_unit + '%', sub: 'переток через «замены»', status: 'amber' })}</div><p class="note">${esc(Hh.same_profile.comment)}</p><p class="note">Сдвиги структуры найма (регионы, seniority, каналы, причины заявок) — на стр. ${pageNo('shifts')}.</p>`)}
          </div>
        </div>
      </div>
      ${pageFoot(p, Hh.links, 'HRS, TRS')}`;
  }

  /* ---------------------------------------------------------------- 05 движение людей */
  function renderFlow(p) {
    const F = D.flow, a = F.attrition_series;
    const attr = CH.yoyLine({ width: 300, height: 150, y2025: a.y2025, y2026: a.y2026, fmt: 'pct', decimals: 1 });
    const regr = CH.yoyLine({ width: 300, height: 150, y2025: a.regr2025, y2026: a.regr2026, fmt: 'pct', decimals: 1 });
    const nonregr = F.leavers.map((v, i) => v - F.leavers_regrettable[i]);
    const leav = CH.stackedColumns({ width: 300, height: 150, months: F.months, series: [{ name: 'regrettable', values: F.leavers_regrettable }, { name: 'non-regrettable', values: nonregr }] });
    const S = F.attrition_by_stream;
    const rows = S.rows.map(r => `<tr><td class="name">${esc(r.name)}</td><td>${fmtInt(r.left)}</td><td class="${heat(r.rate, 9, 16)}">${fmtPct(r.rate, 1)}</td><td class="${heat(r.regr, 3.5, 8.5)}">${fmtPct(r.regr, 1)}</td><td>${fmtPct(r.nonregr, 1)}</td><td class="${r.delta > 1 ? 'up-bad' : r.delta < -1 ? 'down-good' : ''}">${fmtDelta(r.delta, 'pct', 1, false)}</td><td class="note">${r.flag ? chip(r.flag, r.flag === 'red' ? 'ускорение' : 'выше среднего') : ''}</td></tr>`).join('');
    return `${pageHead(p, 'Текучесть снижается, но уходят руководители', 'HQ 12,1% против 13,4% год назад; руководители 9,8% против 7,1% — ускорение шесть месяцев подряд')}
      ${kpis(F.kpis, 'k4')}
      <div class="rail-layout">${rail(F.comment, F.questions, F.links)}
        <div class="stack">
          <div class="grid g3">
            ${card('Текучесть HQ, годовая: 2026 против 2025', attr, 'скользящие 12 месяцев, %')}
            ${card('Regrettable-текучесть HQ', regr, 'скользящие 12 месяцев, %')}
            ${card('Ушедшие за месяц: regrettable и non-regrettable', leav + CH.legend([{ name: 'regrettable', cls: 's0 box' }, { name: 'non-regrettable', cls: 's1 box' }]), 'HQ, чел.')}
          </div>
          ${sectionTitle('Talent actions', 'ротации, рост, refresh — есть ли ускорение')}
          ${kpis(F.talent_actions.map(t => ({ label: t.label, value: typeof t.value === 'number' ? fmtInt(t.value) : t.value, sub: t.sub, prev: t.prev, status: t.status })), 'k3')}
          ${card(S.title, `<div class="tbl-wrap"><table class="tbl"><thead><tr>${S.columns.map(c => `<th>${esc(c)}</th>`).join('')}<th></th></tr></thead><tbody>${rows}</tbody></table></div>`, 'заливка — чем темнее, тем выше текучесть; Δ — к тому же периоду 2025')}
          <p class="note">Причины ухода, seniority, регионы, стаж — слоп-диаграммы на стр. ${pageNo('shifts')}.</p>
        </div>
      </div>
      ${pageFoot(p, F.links, 'HRS, exit-интервью, DRAFT')}`;
  }

  /* ---------------------------------------------------------------- 06 сдвиги */
  function slopeCard(s, compact) {
    return `<div class="slope-card" id="s-${s.id}"><div class="card-title"><span>${esc(s.title)}</span><span class="prio">${s.changed ? 'приоритет ' + s.priority : 'стабильно'}</span></div><div class="card-sub">${esc(s.subtitle)} · ${esc(s.source)}</div>${CH.slopeChart({ width: compact ? 380 : 440, compact, items: s.items, left: s.left_label, right: s.right_label, unit: s.unit })}<div class="slope-comment">${esc(s.comment)}</div></div>`;
  }
  function renderShifts(p) {
    const changed = D.slopes.filter(s => s.changed).sort((a, b) => a.priority - b.priority);
    const main = changed.filter(s => s.priority <= 2), rest = changed.filter(s => s.priority > 2);
    const stable = D.slopes.filter(s => !s.changed);
    const stab = D.stability.map(x => `<div class="stable-row"><span>${esc(x.name)}</span><span class="v">${esc(x.value)}</span>${CH.spark(x.spark)}</div>`).join('');
    return `${pageHead(p, 'Что сдвинулось внутри привычных цифр', 'Слоп-диаграммы: доля категории на начало года и сейчас. Показаны только срезы, где хотя бы одна доля изменилась на 2 п.п. и больше; синие линии — изменившиеся категории. Порядок — по важности сдвига.')}
      <div class="howto"><span class="k"><i class="key"></i>изменилась ≥ 2 п.п.</span><span class="k"><i class="key prior"></i>стабильна</span><span class="print-hint">наведите курсор на линию — значения и комментарий</span></div>
      ${sectionTitle('Главные сдвиги месяца', `${main.length} срезов с самыми важными изменениями — стоит прочитать`)}
      <div class="slopes">${main.map(s => slopeCard(s, false)).join('')}</div>
      ${sectionTitle('Остальные сдвиги', `${rest.length} срезов: изменения есть, но они ожидаемые или небольшие`)}
      <div class="slopes three">${rest.map(s => slopeCard(s, true)).join('')}</div>
      <div class="panel">
        <div class="card-title">Стабильно — здесь ничего не произошло</div>
        <div class="card-sub">срезы без значимых изменений; показаны сжато, чтобы не занимать внимание</div>
        <div class="slopes three" style="margin-top:6px">${stable.map(s => slopeCard(s, true)).join('')}</div>
        <div class="stable-list" style="margin-top:8px">${stab}</div>
      </div>
      ${pageFoot(p, [], 'HRS, exit-интервью, СУП, логи ИИ-платформы, цифровые следы')}`;
  }

  /* ---------------------------------------------------------------- 07 профессии */
  function renderProfessions(p) {
    const P = D.professions;
    const rows = P.rows.map(r => `<tr><td class="name">${esc(r.name)}</td><td>${fmtInt(r.hc)}</td><td>${CH.spark(r.spark, { width: 70, height: 18 })}</td><td>${fmtDelta(r.delta_ytd, 'int')}</td><td>${fmtDelta(r.delta_mom, 'int')}</td><td class="${heat(r.attrition, 9, 16)}">${fmtPct(r.attrition, 1)}</td><td class="${heat(r.regrettable, 3.5, 8.5)}">${fmtPct(r.regrettable, 1)}</td><td>${fmtInt(r.vac_new)} / ${fmtInt(r.vac_repl)}</td><td>${fmtPct(r.understaff, 1)}</td><td>${fmtPct(r.juniors, 0)}</td><td class="${heat(r.overdue, 10, 40)}">${r.overdue}%</td><td>${r.ai_wau}%</td><td class="note">${r.flag ? chip(r.flag, r.note) : esc(r.note)}</td></tr>`).join('');
    const ratios = P.ratios.map(r => `<div class="card"><div class="card-title">${esc(r.name)}</div><div class="ratio"><span class="v">${fmtNum(r.value, r.value < 1 ? 2 : 1)}</span><span class="chip ${r.status}">цель ${esc(r.target)}</span><span class="t">дек 25: ${fmtNum(r.dec25, r.dec25 < 1 ? 2 : 1)}</span></div>${CH.spark(r.spark, { width: 120, height: 22 })}</div>`).join('');
    return `${pageHead(p, 'Пропорции профессий стабильны; внимания требуют ML и продакты', 'Скоркарта по профессиям HQ: обеспеченность ресурсами, рост, отток, вакансии')}
      ${card('Скоркарта по профессиям', `<div class="tbl-wrap"><table class="tbl compact"><thead><tr><th>Профессия</th><th>Числ.</th><th>13 мес.</th><th>Δ YTD</th><th>Δ м/м</th><th>Текучесть<br>12 мес.</th><th>Regret.</th><th>Вакансии<br>нов. / зам.</th><th>Недо-<br>укомпл.</th><th>Джуны</th><th>Вак.<br>&gt; 90 дн.</th><th>ИИ<br>WAU</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`, 'заливка — чем темнее, тем выше значение (текучесть, regrettable, просроченные вакансии); чёрная риска в спарклайне — конец месяца')}
      <div class="rail-layout">${rail(P.comment, P.questions, P.links)}
        <div class="stack">
          ${sectionTitle('Соотношения профессий', 'структурные пропорции против целевых коридоров')}
          <div class="grid g3">${ratios}</div>
        </div>
      </div>
      ${pageFoot(p, P.links, 'HRS, логи ИИ-платформы')}`;
  }

  /* ---------------------------------------------------------------- 08 управляемость */
  function renderManagement(p) {
    const G = D.management;
    const span = CH.hbars({ width: 420, items: G.span_hist.bins.map((b, i) => ({ name: b + ' чел.', value: G.span_hist.now[i], prev: G.span_hist.dec25[i], flag: i < 2 ? 'amber' : '' })), fmt: 'int', labelWidth: 90, prevLabel: 'дек 25' });
    const layers = CH.hbars({ width: 420, items: G.layers.levels.map((l, i) => ({ name: 'уровень ' + l, value: G.layers.share[i], prev: G.layers.share_dec25[i] })), fmt: 'pct', decimals: 1, labelWidth: 90, prevLabel: 'дек 25' });
    const rows = G.segments.map(r => `<tr><td class="name">${esc(r.name)}</td><td>${fmtInt(r.managers)}</td><td>${r.span_med}</td><td class="${heat(r.quasi, 12, 35)}">${r.quasi}%</td><td>${r.overloaded}%</td><td class="${heat(r.mgr_attrition, 6, 16)}">${fmtPct(r.mgr_attrition, 1)}</td><td>${fmtInt(r.new_mgrs)}</td><td class="note">${r.flag ? chip(r.flag, r.flag === 'red' ? 'мелкий span, высокий отток' : 'наблюдаем') : ''}</td></tr>`).join('');
    return `${pageHead(p, 'Структура становится здоровее, но каждый пятый руководитель управляет командой меньше 4 человек', 'Квази-руководители 21% (цель 15%); новых юнитов создаётся больше, чем нанимается руководителей')}
      ${kpis(G.kpis)}
      <div class="rail-layout">${rail(G.comment, G.questions, G.links)}
        <div class="stack">
          <div class="grid g2">
            ${card(G.span_hist.title, span + CH.legend([{ name: 'август 2026', cls: 'now box' }, { name: 'квази-руководители', cls: 's1 box', }, { name: 'декабрь 2025', cls: 'prevmark' }]), 'число руководителей по количеству прямых подчинённых; чёрная риска — декабрь 2025')}
            ${card(G.layers.title, layers + CH.legend([{ name: 'август 2026', cls: 'now box' }, { name: 'декабрь 2025', cls: 'prevmark' }]), 'доля сотрудников, %; цель — не глубже 7 уровней')}
          </div>
          ${card('Управляемость по сегментам HQ', `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Сегмент</th><th>Руководителей</th><th>Медианный span</th><th>Квази (&lt; 4)</th><th>Перегруженные (&gt; 10)</th><th>Текучесть рук.</th><th>Новых рук. YTD</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`)}
        </div>
      </div>
      ${pageFoot(p, G.links, 'управленческая структура, HRS')}`;
  }

  /* ---------------------------------------------------------------- 09 продуктивность */
  function renderProductivity(p) {
    const Pr = D.productivity;
    const byStream = CH.hbars({ width: 420, items: Pr.ai.by_stream.map(x => ({ name: x.name, value: x.wau, prev: x.coverage, flag: x.wau < 50 ? 'amber' : '' })), fmt: 'pct', decimals: 0, labelWidth: 110, prevLabel: 'покрытие', max: 100 });
    const wau = CH.yoyLine({ width: 620, height: 190, y2025: Pr.ai.wau_series.y2025, y2026: Pr.ai.wau_series.y2026, plan: Pr.ai.wau_series.plan, fmt: 'pct', decimals: 0 });
    const roles = CH.hbars({ width: 300, items: Pr.meetings.overload_by_role.map(x => ({ name: x.name, value: x.share, prev: x.dec25 })), fmt: 'pct', decimals: 0, labelWidth: 95, prevLabel: 'дек 25', max: 40 });
    const zones = CH.hbars({ width: 300, items: Pr.workload.items.map(x => ({ name: x.name, value: x.share, prev: x.dec25, flag: x.flag })), fmt: 'pct', decimals: 1, labelWidth: 95, prevLabel: 'дек 25', max: 100 });
    const risks = CH.hbars({ width: 300, items: Pr.risks.items.map(x => ({ name: x.name, value: x.count, prev: x.dec25, flag: x.flag })), fmt: 'int', labelWidth: 130, prevLabel: 'дек 25' });
    const goals = CH.hbars({ width: 420, items: Pr.goals.actuality.map(x => ({ name: x.name, value: x.share, prev: x.dec25 })), fmt: 'pct', decimals: 0, labelWidth: 190, prevLabel: 'дек 25', max: 70 });
    return `${pageHead(p, 'ИИ стал нормой в разработке, но не в дискавери; нагрузка и риски растут вместе с найдом', 'WAU ИИ-инструментов 51% (цель 60%); 9,1% сотрудников в зоне перегрузки; индивидуальные цели у 64%')}
      <div class="rail-layout">${rail(Pr.comment, Pr.questions, Pr.links)}
        <div class="stack">
          ${sectionTitle('ИИ-изация', 'покрытие, активное использование, кто отстаёт')}
          ${kpis(Pr.ai.kpis, 'k4')}
          <div class="grid g2">
            ${card('Еженедельные пользователи ИИ-инструментов по стримам', byStream + CH.legend([{ name: 'WAU', cls: 'now box' }, { name: 'отстают (< 50%)', cls: 's1 box' }, { name: 'покрытие доступом', cls: 'prevmark' }]), '% сотрудников стрима')}
            ${card('WAU ИИ-инструментов: 2026 против 2025 и план', wau, '% HQ, использующих профильные инструменты ≥ 3 дней в неделю')}
          </div>
          ${sectionTitle('Нагрузка, встречи, риски', 'цифровые следы и DRAFT')}
          ${kpis([...Pr.meetings.kpis, ...Pr.office.kpis].slice(0, 5))}
          <div class="grid g3">
            ${card('Перегружены встречами (> 50% недели)', roles, '% по ролям; риска — декабрь 2025')}
            ${card(Pr.workload.title, zones, '% численности')}
            ${card(`Сотрудники с рисками: ${fmtInt(Pr.risks.total)} · ${fmtPct(Pr.risks.share, 1)} HQ`, risks, 'чел. по типу риска; риска — декабрь 2025')}
          </div>
          ${sectionTitle('Цели и результативность', 'СУП и индивидуальные цели')}
          <div class="grid g32">
            ${kpis(Pr.goals.kpis, 'k3')}
            ${card('Цели юнитов в СУП по актуальности', goals, '% юнитов; риска — декабрь 2025')}
          </div>
        </div>
      </div>
      ${pageFoot(p, Pr.links, 'логи ИИ-платформы, календарь и цифровые следы, DRAFT, СУП')}`;
  }

  /* ---------------------------------------------------------------- 10 crossdata */
  function renderCrossdata(p) {
    const C = D.crossdata;
    const lvl = CH.hbars({ width: 300, items: C.by_level.map(x => ({ name: x.name, value: x.share })), fmt: 'pct', decimals: 0, labelWidth: 130, max: 100 });
    const rep = CH.hbars({ width: 300, items: C.top_reports.map(x => ({ name: x.name, value: x.mau, prev: x.prev })), fmt: 'int', labelWidth: 130, prevLabel: 'июль' });
    const ad = CH.yoyLine({ width: 300, height: 150, y2025: C.adoption_series.y2025, y2026: C.adoption_series.y2026, plan: C.adoption_series.plan, fmt: 'pct', decimals: 0 });
    const extra = `<div><div class="eyebrow" style="margin-bottom:8px">Что нового</div><ul class="whatsnew">${C.whats_new.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>`;
    return `${pageHead(p, 'Руководители всё чаще принимают решения на данных: 61% пользуются CrossData ежемесячно', 'Минутка промо: адопшен, аудитория, новые продукты')}
      <div class="rail-layout">${rail(C.comment, C.questions, C.links, extra)}
        <div class="stack">
          ${kpis(C.kpis, 'k4')}
          <div class="grid g3">
            ${card('Руководители в CrossData по уровню', lvl, '% руководителей уровня, открывавших отчёты за месяц')}
            ${card('Самые используемые отчёты', rep, 'MAU; риска — июль')}
            ${card('Руководители в CrossData: 2026 против 2025', ad, '% всех руководителей, план — цель 70% к декабрю')}
          </div>
        </div>
      </div>
      ${pageFoot(p, C.links, 'аналитика использования CrossData')}`;
  }

  /* ---------------------------------------------------------------- 11 приложение */
  function renderAppendix(p) {
    const L = D.lines;
    const rows = L.rows.map(r => `<tr><td class="name">${esc(r.name)}</td><td>${fmtInt(r.hc)}</td><td>${fmtDelta(r.delta_ytd, 'int')}</td><td>${fmtDelta(r.plan_ytd, 'int')}</td><td>${Math.round(100 * r.delta_ytd / r.plan_ytd)}%</td><td>${fmtInt(r.vacancies)}</td><td class="${heat(r.attrition, 9, 15)}">${fmtPct(r.attrition, 1)}</td><td class="${heat(r.overdue, 15, 36)}">${r.overdue}%</td><td>${fmtPct(r.lowperf, 1)}</td><td class="note">${r.status !== 'none' ? chip(r.status, r.overdue >= 30 ? 'просроченные вакансии' : 'прирост выше плана') : ''}</td></tr>`).join('');
    const dict = D.control_panel.map(t => `<div><b>${esc(t.title)}</b><span>${esc(t.definition)}</span></div>`).join('');
    const allLinks = [].concat(D.headcount.links, D.hiring.links, D.flow.links, D.professions.links, D.management.links, D.productivity.links, D.crossdata.links, D.lines.links);
    return `${pageHead(p, 'Приложение: линии бизнеса, словарь метрик, ссылки', 'Материалы, к которым обращаются по необходимости')}
      ${card('Скоркарта по линиям бизнеса (КП) — опциональный блок v2', `<p class="note" style="margin-bottom:8px">${esc(L.note)}</p><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Линия</th><th>Числ. HQ</th><th>Δ YTD</th><th>План YTD</th><th>Вып. плана</th><th>Вакансии</th><th>Текучесть</th><th>Вак. &gt; 90 дн.</th><th>Low-perf</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`, '', 'optional')}
      ${card('Словарь метрик панели управления', `<div class="dict">${dict}</div>`)}
      ${card('Детальные отчёты (CrossData)', `<div class="links" style="flex-direction:row;flex-wrap:wrap;gap:6px 22px">${allLinks.map(l => `<a href="${esc(l.href)}">↗ ${esc(l.label)}</a>`).join('')}</div>`, 'в рабочей версии — ссылки на отчёты; здесь — заглушки')}
      <p class="note">${esc(M.disclaimer)} Подготовлено: ${esc(M.prepared_by)}. Выпуск ${esc(M.issue_no)} от ${esc(M.issued)}.</p>
      ${pageFoot(p, [], '')}`;
  }

  /* ---------------------------------------------------------------- сборка */
  const R = { summary: renderSummary, panel: renderPanel, headcount: renderHeadcount, hiring: renderHiring, flow: renderFlow, shifts: renderShifts, professions: renderProfessions, management: renderManagement, productivity: renderProductivity, crossdata: renderCrossdata, appendix: renderAppendix };
  document.getElementById('brand-sub').textContent = `${M.company} · ${M.period_label} · выпуск ${M.issue_no}`;
  document.getElementById('tabs').innerHTML = PAGES.map(p => `<a href="#p-${p.id}" class="${p.sep ? 'sep' : ''}"><span class="n">${p.no}</span>${esc(p.nav)}</a>`).join('');
  document.getElementById('app').innerHTML = PAGES.map(p => `<section class="page" id="p-${p.id}">${R[p.id](p)}</section>`).join('');
  CH.initTips();
})();
</script>
