<style>
/* ============================================================ COO HUB · РАДАР
   Приборная панель для одного очень занятого человека.
   Движение объясняет пространство и отвечает на касание за 100 мс. Анимируем только transform и opacity:
   раскладка во время движения не пересчитывается, поэтому ничего не дёргается. Всё выключается при reduce-motion.
   Тёмная тема — неоновая: глубокий чёрный с синим отливом, статусы светятся своим цветом. */
@property --tension { syntax: '<percentage>'; inherits: false; initial-value: 30%; }
@property --bglow { syntax: '<color>'; inherits: false; initial-value: #3d6bff; }

:root {
  color-scheme: light;
  --ground: #EDEFF2;
  --page-bg: #EDEFF2;
  --surf: #FFFFFF;
  --surf-2: #F4F5F8;
  --surf-3: #E8EBF0;
  --ink: #0D1016;
  --ink-2: #464C58;
  --muted: #7B8291;
  --rule: #E0E3E9;
  --accent: #2448E0;
  --accent-soft: #E7ECFF;
  --accent-ink: #1A36B0;
  --crit: #D1392E; --crit-soft: #FBE8E6; --crit-ink: #A42920;
  --warn: #B98A00; --warn-soft: #F8EFD6; --warn-ink: #735500;
  --good: #13824F; --good-soft: #E1F2E9; --good-ink: #0C5E38;
  /* поверхности компонентов: в тёмной теме — неоновые */
  --card-bg: #FFFFFF;
  --card-edge: #E0E3E9;
  --card-shadow: 0 1px 2px rgba(13,16,22,.05), 0 4px 14px rgba(13,16,22,.05);
  --btn-bg: #F4F5F8; --btn-edge: #E0E3E9;
  --btn-primary-bg: #0D1016; --btn-primary-ink: #FFFFFF; --btn-primary-glow: none;
  --chip-on-bg: #0D1016; --chip-on-ink: #FFFFFF; --chip-on-glow: none;
  --ind-bg: #FFFFFF; --ind-glow: 0 1px 2px rgba(13,16,22,.06), 0 4px 12px rgba(13,16,22,.06);
  --t-red: #FBE8E6; --t-amber: #F8EFD6; --t-ok: #E1F2E9; --t-none: #FFFFFF;
  --t-red-edge: transparent; --t-amber-edge: transparent; --t-ok-edge: transparent; --t-none-edge: transparent;
  --t-red-glow: none; --t-amber-glow: none; --t-ok-glow: none;
  --pill-red: #FBE8E6; --pill-amber: #F8EFD6; --pill-ok: #E1F2E9; --pill-none: #E8EBF0;
  --spark-filter: none;
  --line-filter: none;
  --tile-gap-bg: #E8EBF0;
  /* приборная карточка тёмная в обеих темах и всегда неоновая */
  --i-bg: #07080E; --i-bg-2: #0F1222; --i-ink: #F1F4FF; --i-ink-2: #AAB3D0; --i-muted: #6E7797; --i-rule: rgba(140,160,255,.12);
  --i-crit: #FF3D6E; --i-warn: #FFC940; --i-good: #2EF2A0; --i-accent: #5C9DFF; --i-violet: #9D6BFF;
  --shadow-2: 0 2px 6px rgba(13,16,22,.06), 0 18px 44px rgba(13,16,22,.12);
  --scrim: rgba(8,10,14,.42);
  --e-out: cubic-bezier(.2,.8,.2,1);
  --e-emph: cubic-bezier(.05,.7,.1,1);
  --e-inout: cubic-bezier(.65,0,.35,1);
  --e-back: cubic-bezier(.34,1.56,.64,1);
  --sans: "Golos Text", "SF Pro Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --brand: "Unbounded", "Golos Text", system-ui, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

  :root:not([data-theme="light"]) {

    --chip-on-bg: #5C9DFF; --chip-on-ink: #03050B; --chip-on-glow: 0 0 18px rgba(92,157,255,.45);
    --ind-bg: #151A36; --ind-glow: 0 0 0 1px rgba(92,157,255,.45), 0 0 16px rgba(92,157,255,.3);
    --t-red: linear-gradient(155deg, rgba(255,61,110,.30) 0%, rgba(255,61,110,.07) 100%);

    --t-red-edge: rgba(255,61,110,.55); --t-amber-edge: rgba(255,201,64,.45); --t-ok-edge: rgba(46,242,160,.4); --t-none-edge: rgba(120,140,255,.18);
    --t-red-glow: 0 0 24px rgba(255,61,110,.22); --t-amber-glow: 0 0 22px rgba(255,201,64,.16); --t-ok-glow: 0 0 22px rgba(46,242,160,.14);
    --pill-red: rgba(255,61,110,.15); --pill-amber: rgba(255,201,64,.14); --pill-ok: rgba(46,242,160,.13); --pill-none: rgba(120,140,255,.12);
    --spark-filter: drop-shadow(0 0 3px var(--sg));
    --line-filter: url(#neon);
    --tile-gap-bg: #05060A;
    --shadow-2: 0 0 0 1px rgba(92,157,255,.06), 0 24px 60px rgba(0,0,0,.6);
    --scrim: rgba(0,0,0,.66);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #05060A;
  --page-bg: radial-gradient(120% 46% at 50% -6%, #0E1433 0%, rgba(14,20,51,0) 70%), #05060A;
  --surf: #0C0E16; --surf-2: #121524; --surf-3: #1A1E31;
  --ink: #EEF2FF; --ink-2: #A7B0D0; --muted: #6C7596; --rule: #1C2136;
  --accent: #5C9DFF; --accent-soft: #10204A; --accent-ink: #9CC4FF;
  --crit: #FF3D6E; --crit-soft: #2A0D18; --crit-ink: #FF8FB0;
  --warn: #FFC940; --warn-soft: #2A2008; --warn-ink: #FFE08A;
  --good: #2EF2A0; --good-soft: #06261B; --good-ink: #8CFFD4;
  --card-bg: linear-gradient(180deg, #0F1221 0%, #0B0D16 100%);
  --card-edge: rgba(120,140,255,.14);
  --card-shadow: 0 0 0 1px rgba(92,157,255,.04), 0 12px 32px rgba(0,0,0,.5);
  --btn-bg: #121524; --btn-edge: rgba(120,140,255,.18);
  --btn-primary-bg: #5C9DFF; --btn-primary-ink: #03050B; --btn-primary-glow: 0 0 0 1px rgba(92,157,255,.5), 0 0 22px rgba(92,157,255,.45);
  --chip-on-bg: #5C9DFF; --chip-on-ink: #03050B; --chip-on-glow: 0 0 18px rgba(92,157,255,.45);
  --ind-bg: #151A36; --ind-glow: 0 0 0 1px rgba(92,157,255,.45), 0 0 16px rgba(92,157,255,.3);
  --t-red: linear-gradient(155deg, rgba(255,61,110,.30) 0%, rgba(255,61,110,.07) 100%);
  --t-amber: linear-gradient(155deg, rgba(255,201,64,.26) 0%, rgba(255,201,64,.06) 100%);
  --t-ok: linear-gradient(155deg, rgba(46,242,160,.22) 0%, rgba(46,242,160,.05) 100%);
  --t-none: linear-gradient(155deg, #151935 0%, #0E1122 100%);
  --t-red-edge: rgba(255,61,110,.55); --t-amber-edge: rgba(255,201,64,.45); --t-ok-edge: rgba(46,242,160,.4); --t-none-edge: rgba(120,140,255,.18);
  --t-red-glow: 0 0 24px rgba(255,61,110,.22); --t-amber-glow: 0 0 22px rgba(255,201,64,.16); --t-ok-glow: 0 0 22px rgba(46,242,160,.14);
  --pill-red: rgba(255,61,110,.15); --pill-amber: rgba(255,201,64,.14); --pill-ok: rgba(46,242,160,.13); --pill-none: rgba(120,140,255,.12);
  --spark-filter: drop-shadow(0 0 3px var(--sg));
  --line-filter: url(#neon);
  --tile-gap-bg: #05060A;
  --shadow-2: 0 0 0 1px rgba(92,157,255,.06), 0 24px 60px rgba(0,0,0,.6);
  --scrim: rgba(0,0,0,.66);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
/* полоса прокрутки не пропадает при открытой шторке — страница не прыгает вбок */
html { scroll-behavior: auto; scrollbar-gutter: stable; }
body { margin: 0; background: var(--page-bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; overflow-x: hidden; overflow-anchor: none; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
/* числа, которые досчитываются, — моноширинными цифрами: ширина не прыгает */
.tnum { font-variant-numeric: tabular-nums; }

/* нажатие: ответ за 100 мс. Строкам — подсветка вместо масштаба, чтобы список не дрожал при прокрутке */
.press { transition: transform .11s var(--e-out), background-color .2s, opacity .2s; }
.press:active { transform: scale(.97); }
.row.press:active, .rk.press:active, .kid-r.press:active, .tree .press:active { transform: none; background: color-mix(in srgb, var(--ink) 6%, transparent); }

/* ---------------------------------------------------------------- шапка */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--ground) 84%, transparent); backdrop-filter: saturate(1.4) blur(16px); -webkit-backdrop-filter: saturate(1.4) blur(16px); border-bottom: 1px solid color-mix(in srgb, var(--rule) 80%, transparent); }
.hdr .bar { max-width: 640px; margin: 0 auto; padding: 10px 16px 8px; display: flex; align-items: center; gap: 10px; }
.mark { font-family: var(--brand); font-weight: 800; font-size: 15px; letter-spacing: -.02em; white-space: nowrap; }
.unitbtn { display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 56vw; background: var(--btn-bg); border: 1px solid var(--btn-edge); border-radius: 999px; padding: 6px 10px 6px 12px; font-size: 13.5px; font-weight: 500; box-shadow: var(--card-shadow); }
.unitbtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unitbtn svg { width: 12px; height: 12px; flex: none; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hdr .sp { flex: 1; }
.icob { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; border: 1px solid var(--btn-edge); background: var(--btn-bg); flex: none; }
.icob svg { width: 16px; height: 16px; fill: none; stroke: var(--ink-2); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.seg { position: relative; max-width: 640px; margin: 0 auto; padding: 0 16px 9px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.seg button { position: relative; z-index: 1; padding: 7px 2px; font-size: 13px; color: var(--muted); text-align: center; white-space: nowrap; transition: color .24s var(--e-out); }
.seg button.on { color: var(--ink); font-weight: 600; }
/* индикатор ездит трансформом: ширина задаётся один раз и меняется только при смене раздела */
.seg .ind { position: absolute; left: 0; top: 0; height: 32px; width: 80px; border-radius: 9px; background: var(--ind-bg); box-shadow: var(--ind-glow); transform-origin: 0 0; transition: transform .34s var(--e-emph); pointer-events: none; will-change: transform; }

/* ---------------------------------------------------------------- каркас */
.wrap { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 14px calc(var(--safe-b) + 40px); display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; }
.sec { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; scroll-margin-top: calc(var(--safe-t) + 104px); }
.sec-head { display: flex; align-items: baseline; gap: 10px; }
.sec-head h2 { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.sec-head .n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.sec-head .sp { flex: 1; }
.foot { font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 1.7; }

/* ---------------------------------------------------------------- приборная карточка: радар */
.inst { position: relative; overflow: hidden; background: radial-gradient(130% 80% at 50% 0%, var(--i-bg-2) 0%, var(--i-bg) 62%); color: var(--i-ink); border-radius: 26px; padding: 16px 16px 18px; box-shadow: 0 0 0 1px rgba(120,140,255,.14), inset 0 1px 0 rgba(255,255,255,.05), var(--shadow-2); isolation: isolate; }
/* свечение без filter: blur — мягкость даёт сам градиент, слой двигается на видеокарте */
.inst .glow { position: absolute; inset: -30%; z-index: -1; pointer-events: none; opacity: .75; will-change: transform;
  background:
    radial-gradient(34% 30% at 72% 20%, color-mix(in oklab, var(--i-crit) var(--tension), var(--i-good)) 0%, rgba(0,0,0,0) 72%),
    radial-gradient(32% 28% at 18% 86%, color-mix(in oklab, var(--i-accent) 60%, transparent) 0%, rgba(0,0,0,0) 74%),
    radial-gradient(26% 22% at 90% 78%, color-mix(in oklab, var(--i-violet) 45%, transparent) 0%, rgba(0,0,0,0) 74%);
  transition: --tension .9s var(--e-out);
  animation: drift 16s var(--e-inout) infinite alternate; }
@keyframes drift { from { transform: translate3d(-3%, -2%, 0) scale(1); } to { transform: translate3d(3%, 3%, 0) scale(1.08); } }
.inst .top { display: flex; align-items: center; gap: 8px; }
.inst .top .lbl { color: var(--i-ink-2); white-space: nowrap; text-shadow: 0 1px 10px rgba(0,0,0,.7); }
.inst .top .sp { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--i-ink-2); white-space: nowrap; }
.live i { position: relative; width: 6px; height: 6px; border-radius: 50%; background: var(--i-good); box-shadow: 0 0 8px var(--i-good); }
.live i::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--i-good); animation: beacon 2.4s var(--e-out) infinite; will-change: transform, opacity; }
@keyframes beacon { 0% { transform: scale(1); opacity: .6; } 70%, 100% { transform: scale(3.2); opacity: 0; } }

.ringwrap { position: relative; width: min(100%, 330px); margin: 8px auto 0; aspect-ratio: 1; max-width: 100%; }
.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ring .track { fill: none; stroke: var(--i-rule); stroke-width: 1; }
.ring .arc { fill: none; stroke: rgba(255,255,255,.16); stroke-width: 2.5; stroke-linecap: round; transition: stroke .5s var(--e-out); }
.ring .arc.red { stroke: color-mix(in srgb, var(--i-crit) 70%, transparent); }
.ring .arc.amber { stroke: color-mix(in srgb, var(--i-warn) 60%, transparent); }
.ring .arc.ok { stroke: color-mix(in srgb, var(--i-good) 55%, transparent); }
.ring .blab { fill: var(--i-muted); font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; }
.ring .tick { stroke: rgba(160,180,255,.09); stroke-width: 1; }
.dot { cursor: pointer; outline: none; }
.dot > .pop { transform-box: fill-box; transform-origin: center; }
.dot .hit { fill: transparent; }
.dot .s { transition: opacity .32s var(--e-out), transform .42s var(--e-back); transform-box: fill-box; transform-origin: center; opacity: 0; transform: scale(.3); }
.dot.red .s-red, .dot.amber .s-amber, .dot.ok .s-ok, .dot.none .s-none, .dot.inner .s-inner { opacity: 1; transform: scale(1); }
.dot .s-red { fill: var(--i-crit); }
.dot .s-amber { fill: var(--i-warn); }
.dot .s-ok { fill: none; stroke: var(--i-good); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.dot .s-none { fill: none; stroke: var(--i-muted); stroke-width: 1.8; }
.dot .s-inner circle:first-child { fill: none; stroke: var(--i-crit); stroke-width: 1.8; }
.dot .s-inner circle:last-child { fill: var(--i-crit); }
.dot:hover .s, .dot:focus-visible .s { opacity: 1; }
.dot .ring-sel { fill: none; stroke: var(--i-ink); stroke-width: 1.5; opacity: 0; transition: opacity .2s; }
.dot.sel .ring-sel { opacity: 1; }
/* ореолы красных точек — обычные блоки поверх SVG: пульс считает видеокарта, а не раскладка */
.halos { position: absolute; inset: 0; pointer-events: none; }
.halos i { position: absolute; width: 5.4%; aspect-ratio: 1; margin: -2.7% 0 0 -2.7%; border-radius: 50%; background: var(--i-crit); opacity: 0; animation: halo 2.6s var(--e-out) infinite; will-change: transform, opacity; }
@keyframes halo { 0% { opacity: .5; transform: scale(1); } 80%, 100% { opacity: 0; transform: scale(2.8); } }

.center { position: absolute; inset: 20%; display: grid; place-content: center; text-align: center; pointer-events: none; }
.center .big { font-family: var(--sans); font-weight: 700; font-size: clamp(56px, 19vw, 76px); line-height: .95; letter-spacing: -.045em; font-variant-numeric: tabular-nums; text-shadow: 0 0 28px rgba(92,157,255,.28); white-space: nowrap; }
.center .cap { font-size: 12.5px; color: var(--i-ink-2); margin-top: 6px; line-height: 1.35; }
.center .cap2 { font-family: var(--mono); font-size: 10.5px; color: var(--i-muted); margin-top: 6px; line-height: 1.5; }
.center .peek { font-size: 13px; font-weight: 600; line-height: 1.3; color: var(--i-ink); }
.center.peeking .big { font-size: clamp(28px, 9vw, 38px); letter-spacing: -.03em; }

.verdict { font-size: clamp(21px, 6vw, 25px); font-weight: 700; line-height: 1.18; letter-spacing: -.025em; margin-top: 10px; text-wrap: balance; }
.vsub { color: var(--i-ink-2); font-size: 14px; line-height: 1.5; margin-top: 8px; text-wrap: pretty; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-family: var(--mono); font-size: 10px; color: var(--i-muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 11px; height: 11px; }
.acts { display: flex; align-items: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
.play { display: inline-flex; align-items: center; gap: 10px; background: var(--i-ink); color: var(--i-bg); border-radius: 999px; padding: 11px 18px 11px 12px; font-weight: 600; font-size: 14.5px; box-shadow: 0 0 24px rgba(92,157,255,.35); }
.play .pi { width: 26px; height: 26px; border-radius: 50%; background: var(--i-bg); display: grid; place-items: center; }
.play .pi svg { width: 10px; height: 10px; fill: var(--i-ink); margin-left: 2px; }
.play small { font-family: var(--mono); font-weight: 400; font-size: 11px; opacity: .6; }
.src { font-family: var(--mono); font-size: 10px; color: var(--i-muted); line-height: 1.5; }

/* глифы статуса: форма дублирует цвет */
.g { display: inline-block; width: 12px; height: 12px; flex: none; vertical-align: -1px; overflow: visible; }
.g.red { fill: var(--crit); } .g.amber { fill: var(--warn); }
.g.ok { fill: none; stroke: var(--good); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.g.none { fill: none; stroke: var(--muted); stroke-width: 1.6; }
.g.inner circle:first-child { fill: none; stroke: var(--crit); stroke-width: 1.6; } .g.inner circle:last-child { fill: var(--crit); }
.inst .g.red, .brief .g.red { fill: var(--i-crit); } .inst .g.amber, .brief .g.amber { fill: var(--i-warn); } .inst .g.ok, .brief .g.ok { stroke: var(--i-good); } .inst .g.none { stroke: var(--i-muted); }
.inst .g.inner circle:first-child { stroke: var(--i-crit); } .inst .g.inner circle:last-child { fill: var(--i-crit); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 9px 4px 7px; font-size: 12px; font-weight: 500; white-space: nowrap; }
.pill.red { background: var(--pill-red); color: var(--crit-ink); }
.pill.amber { background: var(--pill-amber); color: var(--warn-ink); }
.pill.ok { background: var(--pill-ok); color: var(--good-ink); }
.pill.none, .pill.inner { background: var(--pill-none); color: var(--ink-2); }

/* ---------------------------------------------------------------- «Где болит»: карусель */
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: min(84%, 340px); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin-inline: -16px; padding: 4px 16px 10px; scroll-padding-inline: 16px; overscroll-behavior-x: contain; }
.rail::-webkit-scrollbar { display: none; }
.issue { scroll-snap-align: start; min-width: 0; background: var(--card-bg); border: 1px solid var(--card-edge); border-radius: 22px; padding: 16px; box-shadow: var(--card-shadow); display: flex; flex-direction: column; gap: 10px; }
.issue .it { display: flex; align-items: center; gap: 8px; }
.issue .it .blk { margin-left: auto; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.issue h3 { font-size: 18px; font-weight: 600; letter-spacing: -.015em; line-height: 1.25; }
.issue .iv { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; min-width: 0; }
.issue .iv .v { font-size: 40px; font-weight: 700; letter-spacing: -.04em; line-height: 1; white-space: nowrap; max-width: 100%; }
.issue .iv .fr { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.issue .gapt { font-size: 13.5px; color: var(--ink-2); line-height: 1.45; }
.issue .gapt b { color: var(--ink); font-weight: 600; }
.issue .todo { background: var(--surf-2); border-radius: 14px; padding: 11px 12px; font-size: 14px; line-height: 1.45; }
.issue .todo .lbl { display: block; margin-bottom: 4px; }
.issue .ul { display: grid; gap: 7px; }
.issue .ul div { display: flex; align-items: center; gap: 8px; font-size: 14px; min-width: 0; }
.issue .ul b { margin-left: auto; font-family: var(--mono); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.issue .ia { display: flex; gap: 8px; margin-top: auto; padding-top: 2px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 999px; padding: 10px 14px; font-size: 13.5px; font-weight: 500; background: var(--btn-bg); color: var(--ink); border: 1px solid var(--btn-edge); }
.btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: var(--btn-primary-bg); color: var(--btn-primary-ink); border-color: transparent; box-shadow: var(--btn-primary-glow); }
.btn.wide { width: 100%; }
.pager { display: flex; justify-content: center; gap: 6px; }
.pager i { width: 6px; height: 6px; border-radius: 3px; background: var(--surf-3); transition: width .3s var(--e-emph), background-color .3s; }
.pager i.on { width: 18px; background: var(--ink); }
.calm { background: var(--card-bg); border: 1px solid var(--card-edge); border-radius: 22px; padding: 18px; display: flex; gap: 12px; align-items: flex-start; }
.calm .g { width: 20px; height: 20px; margin-top: 2px; }

/* ---------------------------------------------------------------- карта продуктов */
.toggle { display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--surf-3); border-radius: 10px; padding: 3px; position: relative; }
.toggle button { position: relative; z-index: 1; padding: 5px 12px; font-size: 12.5px; color: var(--muted); border-radius: 8px; transition: color .2s; }
.toggle button.on { color: var(--ink); }
.toggle .ti { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 8px; background: var(--ind-bg); box-shadow: var(--ind-glow); transition: transform .3s var(--e-emph); }
.toggle.rank .ti { transform: translateX(100%); }
.mchips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px; scroll-padding-inline: 16px; }
.mchips::-webkit-scrollbar { display: none; }
.mchips button { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; font-size: 13px; background: var(--btn-bg); border: 1px solid var(--btn-edge); color: var(--ink-2); white-space: nowrap; transition: background-color .22s, color .22s, border-color .22s, box-shadow .22s; }
.mchips button.on { background: var(--chip-on-bg); color: var(--chip-on-ink); border-color: transparent; box-shadow: var(--chip-on-glow); }
.mchips button.on .g.ok, .mchips button.on .g.none { stroke: var(--chip-on-ink); }
.mchips button.on .g.red, .mchips button.on .g.amber { filter: none; }
.crumbs { display: flex; align-items: center; gap: 4px; min-height: 28px; overflow-x: auto; scrollbar-width: none; }
.crumbs::-webkit-scrollbar { display: none; }
.crumbs button { flex: none; font-size: 13.5px; color: var(--accent); padding: 4px 2px; white-space: nowrap; }
.crumbs button.cur { color: var(--ink); font-weight: 600; cursor: default; }
.crumbs i { color: var(--muted); font-style: normal; font-size: 12px; flex: none; }
.crumbs .back { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--btn-bg); border: 1px solid var(--btn-edge); margin-right: 4px; }
.crumbs .back svg { width: 12px; height: 12px; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

.tm { position: relative; height: 312px; border-radius: 20px; overflow: hidden; background: var(--tile-gap-bg); contain: layout paint; }
.tm-layer { position: absolute; inset: 0; }
/* плитка = пустая рамка на своём месте; фон (.tbg) и содержимое (.tc) анимируются отдельно,
   поэтому при зуме текст не растягивается и не переносится на каждом кадре */
.tile { position: absolute; text-align: left; color: var(--ink); border-radius: 14px; }
.tile .tbg { position: absolute; inset: 0; border-radius: 14px; transform-origin: 0 0; background: var(--t-none); box-shadow: inset 0 0 0 1px var(--t-none-edge); transition: background .38s var(--e-out), box-shadow .38s var(--e-out); }
.tile.red .tbg { background: var(--t-red); box-shadow: inset 0 0 0 1px var(--t-red-edge), var(--t-red-glow); }

/* в узкой плитке единицы («млн ₽») уходят под число, а число остаётся крупным */

.tm-note { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

.rk { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 6px; margin-inline: -6px; border-radius: 10px; border-top: 1px solid var(--rule); text-align: left; width: calc(100% + 12px); }

.rk .n { font-size: 14.5px; min-width: 0; }

.rk .v { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rk .track { grid-column: 2 / 4; position: relative; height: 6px; border-radius: 3px; background: var(--surf-3); }
.rk .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--ink-2); transform-origin: left; animation: grow .55s var(--e-emph) both; }
.rk.red .track i { background: var(--crit); box-shadow: var(--t-red-glow); } .rk.amber .track i { background: var(--warn); } .rk.ok .track i { background: var(--good); }

/* ---------------------------------------------------------------- все метрики */
.grp { background: var(--card-bg); border: 1px solid var(--card-edge); border-radius: 20px; padding: 6px 14px; box-shadow: var(--card-shadow); }
.grp-h { display: flex; align-items: center; gap: 8px; padding: 10px 0 6px; }

.grp-h .sum { margin-left: auto; display: flex; gap: 4px; }
.row { display: grid; grid-template-columns: 14px minmax(0, 1fr) 56px auto; gap: 10px; align-items: center; width: calc(100% + 12px); margin-inline: -6px; padding: 11px 6px; border-radius: 10px; text-align: left; border-top: 1px solid var(--rule); }
.row .n { font-size: 14.5px; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
.row .n small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.row .val { display: grid; justify-items: end; gap: 1px; }
.row .val b { font-size: 15.5px; font-weight: 600; letter-spacing: -.015em; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row .val small { font-family: var(--mono); font-size: 10.5px; white-space: nowrap; color: var(--muted); }
.good { color: var(--good-ink) !important; } .bad { color: var(--crit-ink) !important; } .flat { color: var(--muted) !important; }
.sp-svg { width: 56px; height: 24px; display: block; overflow: visible; filter: var(--spark-filter); }
.sp-svg .a { stroke: none; } .sp-svg .l { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; } .sp-svg .p { stroke: var(--surf); stroke-width: 1.5; }
.sp-svg.red { --sg: var(--crit); } .sp-svg.amber { --sg: var(--warn); } .sp-svg.ok { --sg: var(--good); } .sp-svg.none, .sp-svg.inner { --sg: var(--accent); }
.sp-svg .a { fill: color-mix(in srgb, var(--sg) 12%, transparent); } .sp-svg .l { stroke: var(--sg); } .sp-svg .p { fill: var(--sg); }

/* ---------------------------------------------------------------- шторка */
.scrim { position: fixed; inset: 0; z-index: 60; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .28s var(--e-out); }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; max-width: 640px; margin: 0 auto; background: var(--surf); border-radius: 26px 26px 0 0; box-shadow: 0 -12px 50px rgba(0,0,0,.25), 0 0 0 1px var(--card-edge); max-height: calc(100% - var(--safe-t) - 28px); display: flex; flex-direction: column; transform: translate3d(0, 105%, 0); visibility: hidden; will-change: transform; }
.sheet.on { visibility: visible; }
.sheet .grab { flex: none; padding: 10px 0 6px; display: grid; place-items: center; cursor: grab; touch-action: none; }
.sheet .grab i { width: 40px; height: 5px; border-radius: 3px; background: var(--surf-3); }
.sheet .body { overflow-y: auto; overscroll-behavior: contain; padding: 4px 18px calc(var(--safe-b) + 22px); }
/* содержимое шторки проявляется лесенкой, пока она едет вверх */
.sheet .body.enter > * { animation: rise .42s var(--e-emph) both; }
.sheet .body.enter > :nth-child(2) { animation-delay: .03s; } .sheet .body.enter > :nth-child(3) { animation-delay: .06s; }
.sheet .body.enter > :nth-child(4) { animation-delay: .09s; } .sheet .body.enter > :nth-child(5) { animation-delay: .12s; }
.sheet .body.enter > :nth-child(6) { animation-delay: .15s; } .sheet .body.enter > :nth-child(7) { animation-delay: .18s; }
.sheet .body.enter > :nth-child(n+8) { animation-delay: .2s; }
.sh-k { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sh-k .lbl { color: var(--muted); }
.sh-t { font-size: 22px; font-weight: 700; letter-spacing: -.025em; line-height: 1.2; margin-top: 6px; text-wrap: balance; }
.sh-hero { display: flex; align-items: flex-end; gap: 4px 12px; margin-top: 14px; flex-wrap: wrap; min-width: 0; }
.sh-hero .v { font-size: 48px; font-weight: 700; letter-spacing: -.045em; line-height: .95; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sh-hero .w { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding-bottom: 4px; white-space: nowrap; }
.sh-fr { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
.chart { position: relative; margin-top: 16px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .yl { fill: var(--muted); font-family: var(--mono); font-size: 9.5px; }
.chart .xl { fill: var(--muted); font-family: var(--mono); font-size: 9.5px; }
.chart .thr-red { stroke: var(--crit); stroke-width: 1; opacity: .55; } .chart .thr-amber { stroke: var(--warn); stroke-width: 1; opacity: .6; }
.chart .tl { font-family: var(--mono); font-size: 9px; }
.chart .tl.red { fill: var(--crit-ink); } .chart .tl.amber { fill: var(--warn-ink); }
.chart .area { fill: color-mix(in srgb, var(--accent) 12%, transparent); }
.chart .l26 { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; filter: var(--line-filter); }
.chart .l25 { fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 4 4; stroke-linejoin: round; opacity: .8; }
.chart .end { fill: var(--accent); stroke: var(--surf); stroke-width: 2; }
.chart .cur { stroke: var(--ink); stroke-width: 1; opacity: 0; transition: opacity .15s; }
.chart .cdot { fill: var(--surf); stroke: var(--accent); stroke-width: 2.4; opacity: 0; transition: opacity .15s; }
.chart.scrub .cur, .chart.scrub .cdot { opacity: 1; }
.chart .draw { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw .9s var(--e-emph) .08s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
/* подсказка ездит трансформом, а не left/top */
.tip { position: absolute; top: 0; left: 0; background: var(--ink); color: var(--surf); border-radius: 10px; padding: 6px 9px; font-size: 12px; line-height: 1.35; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s; box-shadow: var(--shadow-2); will-change: transform; font-variant-numeric: tabular-nums; }
.tip b { font-weight: 700; }
.tip small { display: block; font-family: var(--mono); font-size: 10px; opacity: .7; }
.chart.scrub .tip { opacity: 1; }
.lg { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.lg span { display: inline-flex; align-items: center; gap: 6px; }
.lg i { display: inline-block; width: 16px; height: 0; border-top: 2px solid var(--accent); }
.lg i.p { border-top: 2px dashed var(--muted); }
.lg .hint { margin-left: auto; }
.meta { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 16px; }
.meta div { background: var(--surf-2); border-radius: 14px; padding: 10px 12px; min-width: 0; }
.meta .l { font-family: var(--mono); font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.meta .v { font-size: 15px; font-weight: 600; margin-top: 3px; overflow-wrap: anywhere; }
.zbar { margin-top: 16px; }
.zbar svg { display: block; width: 100%; height: auto; overflow: visible; }
.zbar .z.bad { fill: var(--crit); opacity: .22; } .zbar .z.warn { fill: var(--warn); opacity: .24; } .zbar .z.good { fill: var(--good); opacity: .22; }
.zbar .mk { fill: var(--ink); }
.zbar .zl { fill: var(--muted); font-family: var(--mono); font-size: 10px; }
.zbar .zv { fill: var(--ink); font-family: var(--sans); font-weight: 600; font-size: 12px; }
.blk { margin-top: 18px; }
.blk > .lbl { display: block; margin-bottom: 8px; }
.blk p { font-size: 14.5px; line-height: 1.55; color: var(--ink-2); }
.todo2 { background: var(--surf-2); border-radius: 16px; padding: 13px 14px; }
.todo2 p { color: var(--ink); font-size: 15px; }
.todo2 .btn { margin-top: 12px; }
.kids { display: grid; gap: 0; }
.kid-r { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 6px; margin-inline: -6px; border-radius: 10px; border-top: 1px solid var(--rule); width: calc(100% + 12px); text-align: left; }
.kid-r:first-child { border-top: 0; }
.kid-r .n { font-size: 14.5px; min-width: 0; }
.kid-r .v { font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kid-r .track { grid-column: 2 / 4; position: relative; height: 5px; border-radius: 3px; background: var(--surf-3); }
.kid-r .track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--ink-2); transform-origin: left; animation: grow .6s var(--e-emph) both; }
.kid-r.red .track i { background: var(--crit); } .kid-r.amber .track i { background: var(--warn); } .kid-r.ok .track i { background: var(--good); }
details.more { margin-top: 16px; border-top: 1px solid var(--rule); padding-top: 12px; }
details.more summary { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); cursor: pointer; list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+ "; }
details.more[open] summary::before { content: "− "; }
.tbl-wrap { overflow-x: auto; margin-top: 10px; }
table.t { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
table.t th, table.t td { text-align: right; padding: 6px 4px; border-top: 1px solid var(--rule); white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; color: var(--ink-2); }
table.t th { color: var(--muted); font-weight: 400; }
table.f td { text-align: left; white-space: normal; vertical-align: top; overflow-wrap: anywhere; }
table.f td:first-child { color: var(--accent); white-space: nowrap; padding-right: 10px; }
.close { display: block; width: 100%; margin-top: 20px; background: var(--surf-2); border-radius: 14px; padding: 13px; font-size: 15px; font-weight: 500; }
.tree { display: grid; margin-top: 10px; }
.tree button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 12px 0; border-top: 1px solid var(--rule); }
.tree button:first-child { border-top: 0; }
.tree .l2 { padding-left: 14px; } .tree .l3 { padding-left: 30px; }
.tree .nm { font-size: 15px; min-width: 0; }
.tree .nm small { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.tree .on .nm { color: var(--accent); font-weight: 600; }
.tree .pills { display: flex; gap: 4px; }
.copybox { width: 100%; min-height: 150px; margin-top: 12px; border-radius: 14px; border: 1px solid var(--rule); background: var(--surf-2); color: var(--ink); font: 14px/1.5 var(--sans); padding: 12px; resize: vertical; }

/* ---------------------------------------------------------------- брифинг */
.brief { position: fixed; inset: 0; z-index: 90; background: #04050A; color: #F2F4FF; display: flex; flex-direction: column; padding: calc(var(--safe-t) + 10px) 0 calc(var(--safe-b) + 14px); overflow: hidden; }
/* цвет подсветки меняется плавно, но пересчитывается только этот слой, а не весь слайд */
.brief .bg { position: absolute; inset: -20%; z-index: 0; pointer-events: none; opacity: .75; will-change: transform; transition: --bglow .9s var(--e-out);
  background:
    radial-gradient(36% 28% at 70% 24%, color-mix(in oklab, var(--bglow) 85%, transparent) 0%, rgba(0,0,0,0) 72%),
    radial-gradient(30% 24% at 20% 80%, rgba(157,107,255,.45) 0%, rgba(0,0,0,0) 72%),
    radial-gradient(28% 22% at 86% 88%, rgba(92,157,255,.35) 0%, rgba(0,0,0,0) 72%);
  animation: drift 14s var(--e-inout) infinite alternate; }
.bbars { position: relative; z-index: 2; display: flex; gap: 4px; padding: 0 14px; }
.bbars i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,.2); overflow: hidden; }
.bbars i b { display: block; height: 100%; width: 100%; background: #fff; transform-origin: left; transform: scaleX(0); box-shadow: 0 0 8px rgba(255,255,255,.7); }
.bbars i.done b { transform: scaleX(1); }
.bbars i.on b { animation: fill var(--dur, 6.5s) linear forwards; }
.brief.paused .bbars i.on b { animation-play-state: paused; }
@keyframes fill { to { transform: scaleX(1); } }
.btop { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 12px 16px 0; }
.btop .who { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.6); }
.btop .sp { flex: 1; }
.btop button { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.1); }
.btop button svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 2.2; fill: none; stroke-linecap: round; }
.bstage { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 10px 24px 20px; max-width: 560px; width: 100%; margin: 0 auto; min-width: 0; }
.bslide { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.bslide .k { animation: rise .55s var(--e-emph) both; }
.bslide .k:nth-child(2) { animation-delay: .06s; } .bslide .k:nth-child(3) { animation-delay: .12s; } .bslide .k:nth-child(4) { animation-delay: .18s; }
.bslide .k:nth-child(5) { animation-delay: .24s; } .bslide .k:nth-child(6) { animation-delay: .3s; } .bslide .k:nth-child(7) { animation-delay: .36s; }
@keyframes rise { from { opacity: 0; transform: translate3d(0, 18px, 0); } to { opacity: 1; transform: none; } }
.bk { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.62); display: flex; align-items: center; gap: 8px; }
.bh { font-size: clamp(26px, 8vw, 36px); font-weight: 700; letter-spacing: -.03em; line-height: 1.1; text-wrap: balance; }
.bbig { font-size: clamp(56px, 20vw, 100px); font-weight: 700; letter-spacing: -.05em; line-height: .9; font-variant-numeric: tabular-nums; white-space: nowrap; text-shadow: 0 0 36px color-mix(in oklab, var(--gl, #3d6bff) 70%, transparent); }
.bcover { font-family: var(--brand); font-weight: 800; font-size: clamp(40px, 13vw, 64px); letter-spacing: -.035em; line-height: 1; text-shadow: 0 0 34px rgba(92,157,255,.35); }
.bp { font-size: 16px; line-height: 1.5; color: rgba(255,255,255,.8); text-wrap: pretty; }
.bp b { color: #fff; font-weight: 600; }
.bsp { width: 100%; height: 70px; overflow: visible; }
.bsp .l { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.bsp .a { fill: rgba(255,255,255,.07); }
.bsp .t { stroke-width: 1; opacity: .7; }
.bsp .t.red { stroke: var(--i-crit); } .bsp .t.amber { stroke: var(--i-warn); }
.bsp .p { fill: #fff; }
.blist { display: grid; gap: 10px; }
.blist div { display: flex; align-items: center; gap: 10px; font-size: 16px; min-width: 0; }
.blist b { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.btodo { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 13px 14px; font-size: 15.5px; line-height: 1.45; }
.btodo .bk { margin-bottom: 6px; }
.bbtn { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; background: #fff; color: #04050A; border-radius: 999px; padding: 11px 16px; font-weight: 600; font-size: 14.5px; position: relative; z-index: 3; box-shadow: 0 0 24px rgba(255,255,255,.25); }
.bbtn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bhint { position: relative; z-index: 2; text-align: center; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.4); }
.bring { width: 132px; height: 132px; overflow: visible; }

/* ---------------------------------------------------------------- тост */

  /* ---------------------------------------------------------------- карта продуктов */
  function squarify(items, W, H) {
    const total = items.reduce((s, i) => s + i.v, 0) || 1, sc = W * H / total;
    const nodes = items.map(i => Object.assign({}, i, { a: i.v * sc })), out = [];
    let row = [], rx = 0, ry = 0, rw = W, rh = H;
    const worst = (r, side) => { const s = r.reduce((a, n) => a + n.a, 0), mx = Math.max(...r.map(n => n.a)), mn = Math.min(...r.map(n => n.a)); return Math.max(side * side * mx / (s * s), (s * s) / (side * side * mn)); };
    const lay = r => {
      const s = r.reduce((a, n) => a + n.a, 0);

      else { const ch = s / rw; let cx = rx; r.forEach(n => { const w = n.a / ch; out.push(Object.assign(n, { x: cx, y: ry, w, h: ch })); cx += w; }); ry += ch; rh -= ch; }
    };

    }

  const G = 3;

      .map(r => ({ rk: r.rk, x: Math.round(r.x + G), y: Math.round(r.y + G), w: Math.round(Math.max(0, r.w - 2 * G)), h: Math.round(Math.max(0, r.h - 2 * G)) }));
  }
  function tileInner(r, m) {
    const u = byRk[r.rk], f = F[r.rk][m.eng], s = stKey(m, r.rk);

      <div class="k bk">${GLYPH.amber}На грани</div>
      <div class="k bh">Жёлтая зона — пока без вмешательства, но под присмотром</div>
      <div class="k blist">${t.amber.map(m => `<div>${GLYPH.amber}${esc(m.name)}<b>${fmtC(F[rk][m.eng].value_final, m)}</b></div>`).join('')}</div>` });
    out.push({ dur: 5, glow: '#19e6a0', html: `
      <div class="k bk">${GLYPH.ok}В норме</div>
      <div class="k bh">${t.ok.length} ${plural(t.ok.length, ['метрика', 'метрики', 'метрик'])} держатся — о них можно не говорить</div>
      <div class="k blist">${t.ok.slice(0, 6).map(m => `<div>${GLYPH.ok}${esc(m.name)}<b>${fmtC(F[rk][m.eng].value_final, m)}</b></div>`).join('')}</div>
      <button class="k bbtn press" data-endbrief>Открыть отчёт</button>` });
    return out;
  }
  const BR = { i: 0, slides: [], timer: 0, left: 0, started: 0, paused: false };
  function openBrief() {
    BR.slides = briefSlides(); BR.i = 0;
    const el = $('#brief');
    $('#bWho').textContent = `${byRk[S.unit].functional_unit_nm} · ${META.period_label.toLowerCase()}`;
    $('#bBars').innerHTML = BR.slides.map(() => '<i><b></b></i>').join('');
    el.hidden = false; document.body.style.overflow = 'hidden';
    if (!reduce() && el.animate) el.animate([{ opacity: 0, transform: 'scale(1.04)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' });
    showSlide(0);
    $('#bClose').focus({ preventScroll: true });
  }
  function closeBrief() {
    const el = $('#brief'); if (el.hidden) return;
    clearTimeout(BR.timer);
    const done = () => { el.hidden = true; document.body.style.overflow = ''; $('#bStage').innerHTML = ''; $('#briefBtn').focus({ preventScroll: true }); };
    if (reduce() || !el.animate) done();
    else el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translate3d(0,40px,0)' }], { duration: 240, easing: 'cubic-bezier(.3,0,.8,.15)' }).finished.then(done);
  }
  function showSlide(i) {
    clearTimeout(BR.timer);
    if (i < 0) i = 0;
    if (i >= BR.slides.length) { closeBrief(); return; }
    BR.i = i; BR.paused = false; $('#brief').classList.remove('paused');
    const sl = BR.slides[i];
    $$('#bBars i').forEach((b, k) => { b.className = k < i ? 'done' : k === i ? 'on' : ''; b.style.setProperty('--dur', sl.dur + 's'); });
    const bar = $$('#bBars i')[i]; if (bar) { const x = bar.firstElementChild; x.style.animation = 'none'; void x.offsetWidth; x.style.animation = ''; }
    $('#bBg').style.setProperty('--bglow', sl.glow);
    $('#bStage').innerHTML = `<div class="bslide" style="--gl:${sl.glow}">${sl.html}</div>`;
    const big = $('#bStage [data-bcount]');
    if (big) {
      const m = M(big.dataset.eng), v = +big.dataset.bcount;
      fit(big, $('#bStage .bslide').clientWidth, .45);
      setNum(big, 'b-' + i, v, x => fmtC(x, m), reduce() ? {} : { from: m.vt === 'perc' ? 0 : v * .6, dur: 1100 });
    }
    BR.left = sl.dur * 1000; BR.started = performance.now();
    BR.timer = setTimeout(() => showSlide(BR.i + 1), BR.left);
  }
  function pauseBrief(p) {
    if (p === BR.paused) return;
    BR.paused = p; $('#brief').classList.toggle('paused', p);
    if (p) { clearTimeout(BR.timer); BR.left -= performance.now() - BR.started; }
    else { BR.started = performance.now(); BR.timer = setTimeout(() => showSlide(BR.i + 1), Math.max(300, BR.left)); }
  }
  (function briefInput() {
    const el = $('#brief');
    let x0 = 0, y0 = 0, t0 = 0, holdT = 0, down = false;
    el.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; down = true; x0 = e.clientX; y0 = e.clientY; t0 = performance.now(); holdT = setTimeout(() => pauseBrief(true), 220); });
    el.addEventListener('pointerup', e => {
      if (!down) return; down = false; clearTimeout(holdT);
      const dx = e.clientX - x0, dy = e.clientY - y0, dt = performance.now() - t0;
      if (dy > 80 && dy > Math.abs(dx)) { closeBrief(); return; }
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { showSlide(BR.i + (dx < 0 ? 1 : -1)); return; }
      if (BR.paused) { pauseBrief(false); return; }
      if (dt < 260) showSlide(BR.i + (e.clientX < el.clientWidth * .3 ? -1 : 1));
    });
    el.addEventListener('pointercancel', () => { down = false; clearTimeout(holdT); pauseBrief(false); });
    $('#bClose').addEventListener('click', closeBrief);
    el.addEventListener('click', e => { if (e.target.closest('[data-endbrief]')) closeBrief(); });
    addEventListener('keydown', e => {
      if (el.hidden) return;
      if (e.key === 'ArrowRight') showSlide(BR.i + 1);
      if (e.key === 'ArrowLeft') showSlide(BR.i - 1);
      if (e.key === ' ') { e.preventDefault(); pauseBrief(!BR.paused); }
    });
    document.addEventListener('visibilitychange', () => { if (document.hidden && !el.hidden) pauseBrief(true); });
  })();
  $('#briefBtn').addEventListener('click', () => { buzz(); openBrief(); });

  /* ---------------------------------------------------------------- навигация по разделам */
  function goTo(id) {
    const sec = document.getElementById(id); if (!sec) return;
    const y = sec.getBoundingClientRect().top + scrollY - hdrH() - 10;
    scrollTo({ top: Math.max(0, y), behavior: reduce() ? 'auto' : 'smooth' });
  }
  function moveInd(btn) {
    const ind = $('#segInd'), w = btn.offsetWidth;
    if (ind._w !== w) { ind.style.width = w + 'px'; ind._w = w; }
    ind.style.transform = `translate3d(${btn.offsetLeft}px, 0, 0)`;
    $$('#seg button').forEach(b => b.classList.toggle('on', b === btn));
  }
  $('#seg').addEventListener('click', e => { const b = e.target.closest('[data-sec]'); if (b) { moveInd(b); goTo(b.dataset.sec); } });
  let spyRaf = 0;
  addEventListener('scroll', () => {
    cancelAnimationFrame(spyRaf);
    spyRaf = requestAnimationFrame(() => {
      const line = hdrH() + innerHeight * .28;
      let cur = 'radar';
      SECS.forEach(id => { const s = document.getElementById(id); if (s && s.getBoundingClientRect().top <= line) cur = id; });
      if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = 'all';
      const b = $(`#seg [data-sec="${cur}"]`); if (b && !b.classList.contains('on')) moveInd(b);
    });
  }, { passive: true });
  // на телефоне resize прилетает при каждом скрытии адресной строки — карту перерисовываем только при смене ширины
  let lastW = innerWidth;
  addEventListener('resize', () => {
    const b = $('#seg .on'); if (b) moveInd(b);
    if (Math.abs(innerWidth - lastW) < 2) return;
    lastW = innerWidth; renderMap('fade');
  });

  /* ---------------------------------------------------------------- смена юнита */
  let deferT = 0;
  function setUnit(rk, how = {}) {
    if (!byRk[rk] || rk === S.unit) return;
    S.unit = rk;
    if (!S.pinned) S.metric = defaultMetric(rk);
    save();
    const zoom = !reduce() && (how.mode === 'in' || how.mode === 'out');
    $('#unitName').textContent = byRk[rk].functional_unit_nm;
    // во время зума на экране только карта и шапка: радар, карточки и список перерисовываем после анимации,
    // чтобы кадры зума оставались свободными
    clearTimeout(deferT);
    const rest = () => anchored(() => { updateRadar(false); renderIssues(true); renderList(); });
    if (zoom) { anchored(() => renderMap(how.mode, how)); deferT = setTimeout(rest, ZDUR + 40); }
    else { anchored(() => renderMap(how.mode || 'fade', how)); rest(); }
  }

  $('#themeBtn').addEventListener('click', () => {
    const order = ['', 'light', 'dark'], cur = document.documentElement.getAttribute('data-theme') || '';
    const nx = order[(order.indexOf(cur) + 1) % order.length];
    if (nx) document.documentElement.setAttribute('data-theme', nx); else document.documentElement.removeAttribute('data-theme');
  });

  /* ---------------------------------------------------------------- первый кадр: сначала радар, остальное — следом */
  const first = !reduce();
  if (first) document.body.classList.add('intro');
  updateRadar(true);
  moveInd($('#seg .on'));
  const h = (location.hash || '').slice(1);
  idle(() => {
    renderIssues(false);
    renderMap('init');
    renderList();
    if (h === 'brief') setTimeout(openBrief, first ? 500 : 0);
    else if (['issues', 'map', 'all'].includes(h)) goTo(h);
  });
  if (first) setTimeout(() => document.body.classList.remove('intro'), 1500);
})();
</script>
